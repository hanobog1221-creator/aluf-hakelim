<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>רווחיות מוצרים | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--bad:#a51e28;--warn:#8b6500}*{box-sizing:border-box}body{margin:0;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f4;color:#171717}button{font:inherit}.top{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;border-bottom:1px solid #263342}.topin{max-width:1240px;margin:auto;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}.links{display:flex;gap:7px;flex-wrap:wrap}.links a,.links button{color:#fff;text-decoration:none;border:1px solid #38485a;background:#17212d;border-radius:9px;padding:8px 10px;font-weight:850}.wrap{max-width:1240px;margin:20px auto;padding:0 14px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:13px}.toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.toolbar h1{margin:0 0 5px;font-size:25px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.btn{border:0;border-radius:10px;background:var(--yellow);padding:10px 13px;font-weight:950;cursor:pointer}.btn.dark{background:#111923;color:#fff}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.stat{background:#f7f9fb;border-radius:11px;padding:12px}.stat b{display:block;font-size:22px}.stat small{color:var(--muted)}.notice{background:#fff8d8;border:1px solid #efd36d;border-radius:11px;padding:11px 13px;margin-top:12px;font-size:13px;line-height:1.55}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{width:100%;border-collapse:collapse;min-width:1180px}th,td{padding:11px 10px;border-bottom:1px solid #edf0f2;text-align:right;vertical-align:middle;font-size:13px}th{background:#f7f9fb;font-size:12px;position:sticky;top:0;z-index:1}td.name{font-weight:900;min-width:210px}.money{font-weight:850;white-space:nowrap}.profit.ok{color:var(--ok)}.profit.bad{color:var(--bad)}.unknown{color:var(--muted);font-size:12px}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;background:#eef1f4}.pill.ok{background:#e5f7ed;color:var(--ok)}.pill.warn{background:#fff4cf;color:var(--warn)}.pill.bad{background:#ffe8e9;color:var(--bad)}.cards{display:none}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.card h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#f7f9fb;border-radius:9px;padding:9px}.box small{display:block;color:var(--muted);margin-bottom:4px}.box b{font-size:14px}.login{text-align:center;padding:42px 18px}.login a{display:inline-block;margin-top:12px;color:#111;text-decoration:none;background:var(--yellow);padding:10px 14px;border-radius:10px;font-weight:900}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.tableWrap{display:none}.cards{display:block}}@media(max-width:480px){.summary,.grid{grid-template-columns:1fr}.topin{align-items:flex-start}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · רווחיות</div><div class="links"><a href="/admin">ניהול</a><a href="/suppliers">ספקים</a><a href="/accounting">חשבונות</a><button id="refreshBtn">רענן</button></div></div></div>
<main class="wrap" id="app"><section class="panel"><div class="muted">טוען נתוני רווחיות...</div></section></main>
<script>
const app=document.getElementById('app');
const refreshBtn=document.getElementById('refreshBtn');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}
function money(v){const n=num(v);return n==null?'—':'₪'+n.toFixed(2)}
function pct(v){const n=num(v);return n==null?'—':n.toFixed(1)+'%'}
function dt(v){if(!v)return '—';try{return new Date(v).toLocaleString('he-IL')}catch{return String(v)}}
function calc(p){
  const sale=num(p.selling_price)||0;
  const supplier=num(p.supplier_price_ils) ?? (String(p.supplier_currency||'').toUpperCase()==='ILS'?num(p.supplier_price):null);
  const shipping=p.supplier_shipping_available===true?num(p.supplier_shipping):null;
  const totalCost=supplier!=null&&shipping!=null?Number((supplier+shipping).toFixed(2)):null;
  // Customer shipping mirrors the current supplier shipping quote, so gross product profit is sale - supplier product cost.
  const customerTotal=shipping!=null?Number((sale+shipping).toFixed(2)):null;
  const grossProfit=supplier!=null?Number((sale-supplier).toFixed(2)):null;
  const margin=grossProfit!=null&&sale>0?Number((grossProfit/sale*100).toFixed(1)):null;
  const minProfit=num(p.minimum_profit);
  return {sale,supplier,shipping,totalCost,customerTotal,grossProfit,margin,minProfit};
}
function profitState(f){if(f.grossProfit==null)return 'warn';if(f.minProfit!=null&&f.grossProfit<f.minProfit)return 'bad';return f.grossProfit>=0?'ok':'bad'}
function statusText(p,f){if(f.supplier==null)return ['ממתין לעלות ספק','warn'];if(p.supplier_shipping_available!==true)return [p.supplier_shipping_available===false?'אין משלוח':'ממתין למשלוח','warn'];if(!p.fulfillment_ready)return ['עדיין לא מוכן לאוטומציה','warn'];return ['נתונים מוכנים','ok']}
function render(data){
  const products=data.products||[];const settings=data.settings||{};const rows=products.map(p=>({p,f:calc(p)}));const known=rows.filter(x=>x.f.supplier!=null);const knownProfit=known.filter(x=>x.f.grossProfit!=null);const avgMargin=knownProfit.length?knownProfit.reduce((s,x)=>s+x.f.margin,0)/knownProfit.length:null;const totalPotential=knownProfit.reduce((s,x)=>s+x.f.grossProfit,0);const ready=products.filter(p=>p.fulfillment_ready===true).length;
  const summary=`<section class="panel"><div class="toolbar"><div><h1>רווחיות לפי מוצר</h1><div class="muted">החישוב משתמש במחיר המכירה ובעלות הספק החיה. רווח מוצג לפני עמלת סליקה ומס. עלות משלוח מוצגת בנפרד.</div></div></div><div class="summary"><div class="stat"><b>${products.length}</b><small>מוצרים</small></div><div class="stat"><b>${known.length}</b><small>עם עלות ספק ידועה</small></div><div class="stat"><b>${money(totalPotential)}</b><small>סך רווח גולמי ליחידה מכל המוצרים הידועים</small></div><div class="stat"><b>${pct(avgMargin)}</b><small>אחוז רווח ממוצע</small></div><div class="stat"><b>${ready}</b><small>מוכנים לאוטומציה</small></div></div><div class="notice">עמלת סליקה ורווח אחרי סליקה יתווספו אוטומטית אחרי חיבור ספק הסליקה. כרגע לא מוצג מספר משוער כדי שלא נטעה בחישוב. מינימום רווח כללי: ${settings.minimum_profit_ils==null?'לא הוגדר':money(settings.minimum_profit_ils)}.</div></section>`;
  const table=`<div class="tableWrap"><table><thead><tr><th>מוצר</th><th>מחיר מכירה</th><th>עלות מוצר ספק</th><th>משלוח ספק</th><th>עלות כוללת שלך</th><th>מחיר ללקוח כולל משלוח</th><th>רווח גולמי</th><th>אחוז רווח</th><th>מינימום רווח</th><th>עמלת סליקה</th><th>רווח אחרי סליקה</th><th>סטטוס</th><th>סנכרון אחרון</th></tr></thead><tbody>${rows.map(({p,f})=>{const st=statusText(p,f);return `<tr><td class="name">${esc(p.name)}<div class="unknown">${esc(p.id)}</div></td><td class="money">${money(f.sale)}</td><td class="money">${f.supplier==null?'<span class="unknown">ממתין לסנכרון</span>':money(f.supplier)}</td><td class="money">${p.supplier_shipping_available===false?'<span class="unknown">לא זמין</span>':f.shipping==null?'<span class="unknown">ממתין לסנכרון</span>':money(f.shipping)}</td><td class="money">${f.totalCost==null?'<span class="unknown">ממתין לנתונים</span>':money(f.totalCost)}</td><td class="money">${f.customerTotal==null?'<span class="unknown">ממתין למשלוח</span>':money(f.customerTotal)}</td><td class="money profit ${profitState(f)}">${f.grossProfit==null?'—':money(f.grossProfit)}</td><td class="money">${pct(f.margin)}</td><td class="money">${f.minProfit==null?'<span class="unknown">ברירת מחדל כללית</span>':money(f.minProfit)}</td><td><span class="unknown">ממתין לסליקה</span></td><td><span class="unknown">ממתין לסליקה</span></td><td><span class="pill ${st[1]}">${esc(st[0])}</span></td><td>${esc(dt(p.last_sync_at))}</td></tr>`}).join('')}</tbody></table></div>`;
  const cards=`<div class="cards">${rows.map(({p,f})=>{const st=statusText(p,f);return `<section class="card"><h2>${esc(p.name)}</h2><div class="grid"><div class="box"><small>מחיר מכירה</small><b>${money(f.sale)}</b></div><div class="box"><small>עלות מוצר ספק</small><b>${f.supplier==null?'ממתין לסנכרון':money(f.supplier)}</b></div><div class="box"><small>משלוח ספק</small><b>${f.shipping==null?'ממתין לסנכרון':money(f.shipping)}</b></div><div class="box"><small>עלות כוללת שלך</small><b>${f.totalCost==null?'ממתין לנתונים':money(f.totalCost)}</b></div><div class="box"><small>רווח גולמי</small><b class="profit ${profitState(f)}">${f.grossProfit==null?'—':money(f.grossProfit)}</b></div><div class="box"><small>אחוז רווח</small><b>${pct(f.margin)}</b></div><div class="box"><small>עמלת סליקה</small><b>ממתין לחיבור</b></div><div class="box"><small>סטטוס</small><b><span class="pill ${st[1]}">${esc(st[0])}</span></b></div></div></section>`}).join('')}</div>`;
  app.innerHTML=summary+(products.length?table+cards:'<section class="panel">אין מוצרים.</section>');
}
async function load(){refreshBtn.disabled=true;try{const r=await fetch('/api/admin/products',{headers:{accept:'application/json'},cache:'no-store'});if(r.status===401){app.innerHTML='<section class="panel login"><h2>צריך להתחבר לאדמין</h2><div class="muted">המסך הזה מוגן ולא חושף עלויות ספק לציבור.</div><a href="/admin">כניסה לניהול</a></section>';return}const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');render(d)}catch(e){app.innerHTML='<section class="panel"><b>לא הצלחנו לטעון את נתוני הרווחיות.</b><div class="muted" style="margin-top:6px">נסה לרענן או להיכנס מחדש לאדמין.</div></section>'}finally{refreshBtn.disabled=false}}
refreshBtn.addEventListener('click',load);load();
</script>
</body>
</html>
