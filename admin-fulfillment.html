<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>בדיקת הזמנות ספק | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--bad:#a51e28;--warn:#8b6500}*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#171717;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:var(--dark);color:#fff}.topin{max-width:1050px;margin:auto;padding:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:950;font-size:21px}.brand span{color:var(--yellow)}.links{display:flex;gap:7px;flex-wrap:wrap}.links a{color:#fff;text-decoration:none;border:1px solid #3b4857;border-radius:9px;padding:8px 10px;font-weight:850}.wrap{max-width:1050px;margin:20px auto;padding:0 14px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:12px}.panel{padding:16px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.toolbar h1{margin:0;font-size:24px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.notice{margin-top:12px;background:#fff8d8;border:1px solid #efd36d;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6}.btn{border:0;background:var(--yellow);border-radius:9px;padding:9px 12px;font-weight:950;cursor:pointer}.btn.dark{background:#111923;color:#fff}.btn:disabled{opacity:.55}.card{overflow:hidden}.head{padding:13px 14px;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;gap:10px}.head h2{font-size:16px;margin:0 0 3px}.pill{border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;background:#eef1f4}.pill.ok{background:#e5f7ed;color:var(--ok)}.pill.warn{background:#fff4cf;color:var(--warn)}.body{padding:14px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{background:#f7f9fb;border-radius:9px;padding:9px}.box b{display:block;font-size:11px;color:#66717c;margin-bottom:4px}.items{margin-top:9px;background:#fafbfc;border-radius:9px;padding:9px;font-size:12px;line-height:1.6}.result{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6;background:#f4f6f8}.result.ok{background:#effaf3;color:#155d35;border:1px solid #b8dec7}.result.bad{background:#fff3f3;color:#8c1822;border:1px solid #ffd0d2}.empty{text-align:center;padding:35px;color:#7a858f}.login{text-align:center;padding:40px 20px}@media(max-width:700px){.meta{grid-template-columns:1fr 1fr}}@media(max-width:450px){.meta{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · Fulfillment</div><div class="links"><a href="/admin">ניהול</a><a href="/suppliers">ספקים</a></div></div></div>
<main class="wrap" id="app"><section class="panel"><div class="muted">טוען...</div></section></main>
<script>
const app=document.getElementById('app');
let orders=[];
const results=new Map();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '₪'+Number(v||0).toFixed(2)}
function dt(v){if(!v)return '—';try{return new Date(v).toLocaleString('he-IL')}catch{return String(v)}}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok){const e=new Error(d.error||'request_failed');e.data=d;throw e}return d}
function supplierIds(o){const ids=Array.isArray(o.supplier_order_ids)?o.supplier_order_ids:[];if(o.supplier_order_id&&!ids.includes(o.supplier_order_id))ids.unshift(o.supplier_order_id);return ids.filter(Boolean)}
function orderCard(o){const ids=supplierIds(o);const result=results.get(o.order_id);const final=Number(o.total||0)+Number(o.shipping_cost||0);const items=(o.items||[]).map(i=>`${esc(i.name)} × ${esc(i.qty)}`).join('<br>')||'—';return `<section class="card"><div class="head"><div><h2>${esc(o.order_id)}</h2><div class="muted">${esc(dt(o.created_at))}</div></div><span class="pill ${ids.length?'warn':'ok'}">${ids.length?'כבר קיימת הזמנת ספק':'טרם הוזמן מהספק'}</span></div><div class="body"><div class="meta"><div class="box"><b>לקוח</b>${esc(o.customer?.fullName||'—')}</div><div class="box"><b>תשלום</b>${esc(o.payment_status||'—')}</div><div class="box"><b>סה״כ לקוח</b>${money(final)}</div><div class="box"><b>הזמנות ספק</b>${ids.length?ids.map(esc).join(', '):'—'}</div></div><div class="items">${items}</div><div style="margin-top:10px"><button class="btn dark" ${o.payment_status==='paid'&&!ids.length?'':'disabled'} onclick="preflight('${esc(o.order_id)}',this)">הרץ בדיקת Preflight</button></div>${result?`<div class="result ${result.ok?'ok':'bad'}">${result.html}</div>`:''}</div></section>`}
function render(){const paid=orders.filter(o=>o.payment_status==='paid');app.innerHTML=`<section class="panel"><div class="toolbar"><div><h1>בדיקת הזמנה אצל הספק</h1><div class="muted">המסך הזה לא מבצע הזמנה ב-AliExpress. הוא רק מאמת שההזמנה מוכנה ובונה בקשת ספק בטוחה.</div></div><button class="btn" onclick="load()">רענן</button></div><div class="notice"><b>מצב בטוח:</b> אין כאן כפתור “הזמן באמת”. הוא יתווסף רק אחרי שנאמת את הרשאת AliExpress ואת שלב התשלום אצל הספק.</div></section>${paid.length?paid.map(orderCard).join(''):'<div class="panel empty">אין עדיין הזמנות ששולמו.</div>'}`}
async function preflight(orderId,button){button.disabled=true;results.set(orderId,{ok:true,html:'בודק מלאי, מחיר, משלוח, SKU ורווח...'});render();try{const d=await api('/api/aliexpress/order-preflight',{method:'POST',body:JSON.stringify({orderId})});results.set(orderId,{ok:true,html:`✅ מוכן ל-Preflight · משלוח ששולם: ${money(d.chargedShipping)} · משלוח ספק עדכני: ${money(d.freshSupplierShipping)} · מזהה בדיקה: ${esc(d.requestFingerprint?.slice(0,12)||'—')} · לא נשלחה הזמנה אמיתית.`})}catch(e){const v=e.data?.validation||{};results.set(orderId,{ok:false,html:`⛔ הבדיקה נעצרה: ${esc(v.reason||e.data?.detail||e.message)}`})}render()}
function showLogin(){app.innerHTML='<section class="panel login"><h2>צריך להתחבר לניהול</h2><div class="muted">הנתונים מוגנים באותה התחברות של ה-Admin.</div><div style="margin-top:12px"><a class="btn" href="/admin" style="text-decoration:none;color:#171717">כניסה לניהול</a></div></section>'}
async function load(){try{const d=await api('/api/admin/orders?limit=200');orders=d.orders||[];render()}catch(e){if(e.message==='unauthorized')showLogin();else app.innerHTML='<section class="panel">לא הצלחנו לטעון הזמנות.</section>'}}
load();
</script>
</body>
</html>
