<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>חיבור ספקים | אלוף הכלים</title><style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#171717;font-family:Arial,sans-serif}.top{background:var(--dark);color:#fff}.topin{max-width:1100px;margin:auto;padding:14px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}.top a{color:#fff;text-decoration:none;border:1px solid #38485a;border-radius:9px;padding:8px 10px}.wrap{max-width:1100px;margin:20px auto;padding:0 14px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:12px}.panel,.card{padding:16px}h1{margin:0 0 5px;font-size:24px}.muted{font-size:12px;color:var(--muted);line-height:1.55}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.head{display:flex;justify-content:space-between;gap:8px}.head h2{margin:0;font-size:18px}.pill{border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;background:#ffe8e9;color:var(--bad)}.pill.ok{background:#e5f7ed;color:var(--ok)}.steps{margin:12px 0;font-size:13px;line-height:1.7}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:11px;font-weight:850;color:#66717c}.field input{border:1px solid #cfd6dd;border-radius:9px;padding:9px}.btn{border:0;border-radius:10px;background:var(--yellow);padding:10px 13px;font-weight:950;cursor:pointer;margin-top:10px}.btn.light{background:#fff;border:1px solid #d7dde3;color:#171717;text-decoration:none;display:inline-block}.msg{margin-top:8px;font-size:12px;font-weight:850}.notice{background:#fff8d8;border:1px solid #efd36d;border-radius:10px;padding:11px;margin-top:12px;font-size:12px;line-height:1.6}@media(max-width:760px){.cards,.fields{grid-template-columns:1fr}}
</style></head><body><div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · חיבור ספקים</div><div><a href="/supplier-optimizer">מנוע מחיר</a> <a href="/suppliers">ספקים</a></div></div></div><main class="wrap" id="app"><section class="panel">טוען...</section></main><script>
const app=document.getElementById('app');let connectors=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json'}}),d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');return d}
function card(c){const state=c.enabled?'פעיל להזמנות אמיתיות':c.sandboxVerified?'Sandbox מאומת ללא חיוב':c.orderVerified?'מוכן להפעלה':c.apiVerified?'מוכן לבדיקת Sandbox':c.configured?'ממתין לאימות API':'נדרש חיבור',signup=c.registrationUrl||c.documentationUrl;return `<section class="card"><div class="head"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.id)} · ${c.supportsIsrael===true?'משלוח לישראל קיים':c.supportsIsrael===false?'ללא משלוח לישראל':'משלוח לישראל דורש אימות'}</div></div><span class="pill ${c.enabled||c.sandboxVerified?'ok':''}">${esc(state)}</span></div><div class="steps">✓ נוסף למנוע הרב־ספקי<br>${c.configured?'✓':'○'} פרטי API נשמרו<br>${c.apiVerified?'✓':'○'} חיבור API אומת<br>${c.sandboxVerified?'✓':'○'} מחיר, משלוח, הזמנה ותשלום מדומה אומתו<br>${c.liveOrderVerified?'✓':'○'} הזמנה ומשלוח אמיתיים אומתו</div><div class="fields"><div class="field"><label>API Key</label><input id="key-${c.id}" type="password" autocomplete="new-password"></div><div class="field"><label>Client ID (אם נדרש)</label><input id="id-${c.id}" autocomplete="off"></div><div class="field"><label>Client Secret (אם נדרש)</label><input id="secret-${c.id}" type="password" autocomplete="new-password"></div><div class="field"><label>כתובת API רשמית (אם נמסרה)</label><input id="url-${c.id}" placeholder="https://"></div></div><button class="btn" onclick="save('${c.id}',this)">שמור פרטי חיבור</button> ${c.apiVerificationSupported&&c.configured&&!c.apiVerified?`<button class="btn" onclick="verifyConnector('${c.id}',this)">בדוק API</button>`:''} ${c.sandboxVerificationSupported&&c.apiVerified&&!c.sandboxVerified?`<button class="btn" onclick="verifySandbox('${c.id}',this)">אימות Sandbox ללא חיוב</button>`:''} <a class="btn light" href="${esc(signup)}" target="_blank" rel="noopener">פתיחת הרשמה</a> <a class="btn light" href="${esc(c.documentationUrl)}" target="_blank" rel="noopener">מסמכי API</a><div class="msg" id="msg-${c.id}">${esc(c.lastError||'')}</div></section>`}
function render(){app.innerHTML=`<section class="panel"><h1>חיבור ספקים נוספים</h1><div class="muted">אימות Sandbox מאפשר לבדוק את כל זרימת CJ ללא חיוב וללא משלוח. הזמנות חיות נשארות חסומות עד אישור נפרד.</div><div class="notice">שמירת מפתח או בדיקת Sandbox אינן מפעילות תשלום אמיתי. המערכת מסמנת בנפרד אימות מדומה ואימות חי.</div></section><div class="cards">${connectors.map(card).join('')}</div>`}
async function load(){const d=await api('/api/admin/supplier-connectors');connectors=d.connectors||[];render()}async function save(id,button){button.disabled=true;const msg=document.getElementById('msg-'+id);try{await api('/api/admin/supplier-connectors',{method:'POST',body:JSON.stringify({provider:id,apiKey:document.getElementById('key-'+id).value,clientId:document.getElementById('id-'+id).value,clientSecret:document.getElementById('secret-'+id).value,baseUrl:document.getElementById('url-'+id).value})});msg.textContent='פרטי החיבור נשמרו בבטחה. נדרש כעת אימות API.';await load()}catch(e){if(e.message==='unauthorized')return login();msg.textContent='לא ניתן לשמור: '+e.message}finally{button.disabled=false}}async function verifyConnector(id,button){button.disabled=true;const msg=document.getElementById('msg-'+id);try{await api('/api/admin/supplier-connectors',{method:'POST',body:JSON.stringify({provider:id,action:'verify'})});msg.textContent='ה-API אומת. כעת אפשר לבצע בדיקת Sandbox ללא חיוב.';await load()}catch(e){if(e.message==='unauthorized')return login();msg.textContent='בדיקת API נכשלה: '+e.message}finally{button.disabled=false}}async function verifySandbox(id,button){button.disabled=true;const msg=document.getElementById('msg-'+id);msg.textContent='בודק מוצר, משלוח לישראל, הזמנה ותשלום מדומה…';try{const d=await api('/api/admin/supplier-connectors',{method:'POST',body:JSON.stringify({provider:id,action:'verify_sandbox'})});const v=d.verification||{};msg.textContent=`Sandbox אומת ללא חיוב. מוצר: $${v.product?.priceUsd??'-'} · משלוח: $${v.shipping?.priceUsd??'-'} · ${v.shipping?.logisticName||''}`;await load()}catch(e){if(e.message==='unauthorized')return login();msg.textContent='בדיקת Sandbox נכשלה: '+e.message}finally{button.disabled=false}}function login(){app.innerHTML='<section class="panel"><h2>צריך להתחבר לניהול</h2><a href="/admin">כניסה לניהול</a></section>'}load().catch(e=>e.message==='unauthorized'?login():app.innerHTML='<section class="panel">לא הצלחנו לטעון את חיבורי הספקים.</section>');
</script></body></html>
