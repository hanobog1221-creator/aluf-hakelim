<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>חשבונות ודוחות | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--warn:#8b6500;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f4;color:#171717}button,input,select{font:inherit}.top{background:var(--dark);color:#fff;border-bottom:1px solid #263342}.topin{max-width:1000px;margin:auto;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}.top a{color:#fff;text-decoration:none;font-weight:850}.wrap{max-width:1000px;margin:22px auto;padding:0 14px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:13px}.panel h1,.panel h2{margin:0 0 7px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.warn{background:#fff8d8;border:1px solid #efd36d;border-radius:11px;padding:11px 13px;margin:12px 0;font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}.field label{font-size:12px;font-weight:900}.field input,.field select{border:1px solid #cfd5dc;border-radius:10px;padding:11px;background:#fff}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;background:var(--yellow);padding:10px 14px;font-weight:950;cursor:pointer}.btn.dark{background:#111923;color:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.msg{font-size:13px;font-weight:850;color:var(--ok)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:12px 0}.stat{background:#f7f9fb;border-radius:11px;padding:12px}.stat b{display:block;font-size:23px}.stat small{color:var(--muted)}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.tools .field{min-width:150px;margin:0}.table{overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:11px}.table table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:9px 10px;border-bottom:1px solid #edf0f2;text-align:right;font-size:12px;white-space:nowrap}.table th{background:#f7f9fb}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.pill.ok{background:#e5f7ed;color:var(--ok)}.pill.warn{background:#fff4cf;color:var(--warn)}.login{text-align:center;padding:50px 20px}@media(max-width:720px){.grid,.stats{grid-template-columns:1fr 1fr}.stats{gap:7px}.full{grid-column:1/-1}.brand{font-size:18px}}@media(max-width:460px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.topin{align-items:flex-start}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · חשבונות ודוחות</div><a href="/admin">חזרה לניהול</a></div></div>
<main class="wrap" id="app"><div class="panel"><div class="muted">טוען...</div></div></main>
<script>
const app=document.getElementById('app');let settings={},orders=[],summary={};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '₪'+Number(v||0).toFixed(2)}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');return d}
function typeHe(v){return ({exempt:'עוסק פטור',authorized:'עוסק מורשה',company:'חברה',other:'אחר'})[v]||'לא הוגדר'}
function docHe(v){return ({issued:'הופק',pending:'ממתין',failed:'נכשל',voided:'בוטל',not_issued:'לא הופק'})[v]||'לא הופק'}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function dateOnly(v){if(!v)return '';try{return new Date(v).toLocaleDateString('he-IL')}catch{return String(v)}}
function paidTotal(o){return Number(o.total||0)+Number(o.shipping_cost||0)}
function exportDetailed(){const header=['תאריך','מספר הזמנה','לקוח','טלפון','סכום מוצרים לפני הנחה','הנחה','משלוח','סכום ששולם','אמצעי סליקה','אסמכתת תשלום','סטטוס מסמך','סוג מסמך','מספר מסמך'];const lines=[header.map(csvCell).join(',')];for(const o of orders){const c=o.customer||{};lines.push([o.paid_at||o.created_at,o.order_id,c.fullName||'',c.phone||'',o.products_subtotal||0,o.discount_amount||0,o.shipping_cost||0,paidTotal(o),o.payment_provider||'',o.payment_reference||'',o.fiscal_document_status||'not_issued',o.fiscal_document_type||'',o.fiscal_document_number||''].map(csvCell).join(','))}download('\ufeff'+lines.join('\n'),`aluf-hakelim-accounting-${document.getElementById('year').value}.csv`)}
function exportMonthly(){const m={};for(const o of orders){const d=new Date(o.paid_at||o.created_at);const key=String(d.getMonth()+1).padStart(2,'0');m[key]??={orders:0,revenue:0,discounts:0,shipping:0};m[key].orders++;m[key].revenue+=paidTotal(o);m[key].discounts+=Number(o.discount_amount||0);m[key].shipping+=Number(o.shipping_cost||0)}const lines=[['חודש','מספר הזמנות','הכנסות','הנחות','משלוחים'].map(csvCell).join(',')];Object.keys(m).sort().forEach(k=>lines.push([k,m[k].orders,m[k].revenue.toFixed(2),m[k].discounts.toFixed(2),m[k].shipping.toFixed(2)].map(csvCell).join(',')));download('\ufeff'+lines.join('\n'),`aluf-hakelim-monthly-${document.getElementById('year').value}.csv`)}
function download(text,name){const blob=new Blob([text],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}
function render(){const y=new Date().getFullYear();app.innerHTML=`<section class="panel"><h1>הכנה להנהלת חשבונות</h1><div class="muted">כאן נשמור פרטי עסק ונרכז אוטומטית את כל ההזמנות ששולמו, כדי שיהיה קל להעביר נתונים לרואה חשבון/יועץ מס, לבנק או להכנת דיווחים.</div><div class="warn"><b>חשוב:</b> הייצוא מכאן הוא ריכוז פנימי בלבד. הוא לא מחליף קבלה או חשבונית חוקית. מסמך מס רשמי יופק בעתיד דרך מערכת חשבונאית מתאימה לאחר שנחבר סליקה ונפתח את העסק.</div></section><section class="panel"><h2>פרטי העסק</h2><div class="grid"><div class="field"><label>סוג עסק</label><select id="businessType"><option value="">עדיין לא הוגדר</option><option value="exempt" ${settings.business_type==='exempt'?'selected':''}>עוסק פטור</option><option value="authorized" ${settings.business_type==='authorized'?'selected':''}>עוסק מורשה</option><option value="company" ${settings.business_type==='company'?'selected':''}>חברה</option><option value="other" ${settings.business_type==='other'?'selected':''}>אחר</option></select></div><div class="field"><label>שם רשמי של העסק</label><input id="businessName" value="${esc(settings.business_legal_name||'')}"></div><div class="field"><label>מספר עוסק / ח.פ.</label><input id="businessTaxId" value="${esc(settings.business_tax_id||'')}" inputmode="numeric"></div><div class="field"><label>טלפון עסק</label><input id="businessPhone" value="${esc(settings.business_phone||'')}"></div><div class="field full"><label>כתובת העסק</label><input id="businessAddress" value="${esc(settings.business_address||'')}"></div></div><div class="row"><button class="btn" id="saveBusiness">שמור פרטי עסק</button><span class="msg" id="saveMsg"></span></div></section><section class="panel"><div class="tools"><div class="field"><label>שנת דוח</label><select id="year">${Array.from({length:6},(_,i)=>y-i).map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div><button class="btn dark" id="loadYear">טען שנה</button><button class="btn" id="exportDetailed">ייצוא מלא CSV</button><button class="btn" id="exportMonthly">סיכום חודשי CSV</button></div><div class="stats"><div class="stat"><b id="sOrders">0</b><small>הזמנות ששולמו</small></div><div class="stat"><b id="sRevenue">₪0</b><small>הכנסות שנרשמו</small></div><div class="stat"><b id="sDiscount">₪0</b><small>הנחות</small></div><div class="stat"><b id="sShipping">₪0</b><small>משלוחים</small></div><div class="stat"><b id="sDocs">0</b><small>מסמכים חסרים</small></div></div><div class="table"><table><thead><tr><th>תאריך</th><th>הזמנה</th><th>לקוח</th><th>שולם</th><th>סליקה</th><th>מסמך</th><th>מספר מסמך</th></tr></thead><tbody id="rows"><tr><td colspan="7">אין נתונים עדיין.</td></tr></tbody></table></div></section>`;document.getElementById('saveBusiness').onclick=saveBusiness;document.getElementById('loadYear').onclick=loadYear;document.getElementById('exportDetailed').onclick=exportDetailed;document.getElementById('exportMonthly').onclick=exportMonthly;loadYear()}
async function saveBusiness(){const b=document.getElementById('saveBusiness'),m=document.getElementById('saveMsg');b.disabled=true;m.textContent='שומר...';try{const body={action:'settings',whatsapp_enabled:settings.whatsapp_enabled===true,whatsapp_number:settings.whatsapp_number||null,whatsapp_message:settings.whatsapp_message||'',support_email:settings.support_email||null,support_hours:settings.support_hours||null,minimum_profit_ils:settings.minimum_profit_ils??null,business_type:document.getElementById('businessType').value||null,business_legal_name:document.getElementById('businessName').value.trim()||null,business_tax_id:document.getElementById('businessTaxId').value.trim()||null,business_address:document.getElementById('businessAddress').value.trim()||null,business_phone:document.getElementById('businessPhone').value.trim()||null};const d=await api('/api/admin/products',{method:'POST',body:JSON.stringify(body)});settings=d.settings||settings;m.textContent='נשמר ✓'}catch(e){m.textContent=e.message==='invalid_tax_id'?'מספר עוסק לא תקין':'שגיאה בשמירה'}finally{b.disabled=false}}
async function loadYear(){const year=document.getElementById('year').value;try{const d=await api('/api/admin/orders?accounting=1&year='+encodeURIComponent(year));orders=d.orders||[];summary=d.summary||{};document.getElementById('sOrders').textContent=summary.orders||0;document.getElementById('sRevenue').textContent=money(summary.revenue||0);document.getElementById('sDiscount').textContent=money(summary.discounts||0);document.getElementById('sShipping').textContent=money(summary.shipping||0);document.getElementById('sDocs').textContent=summary.documentsMissing||0;document.getElementById('rows').innerHTML=orders.length?orders.map(o=>`<tr><td>${esc(dateOnly(o.paid_at||o.created_at))}</td><td>${esc(o.order_id)}</td><td>${esc(o.customer?.fullName||'—')}</td><td>${money(paidTotal(o))}</td><td>${esc(o.payment_provider||'—')}</td><td><span class="pill ${o.fiscal_document_status==='issued'?'ok':'warn'}">${docHe(o.fiscal_document_status)}</span></td><td>${esc(o.fiscal_document_number||'—')}</td></tr>`).join(''):'<tr><td colspan="7">אין הזמנות ששולמו בשנה הזאת.</td></tr>'}catch(e){if(e.message==='unauthorized')app.innerHTML='<div class="panel login"><h2>צריך להתחבר לניהול</h2><div class="muted">העמוד מוגן באותה התחברות של ה-Admin.</div><div class="row" style="justify-content:center"><a class="btn" href="/admin" style="text-decoration:none;color:#171717">כניסה לניהול</a></div></div>';}}
(async()=>{try{const p=await api('/api/admin/products');settings=p.settings||{};render()}catch(e){if(e.message==='unauthorized')app.innerHTML='<div class="panel login"><h2>צריך להתחבר לניהול</h2><a href="/admin">כניסה לניהול</a></div>';else app.innerHTML='<div class="panel"><b>לא הצלחנו לטעון נתונים.</b></div>'}})();
</script>
</body>
</html>
