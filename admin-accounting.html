<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>חשבונות ודוחות | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--warn:#8b6500;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f4;color:#171717}button,input,select{font:inherit}.top{background:var(--dark);color:#fff;border-bottom:1px solid #263342}.topin{max-width:1100px;margin:auto;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}.toplinks{display:flex;gap:8px;flex-wrap:wrap}.top a{color:#fff;text-decoration:none;font-weight:850}.wrap{max-width:1100px;margin:22px auto;padding:0 14px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:13px}.panel h1,.panel h2{margin:0 0 7px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.warn{background:#fff8d8;border:1px solid #efd36d;border-radius:11px;padding:11px 13px;margin:12px 0;font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}.field label{font-size:12px;font-weight:900}.field input,.field select{border:1px solid #cfd5dc;border-radius:10px;padding:11px;background:#fff}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;background:var(--yellow);padding:10px 14px;font-weight:950;cursor:pointer;text-decoration:none;color:#171717;display:inline-block}.btn.dark{background:#111923;color:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.msg{font-size:13px;font-weight:850;color:var(--ok)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:12px 0}.stat{background:#f7f9fb;border-radius:11px;padding:12px}.stat b{display:block;font-size:22px}.stat small{color:var(--muted)}.stat.net{background:#eef9f2;border:1px solid #c6e9d3}.stat.refund{background:#fff3f3;border:1px solid #ffd0d2}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.tools .field{min-width:150px;margin:0}.table{overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:11px}.table table{width:100%;border-collapse:collapse;min-width:940px}.table th,.table td{padding:9px 10px;border-bottom:1px solid #edf0f2;text-align:right;font-size:12px;white-space:nowrap}.table th{background:#f7f9fb}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.pill.ok{background:#e5f7ed;color:var(--ok)}.pill.warn{background:#fff4cf;color:var(--warn)}.pill.bad{background:#ffe7e8;color:var(--bad)}.login{text-align:center;padding:50px 20px}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}.brand{font-size:18px}}@media(max-width:460px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.topin{align-items:flex-start}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · חשבונות ודוחות</div><div class="toplinks"><a href="/expenses">הוצאות</a><a href="/admin">חזרה לניהול</a></div></div></div>
<main class="wrap" id="app"><div class="panel"><div class="muted">טוען...</div></div></main>
<script>
const app=document.getElementById('app');let settings={},orders=[],summary={},expenses=[],expensesSummary={};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '₪'+Number(v||0).toFixed(2)}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');return d}
function docHe(v){return ({issued:'הופק',pending:'ממתין',failed:'נכשל',voided:'בוטל',not_issued:'לא הופק'})[v]||'לא הופק'}
function refundHe(v){return ({none:'אין',requested:'התבקש',approved:'אושר',rejected:'נדחה',processing:'בטיפול',partial:'החזר חלקי',refunded:'הוחזר'})[v]||v||'אין'}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function dateOnly(v){if(!v)return '';try{return new Date(v).toLocaleDateString('he-IL')}catch{return String(v)}}
function paidTotal(o){return Number(o.total||0)+Number(o.shipping_cost||0)}
function completedRefund(o){const completed=['partial','refunded'].includes(String(o.refund_status||''))||Boolean(o.refunded_at);if(!completed)return 0;const amount=Math.max(0,Number(o.refund_amount||0));return Math.min(amount,Math.max(0,paidTotal(o)))}
function exportDetailed(){const header=['תאריך תשלום','מספר הזמנה','לקוח','טלפון','סכום מוצרים לפני הנחה','הנחה','משלוח','ברוטו ששולם','החזר מצטבר להזמנה','נטו מצטבר להזמנה','סטטוס החזר','תאריך החזר','אמצעי סליקה','אסמכתת תשלום','סטטוס מסמך','סוג מסמך','מספר מסמך'];const lines=[header.map(csvCell).join(',')];for(const o of orders){const c=o.customer||{};const gross=paidTotal(o),refund=completedRefund(o);lines.push([o.paid_at||o.created_at,o.order_id,c.fullName||'',c.phone||'',o.products_subtotal||0,o.discount_amount||0,o.shipping_cost||0,gross,refund,(gross-refund).toFixed(2),refundHe(o.refund_status),o.refunded_at||'',o.payment_provider||'',o.payment_reference||'',o.fiscal_document_status||'not_issued',o.fiscal_document_type||'',o.fiscal_document_number||''].map(csvCell).join(','))}download('\ufeff'+lines.join('\n'),`aluf-hakelim-accounting-${document.getElementById('year').value}.csv`)}
function exportMonthly(){const m={};function bucket(key){m[key]??={orders:0,gross:0,refunds:0,net:0,operatingExpenses:0,discounts:0,shipping:0}}for(const o of orders){const d=new Date(o.paid_at||o.created_at);if(!Number.isFinite(d.getTime()))continue;const key=String(d.getMonth()+1).padStart(2,'0');bucket(key);m[key].orders++;m[key].gross+=paidTotal(o);m[key].discounts+=Number(o.discount_amount||0);m[key].shipping+=Number(o.shipping_cost||0)}for(const e of expenses){const d=new Date(String(e.expense_date)+'T00:00:00');if(!Number.isFinite(d.getTime()))continue;const key=String(d.getMonth()+1).padStart(2,'0');bucket(key);if(e.category==='refund')m[key].refunds+=Number(e.amount||0);else m[key].operatingExpenses+=Number(e.amount||0)}const lines=[['חודש','מספר הזמנות','הכנסה ברוטו','החזרים שבוצעו','הכנסה נטו','הוצאות אחרות','יתרה משוערת לפני מס','הנחות','משלוחים שנגבו'].map(csvCell).join(',')];Object.keys(m).sort().forEach(k=>{m[k].net=m[k].gross-m[k].refunds;lines.push([k,m[k].orders,m[k].gross.toFixed(2),m[k].refunds.toFixed(2),m[k].net.toFixed(2),m[k].operatingExpenses.toFixed(2),(m[k].net-m[k].operatingExpenses).toFixed(2),m[k].discounts.toFixed(2),m[k].shipping.toFixed(2)].map(csvCell).join(','))});download('\ufeff'+lines.join('\n'),`aluf-hakelim-monthly-${document.getElementById('year').value}.csv`)}
function download(text,name){const blob=new Blob([text],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}
function render(){const y=new Date().getFullYear();app.innerHTML=`<section class="panel"><h1>הכנה להנהלת חשבונות</h1><div class="muted">כאן נשמור פרטי עסק ונרכז אוטומטית הכנסות, החזרים והוצאות כדי שיהיה קל להעביר נתונים לרואה חשבון/יועץ מס, לבנק או להכנת דיווחים.</div><div class="warn"><b>חשוב:</b> הנתונים והייצוא מכאן הם ריכוז פנימי בלבד. הם לא מחליפים קבלה, חשבונית או דוח רשמי. החזר נספר לפי התאריך שבו ההחזר בוצע בפועל.</div></section><section class="panel"><h2>פרטי העסק</h2><div class="grid"><div class="field"><label>סוג עסק</label><select id="businessType"><option value="">עדיין לא הוגדר</option><option value="exempt" ${settings.business_type==='exempt'?'selected':''}>עוסק פטור</option><option value="authorized" ${settings.business_type==='authorized'?'selected':''}>עוסק מורשה</option><option value="company" ${settings.business_type==='company'?'selected':''}>חברה</option><option value="other" ${settings.business_type==='other'?'selected':''}>אחר</option></select></div><div class="field"><label>שם רשמי של העסק</label><input id="businessName" value="${esc(settings.business_legal_name||'')}"></div><div class="field"><label>מספר עוסק / ח.פ.</label><input id="businessTaxId" value="${esc(settings.business_tax_id||'')}" inputmode="numeric"></div><div class="field"><label>טלפון עסק</label><input id="businessPhone" value="${esc(settings.business_phone||'')}"></div><div class="field full"><label>כתובת העסק</label><input id="businessAddress" value="${esc(settings.business_address||'')}"></div></div><div class="row"><button class="btn" id="saveBusiness">שמור פרטי עסק</button><a class="btn dark" href="/expenses">ניהול הוצאות</a><span class="msg" id="saveMsg"></span></div></section><section class="panel"><div class="tools"><div class="field"><label>שנת דוח</label><select id="year">${Array.from({length:6},(_,i)=>y-i).map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div><button class="btn dark" id="loadYear">טען שנה</button><button class="btn" id="exportDetailed">ייצוא עסקאות CSV</button><button class="btn" id="exportMonthly">סיכום חודשי CSV</button></div><div class="stats"><div class="stat"><b id="sOrders">0</b><small>מכירות ששולמו</small></div><div class="stat"><b id="sGross">₪0</b><small>הכנסה ברוטו</small></div><div class="stat refund"><b id="sRefunds">₪0</b><small>החזרים שבוצעו השנה</small></div><div class="stat"><b id="sRevenue">₪0</b><small>הכנסה נטו</small></div><div class="stat"><b id="sExpenses">₪0</b><small>הוצאות אחרות</small></div><div class="stat net"><b id="sNet">₪0</b><small>יתרה משוערת לפני מס</small></div><div class="stat"><b id="sDiscount">₪0</b><small>הנחות</small></div><div class="stat"><b id="sShipping">₪0</b><small>משלוחים שנגבו</small></div><div class="stat"><b id="sDocs">0</b><small>מסמכים חסרים</small></div><div class="stat"><b id="sExpenseCount">0</b><small>רשומות הוצאה</small></div></div><div class="table"><table><thead><tr><th>תאריך</th><th>הזמנה</th><th>לקוח</th><th>ברוטו</th><th>החזר מצטבר</th><th>נטו מצטבר</th><th>סליקה</th><th>מסמך</th><th>מספר מסמך</th></tr></thead><tbody id="rows"><tr><td colspan="9">אין נתונים עדיין.</td></tr></tbody></table></div></section>`;document.getElementById('saveBusiness').onclick=saveBusiness;document.getElementById('loadYear').onclick=loadYear;document.getElementById('exportDetailed').onclick=exportDetailed;document.getElementById('exportMonthly').onclick=exportMonthly;loadYear()}
async function saveBusiness(){const b=document.getElementById('saveBusiness'),m=document.getElementById('saveMsg');b.disabled=true;m.textContent='שומר...';try{const body={action:'settings',business_type:document.getElementById('businessType').value||null,business_legal_name:document.getElementById('businessName').value.trim()||null,business_tax_id:document.getElementById('businessTaxId').value.trim()||null,business_address:document.getElementById('businessAddress').value.trim()||null,business_phone:document.getElementById('businessPhone').value.trim()||null};const d=await api('/api/admin/products',{method:'POST',body:JSON.stringify(body)});settings=d.settings||settings;m.textContent='נשמר ✓'}catch(e){m.textContent=e.message==='invalid_tax_id'?'מספר עוסק לא תקין':'שגיאה בשמירה'}finally{b.disabled=false}}
async function loadYear(){const year=document.getElementById('year').value;try{const d=await api('/api/admin/orders?accounting=1&year='+encodeURIComponent(year));orders=d.orders||[];expenses=d.expenses||[];expensesSummary=d.expensesSummary||{};summary=d.summary||{};document.getElementById('sOrders').textContent=summary.orders||0;document.getElementById('sGross').textContent=money(summary.grossRevenue||0);document.getElementById('sRefunds').textContent=money(summary.refunds||0);document.getElementById('sRevenue').textContent=money(summary.netRevenue??summary.revenue??0);document.getElementById('sExpenses').textContent=money(summary.operatingExpenses??0);document.getElementById('sNet').textContent=money(summary.estimatedNetBeforeTax||0);document.getElementById('sDiscount').textContent=money(summary.discounts||0);document.getElementById('sShipping').textContent=money(summary.shipping||0);document.getElementById('sDocs').textContent=summary.documentsMissing||0;document.getElementById('sExpenseCount').textContent=expensesSummary.count||0;document.getElementById('rows').innerHTML=orders.length?orders.map(o=>{const gross=paidTotal(o),refund=completedRefund(o);return `<tr><td>${esc(dateOnly(o.paid_at||o.created_at))}</td><td>${esc(o.order_id)}</td><td>${esc(o.customer?.fullName||'—')}</td><td>${money(gross)}</td><td>${refund?`<span class="pill bad">-${money(refund)}</span>`:'—'}</td><td>${money(gross-refund)}</td><td>${esc(o.payment_provider||'—')}</td><td><span class="pill ${o.fiscal_document_status==='issued'?'ok':'warn'}">${docHe(o.fiscal_document_status)}</span></td><td>${esc(o.fiscal_document_number||'—')}</td></tr>`}).join(''):'<tr><td colspan="9">אין מכירות ששולמו בשנה הזאת.</td></tr>'}catch(e){if(e.message==='unauthorized')app.innerHTML='<div class="panel login"><h2>צריך להתחבר לניהול</h2><div class="muted">העמוד מוגן באותה התחברות של ה-Admin.</div><div class="row" style="justify-content:center"><a class="btn" href="/admin">כניסה לניהול</a></div></div>';}}
(async()=>{try{const p=await api('/api/admin/products');settings=p.settings||{};render()}catch(e){if(e.message==='unauthorized')app.innerHTML='<div class="panel login"><h2>צריך להתחבר לניהול</h2><a href="/admin">כניסה לניהול</a></div>';else app.innerHTML='<div class="panel"><b>לא הצלחנו לטעון נתונים.</b></div>'}})();
</script>
</body>
</html>
