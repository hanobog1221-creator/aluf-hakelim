<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>הוצאות עסק | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f4;color:#171717}button,input,select{font:inherit}.top{background:var(--dark);color:#fff;border-bottom:1px solid #263342}.topin{max-width:1050px;margin:auto;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}.toplinks{display:flex;gap:8px;flex-wrap:wrap}.top a{color:#fff;text-decoration:none;font-weight:850;border:1px solid #38485a;border-radius:9px;padding:8px 10px}.wrap{max-width:1050px;margin:22px auto;padding:0 14px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:13px}.panel h1,.panel h2{margin:0 0 7px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:900}.field input,.field select{border:1px solid #cfd5dc;border-radius:10px;padding:11px;background:#fff;width:100%}.full{grid-column:1/-1}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;background:var(--yellow);padding:10px 14px;font-weight:950;cursor:pointer}.btn.dark{background:#111923;color:#fff}.btn.danger{background:#fff0f0;color:var(--bad);border:1px solid #ffc8cb;padding:7px 9px}.msg{font-size:13px;color:var(--ok);font-weight:850}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.stat{background:#f7f9fb;border-radius:11px;padding:12px}.stat b{display:block;font-size:23px}.stat small{color:var(--muted)}.tools{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.tools .field{min-width:140px}.table{overflow:auto;border:1px solid var(--line);border-radius:11px;margin-top:12px}.table table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:9px 10px;border-bottom:1px solid #edf0f2;text-align:right;font-size:12px}.table th{background:#f7f9fb}.empty{text-align:center;color:#7b858f;padding:25px}.login{text-align:center;padding:50px 20px}.notice{background:#fff8d8;border:1px solid #efd36d;border-radius:11px;padding:11px 13px;margin-top:10px;font-size:13px;line-height:1.55}@media(max-width:720px){.grid,.stats{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}.brand{font-size:18px}}@media(max-width:470px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.topin{align-items:flex-start}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · הוצאות</div><div class="toplinks"><a href="/admin-accounting.html">חשבונות ודוחות</a><a href="/admin">ניהול</a></div></div></div>
<main class="wrap" id="app"><div class="panel"><div class="muted">טוען...</div></div></main>
<script>
const app=document.getElementById('app');let expenses=[],summary={};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '₪'+Number(v||0).toFixed(2)}
function dateOnly(v){if(!v)return '';try{return new Date(v+'T00:00:00').toLocaleDateString('he-IL')}catch{return String(v)}}
function catHe(v){return ({supplier_purchase:'רכישת מוצר/ספק',shipping:'משלוח',payment_fee:'עמלת סליקה',advertising:'פרסום',software:'תוכנה/שירות',refund:'החזר ללקוח',bank_fee:'עמלת בנק',other:'אחר'})[v]||v}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');return d}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function downloadCsv(){const lines=[['תאריך','קטגוריה','תיאור','סכום','אסמכתא','מספר הזמנה','מקור'].map(csvCell).join(',')];for(const e of expenses)lines.push([e.expense_date,catHe(e.category),e.description,e.amount,e.reference||'',e.order_id||'',e.source||'manual'].map(csvCell).join(','));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`aluf-hakelim-expenses-${document.getElementById('year').value}.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}
function render(){const y=new Date().getFullYear();app.innerHTML=`<section class="panel"><h1>רישום הוצאות עסק</h1><div class="muted">כאן אפשר לרשום הוצאות שקשורות לעסק כדי שלא נצטרך לאסוף אותן בסוף השנה מהזיכרון.</div><div class="notice">בהמשך רכישות אוטומטיות ועמלות שנקבל מהמערכות המחוברות יוכלו להירשם כאן לבד. כרגע אפשר להוסיף ידנית הוצאות וחשבוניות שקיבלת.</div></section><section class="panel"><h2>הוספת הוצאה</h2><div class="grid"><div class="field"><label>תאריך</label><input id="expenseDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>קטגוריה</label><select id="category"><option value="supplier_purchase">רכישת מוצר/ספק</option><option value="shipping">משלוח</option><option value="payment_fee">עמלת סליקה</option><option value="advertising">פרסום</option><option value="software">תוכנה/שירות</option><option value="refund">החזר ללקוח</option><option value="bank_fee">עמלת בנק</option><option value="other">אחר</option></select></div><div class="field full"><label>תיאור</label><input id="description" maxlength="240" placeholder="לדוגמה: רכישת מוצר להזמנה AH-..."></div><div class="field"><label>סכום בש״ח</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal"></div><div class="field"><label>אסמכתא / מספר חשבונית</label><input id="reference" maxlength="160"></div><div class="field full"><label>מספר הזמנה קשור — אופציונלי</label><input id="orderId" maxlength="80" placeholder="AH-..."></div></div><div class="row"><button id="save" class="btn">שמור הוצאה</button><span id="msg" class="msg"></span></div></section><section class="panel"><div class="tools"><div class="field"><label>שנה</label><select id="year">${Array.from({length:6},(_,i)=>y-i).map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div><button id="load" class="btn dark">טען</button><button id="csv" class="btn">ייצוא CSV</button></div><div class="stats"><div class="stat"><b id="total">₪0</b><small>סה״כ הוצאות</small></div><div class="stat"><b id="supplier">₪0</b><small>רכישות מוצרים</small></div><div class="stat"><b id="fees">₪0</b><small>משלוחים ועמלות</small></div><div class="stat"><b id="count">0</b><small>רשומות</small></div></div><div class="table"><table><thead><tr><th>תאריך</th><th>קטגוריה</th><th>תיאור</th><th>סכום</th><th>אסמכתא</th><th>הזמנה</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>`;document.getElementById('save').onclick=saveExpense;document.getElementById('load').onclick=loadYear;document.getElementById('csv').onclick=downloadCsv;loadYear()}
async function loadYear(){const year=document.getElementById('year').value;try{const d=await api('/api/admin/orders?expenses=1&year='+encodeURIComponent(year));expenses=d.items||[];summary=d.summary||{};document.getElementById('total').textContent=money(summary.total||0);document.getElementById('supplier').textContent=money(summary.supplierPurchases||0);document.getElementById('fees').textContent=money(Number(summary.shipping||0)+Number(summary.paymentFees||0)+Number(summary.bankFees||0));document.getElementById('count').textContent=summary.count||0;document.getElementById('rows').innerHTML=expenses.length?expenses.map(e=>`<tr><td>${esc(dateOnly(e.expense_date))}</td><td>${esc(catHe(e.category))}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td><td>${esc(e.reference||'—')}</td><td>${esc(e.order_id||'—')}</td><td>${e.source==='manual'?`<button class="btn danger" onclick="deleteExpense(${Number(e.id)})">מחק</button>`:'אוטומטי'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">אין הוצאות בשנה הזאת.</td></tr>'}catch(e){if(e.message==='unauthorized')app.innerHTML='<div class="panel login"><h2>צריך להתחבר לניהול</h2><div class="muted">העמוד מוגן באותה התחברות של ה-Admin.</div><div class="row" style="justify-content:center"><a class="btn" href="/admin" style="text-decoration:none;color:#171717">כניסה לניהול</a></div></div>';else document.getElementById('rows').innerHTML='<tr><td colspan="7" class="empty">לא הצלחנו לטעון את ההוצאות.</td></tr>'}}
async function saveExpense(){const b=document.getElementById('save'),m=document.getElementById('msg');b.disabled=true;m.textContent='שומר...';try{await api('/api/admin/orders',{method:'POST',body:JSON.stringify({action:'expense_create',expense_date:document.getElementById('expenseDate').value,category:document.getElementById('category').value,description:document.getElementById('description').value.trim(),amount:Number(document.getElementById('amount').value),reference:document.getElementById('reference').value.trim()||null,order_id:document.getElementById('orderId').value.trim()||null})});document.getElementById('description').value='';document.getElementById('amount').value='';document.getElementById('reference').value='';document.getElementById('orderId').value='';m.textContent='נשמר ✓';await loadYear()}catch(e){m.textContent='שגיאה בשמירה'}finally{b.disabled=false}}
async function deleteExpense(id){if(!confirm('למחוק את ההוצאה הזאת?'))return;try{await api('/api/admin/orders?expenseId='+encodeURIComponent(id),{method:'DELETE'});await loadYear()}catch{alert('לא הצלחנו למחוק את ההוצאה')}}
render();
</script>
</body>
</html>
