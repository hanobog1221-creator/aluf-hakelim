<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>תשלומי AliExpress · אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#176d3e;--bad:#9e1b25;--warn:#825d00}*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#151b22;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:var(--dark);color:#fff}.topin{max-width:1080px;margin:auto;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;border:1px solid #394552;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:850}.wrap{max-width:1080px;margin:20px auto;padding:0 14px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px}.panel{padding:16px;margin-bottom:12px}.panel h1{margin:0 0 5px;font-size:25px}.muted{font-size:12px;color:var(--muted);line-height:1.6}.notice{margin-top:11px;padding:10px 12px;border-radius:10px;background:#fff7d6;border:1px solid #ead16c;font-size:12px;line-height:1.6}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{border-radius:999px;background:#edf1f4;padding:6px 10px;font-size:12px;font-weight:900}.pill.warn{background:#fff2c5;color:var(--warn)}.pill.ok{background:#e7f7ed;color:var(--ok)}.pill.bad{background:#ffe9ea;color:var(--bad)}.card{margin-bottom:12px;overflow:hidden}.head{padding:13px 14px;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head h2{font-size:17px;margin:0 0 4px}.body{padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{background:#f7f9fb;border-radius:10px;padding:10px;min-width:0;word-break:break-word;font-size:13px;line-height:1.5}.box b{display:block;color:#65717d;font-size:11px;margin-bottom:4px}.section{margin-top:10px;border:1px solid #edf0f2;border-radius:10px;padding:10px;background:#fbfcfd;font-size:13px;line-height:1.6}.address{direction:rtl}.items{display:grid;gap:7px}.item{padding:8px;background:#fff;border:1px solid #e6eaee;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:9px;padding:10px 12px;font:inherit;font-size:13px;font-weight:950;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--yellow);color:#17120b}.btn.dark{background:#111923;color:#fff}.btn.secondary{background:#e8f1ff;color:#173b69}.btn:disabled{opacity:.5}.result{margin-top:10px;padding:10px 12px;border-radius:9px;background:#f0f3f5;font-size:12px;line-height:1.6}.result.ok{background:#eaf8ef;color:#155c35}.result.bad{background:#fff0f0;color:#8a1721}.empty{text-align:center;color:#72808c;padding:42px 20px;background:#fff;border:1px solid var(--line);border-radius:15px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;direction:ltr}.login{padding:36px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:15px}@media(max-width:780px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:460px){.grid{grid-template-columns:1fr}.actions .btn{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · תשלומי AliExpress</div><nav class="nav"><a href="/admin">ניהול</a><a href="/admin-fulfillment.html">Fulfillment</a><a href="/launch-checklist.html">מוכנות</a></nav></div></header>
<main class="wrap" id="app"><section class="panel"><div class="muted">טוען תור תשלומים…</div></section></main>
<script>
const app=document.getElementById('app');
let rows=[];
const results=new Map();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dt(v){if(!v)return '—';try{return new Date(v).toLocaleString('he-IL')}catch{return String(v)}}
function money(v,c='ILS'){return `${String(c||'ILS').toUpperCase()==='ILS'?'₪':''}${Number(v||0).toFixed(2)}${String(c||'ILS').toUpperCase()==='ILS'?'':' '+String(c).toUpperCase()}`}
async function api(options={}){const r=await fetch('/api/admin?route=aliexpress-payment-queue',{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw Object.assign(new Error('unauthorized'),{status:401});if(!r.ok||d.ok!==true){const e=new Error(String(d.error||d.result?.reason||'request_failed'));e.data=d;throw e}return d}
function address(c={}){const parts=[c.street,c.houseNumber,c.apartment?`דירה ${c.apartment}`:'',c.city,c.postalCode?`מיקוד ${c.postalCode}`:''].filter(Boolean);return parts.join(', ')||'—'}
function actionLabel(row){if(row.action==='create_supplier_order')return 'צריך ליצור הזמנת ספק';if(row.action==='pay_supplier')return 'ממתין לתשלום AliExpress';if(row.action==='review')return 'דורש בדיקה';return 'בדיקת תשלום'}
function actionClass(row){if(row.action==='review')return 'bad';if(row.action==='pay_supplier'||row.action==='create_supplier_order')return 'warn';return 'ok'}
function encodeData(value){return encodeURIComponent(String(value??''))}
function render(){const waiting=rows.filter(r=>r.action==='pay_supplier').length;const create=rows.filter(r=>r.action==='create_supplier_order').length;const review=rows.filter(r=>r.action==='review').length;let html=`<section class="panel"><h1>תור תשלומי ספק</h1><div class="muted">כאן מופיעות הזמנות AliExpress שהלקוח כבר שילם אצלנו אבל הטיפול אצל הספק עדיין דורש פעולה.</div><div class="notice"><b>הסדר:</b> קודם יוצרים הזמנת ספק, אחר כך פותחים את AliExpress ומשלמים, ואז לוחצים “בדוק ששולם”. המערכת מאמתת את סטטוס AliExpress לפני שהיא מסמנת תשלום ספק כהושלם.</div><div class="summary"><span class="pill warn">ממתינות לתשלום: ${waiting}</span><span class="pill">צריכות יצירת ספק: ${create}</span><span class="pill ${review?'bad':'ok'}">דורשות בדיקה: ${review}</span></div></section>`;
if(!rows.length){app.innerHTML=html+`<div class="empty">אין כרגע הזמנות AliExpress שממתינות לפעולת תשלום ידנית ✅</div>`;return}
for(const r of rows){const c=r.customer||{};const itemHtml=(r.items||[]).map(i=>`<div class="item"><b>${esc(i.name||i.id||'מוצר')}</b> × ${esc(i.qty)}${i.variant?`<br><span class="muted">וריאציה: ${esc(i.variant)}</span>`:''}${i.supplierProductId?`<br><span class="muted code">Product ${esc(i.supplierProductId)}</span>`:''}</div>`).join('');const links=(r.paymentLinks||[]).map(x=>`<a class="btn primary" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">פתח תשלום · ${esc(x.supplierOrderId)}</a>`).join('');const result=results.get(r.orderId);html+=`<section class="card"><div class="head"><div><h2>${esc(r.orderId)}</h2><div class="muted">הזמנה: ${esc(dt(r.createdAt))}${r.paidAt?' · הלקוח שילם '+esc(dt(r.paidAt)):''}</div></div><span class="pill ${actionClass(r)}">${esc(actionLabel(r))}</span></div><div class="body"><div class="grid"><div class="box"><b>לקוח</b>${esc(c.fullName||'—')}</div><div class="box"><b>טלפון</b><a href="tel:${esc(c.phone||'')}">${esc(c.phone||'—')}</a></div><div class="box"><b>אימייל</b>${esc(c.email||'—')}</div><div class="box"><b>סכום ששולם אצלנו</b>${esc(money(r.customerPaid,r.currency))}</div></div><div class="section address"><b>כתובת מלאה:</b> ${esc(address(c))}<div class="actions"><button class="btn secondary" data-copy="${esc(encodeData(address(c)))}">העתק כתובת</button>${c.phone?`<button class="btn secondary" data-copy="${esc(encodeData(c.phone))}">העתק טלפון</button>`:''}</div></div>${r.customerNote?`<div class="section"><b>הערת לקוח:</b> ${esc(r.customerNote)}</div>`:''}<div class="section items"><b>מוצרים:</b>${itemHtml||'—'}</div><div class="section"><b>הזמנות AliExpress:</b> ${(r.supplierOrderIds||[]).length?(r.supplierOrderIds||[]).map(x=>`<span class="code">${esc(x)}</span>`).join(', '):'עדיין לא נוצרו'}${r.attempt?.providerCost!==null&&r.attempt?.providerCost!==undefined?`<br><b>עלות ספק:</b> ${esc(money(r.attempt.providerCost,r.attempt.providerCurrency||'USD'))}`:''}${r.attempt?.errorMessage?`<br><span class="muted">${esc(r.attempt.errorMessage)}</span>`:''}</div><div class="actions">${r.action==='create_supplier_order'?`<button class="btn dark" data-order="${esc(r.orderId)}" data-action="create_supplier_order">צור הזמנת AliExpress</button>`:''}${links}${(r.supplierOrderIds||[]).length?`<button class="btn dark" data-order="${esc(r.orderId)}" data-action="verify_payment">בדוק ששולם</button>`:''}</div>${result?`<div class="result ${result.ok?'ok':'bad'}">${esc(result.text)}</div>`:''}</div></section>`}app.innerHTML=html}
async function load(){try{const d=await api();rows=d.rows||[];render()}catch(e){app.innerHTML=e.status===401?`<div class="login"><h2>נדרשת התחברות לאדמין</h2><p class="muted">פתח קודם את מסך הניהול והתחבר, ואז חזור לדף הזה.</p><a class="btn dark" href="/admin">פתח ניהול</a></div>`:`<div class="empty">טעינת התור נכשלה: ${esc(e.message)}</div>`}}
async function act(orderId,action,btn){btn.disabled=true;results.set(orderId,{ok:true,text:action==='verify_payment'?'בודק את סטטוס התשלום מול AliExpress…':'יוצר הזמנת ספק ב-AliExpress…'});render();try{const d=await api({method:'POST',body:JSON.stringify({orderId,action})});if(action==='verify_payment'){if(d.verified){results.set(orderId,{ok:true,text:'התשלום אומת מול AliExpress ✅ ההזמנה יצאה מתור התשלום.'})}else{const statuses=(d.details||[]).map(x=>`${x.supplierOrderId}: ${x.orderStatus||'לא ידוע'}`).join(' · ');results.set(orderId,{ok:false,text:'AliExpress עדיין לא מאשר שהתשלום הושלם. '+statuses})}}else{results.set(orderId,{ok:true,text:'הזמנת הספק נוצרה ✅ עכשיו אפשר לפתוח את AliExpress ולשלם.'})}rows=d.rows||[];render()}catch(e){results.set(orderId,{ok:false,text:'הפעולה נכשלה: '+e.message});render()}}
app.addEventListener('click',async(e)=>{const copy=e.target.closest('[data-copy]');if(copy){try{await navigator.clipboard.writeText(decodeURIComponent(copy.dataset.copy||''));copy.textContent='הועתק ✓';setTimeout(()=>{copy.textContent=copy.dataset.copyLabel||'העתק'},1000)}catch{}return}const button=e.target.closest('[data-order][data-action]');if(button){const orderId=String(button.dataset.order||'');const action=String(button.dataset.action||'');if(/^AH-[A-Z0-9-]{5,60}$/.test(orderId)&&['create_supplier_order','verify_payment'].includes(action))await act(orderId,action,button)}});
load();setInterval(()=>{if(document.visibilityState==='visible')load()},30000);
</script>
</body>
</html>
