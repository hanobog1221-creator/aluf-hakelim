<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>מוכנות להשקה | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--warn:#8b6500;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f4;color:#171717}.top{background:var(--dark);color:#fff;border-bottom:1px solid #263342}.topin{max-width:1040px;margin:auto;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:950;font-size:22px}.brand span{color:var(--yellow)}.top a{color:#fff;font-weight:850;text-decoration:none}.wrap{max-width:1040px;margin:24px auto;padding:0 14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.hero{padding:20px;margin-bottom:14px}.hero h1{margin:0 0 4px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.score{display:flex;gap:10px;align-items:center;margin-top:14px}.score b{font-size:34px}.bar{height:12px;background:#edf0f2;border-radius:999px;overflow:hidden;flex:1}.fill{height:100%;background:var(--yellow);width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:17px}.card h2{margin:0 0 10px;font-size:19px}.check{border-top:1px solid #edf0f2;padding:11px 0;display:flex;gap:10px;align-items:flex-start}.check:first-of-type{border-top:0}.icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:950;flex:0 0 auto}.ok .icon{background:#e6f7ed;color:var(--ok)}.warn .icon{background:#fff4cf;color:var(--warn)}.bad .icon{background:#ffe7e8;color:var(--bad)}.check b{display:block;margin-bottom:2px}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{display:inline-block;background:#111923;color:#fff;text-decoration:none;border-radius:9px;padding:9px 12px;font-weight:850;font-size:13px}.btn.yellow{background:var(--yellow);color:#171717}.note{margin-top:13px;padding:11px 13px;background:#f7f9fb;border:1px solid #e0e5ea;border-radius:11px;font-size:12px;line-height:1.6}.login{text-align:center;padding:50px 20px}@media(max-width:720px){.grid{grid-template-columns:1fr}.brand{font-size:19px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · מוכנות להשקה</div><a href="/admin">חזרה לניהול</a></div></div>
<main class="wrap" id="app"><div class="hero"><div class="muted">טוען את מצב החנות...</div></div></main>
<script>
const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url){const r=await fetch(url,{headers:{accept:'application/json'}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');return d}
function item(level,title,text){const symbol=level==='ok'?'✓':level==='bad'?'!':'•';return `<div class="check ${level}"><span class="icon">${symbol}</span><div><b>${esc(title)}</b><div class="muted">${esc(text)}</div></div></div>`}
function render(products,orders,settings){
  const active=products.filter(p=>p.active);
  const businessReady=Boolean(settings.business_legal_name&&settings.business_tax_id&&settings.business_type&&settings.business_address&&settings.business_phone);
  const freeChecks=[
    {l:settings.whatsapp_enabled&&settings.whatsapp_number?'ok':'bad',t:'WhatsApp עסקי',x:settings.whatsapp_enabled&&settings.whatsapp_number?'מחובר ומופעל באתר עם כפתור WhatsApp ברור.':'עדיין לא מחובר או כבוי.'},
    {l:settings.support_email?'ok':'warn',t:'אימייל שירות',x:settings.support_email?'מוגדר במערכת.':'אפשר להשלים בהמשך כשיהיה אימייל עסקי.'},
    {l:settings.minimum_profit_ils!=null?'ok':'warn',t:'הגנת רווח',x:settings.minimum_profit_ils!=null?`רווח מינימלי מוגדר: ₪${Number(settings.minimum_profit_ils).toFixed(2)}.`:'עדיין לא הוגדר סכום רווח מינימלי.'},
    {l:'ok',t:'מעקב הזמנה ללקוח',x:'עמוד המעקב מוכן ומציג סטטוס, סכומים ומספר מעקב.'},
    {l:'ok',t:'קופונים והנחות',x:'הקופונים מחושבים בשרת וכוללים מגבלות שימוש ותוקף.'},
    {l:'ok',t:'הגנות Checkout',x:'קיימות הגנות נגד בקשות כפולות, הצפה, כמות חריגה ומוצר שאינו זמין.'},
    {l:'ok',t:'חשבונות והוצאות',x:'קיימים ריכוז הכנסות, הוצאות, CSV וסיכום חודשי לקראת הנהלת חשבונות.'},
    {l:'ok',t:'מדיניות ופרטיות',x:'עמוד המידע ללקוחות קיים ומוכן לעדכון סופי לפני מכירות אמיתיות.'}
  ];
  const productChecks=[
    {l:active.every(p=>p.supplier_product_id)?'ok':'bad',t:'Product ID לכל מוצר פעיל',x:active.every(p=>p.supplier_product_id)?'לכל המוצרים הפעילים יש מזהה מוצר.':'יש מוצר פעיל שחסר לו Product ID.'},
    {l:active.every(p=>p.supplier_sku_id)?'ok':'bad',t:'SKU מדויק לכל מוצר פעיל',x:active.every(p=>p.supplier_sku_id)?'כל ה-SKUים הוגדרו.':'חסרים SKUים מדויקים; לא תתבצע הזמנה אוטומטית עד שהם יאומתו.'},
    {l:active.every(p=>p.fulfillment_ready)?'ok':'bad',t:'מוצרים מאומתים לאוטומציה',x:active.every(p=>p.fulfillment_ready)?'כל המוצרים הפעילים מאומתים להזמנה אוטומטית.':'יש מוצרים שחסומים בכוונה להזמנה אוטומטית.'},
    {l:active.every(p=>p.supplier_in_stock!==null)?'ok':'warn',t:'בדיקת מלאי חיה',x:active.every(p=>p.supplier_in_stock!==null)?'מצב מלאי ידוע לכל מוצר פעיל.':'חלק מהמוצרים עדיין ממתינים לסנכרון מלאי.'},
    {l:active.every(p=>p.supplier_shipping_available!==null)?'ok':'warn',t:'בדיקת משלוחים חיה',x:active.every(p=>p.supplier_shipping_available!==null)?'מצב המשלוח ידוע לכל מוצר פעיל.':'חלק מהמוצרים עדיין ממתינים לבדיקת משלוח.'},
    {l:active.every(p=>p.supplier_price_ils!=null)?'ok':'warn',t:'עלות מוצר בש״ח',x:active.every(p=>p.supplier_price_ils!=null)?'עלות המוצרים ידועה וניתן לחשב רווח מדויק.':'חלק מעלויות המוצרים עדיין ממתינות לסנכרון.'}
  ];
  const externalChecks=[
    {l:'bad',t:'הרשאת ספק/API',x:'החיבור קיים אבל ההרשאה החיצונית עדיין חוסמת את נתוני המוצר והמשלוח החיים.'},
    {l:'bad',t:'סליקה אמיתית',x:'בכוונה לא חוברה עדיין כדי לא להתחיל חלקים בתשלום.'},
    {l:'bad',t:'קבלה/חשבונית חוקית',x:'תתחבר למערכת חשבונאית מתאימה רק אחרי פתיחת העסק ובחירת שירות.'},
    {l:businessReady?'ok':'warn',t:'פרטי העסק',x:businessReady?'פרטי העסק הושלמו במערכת.':'יש להשלים שם רשמי, מספר עוסק, סוג עסק, כתובת וטלפון לפני מכירות אמיתיות.'},
    {l:orders.some(o=>['completed','shipped'].includes(o.status))?'ok':'warn',t:'בדיקת הזמנה מקצה לקצה',x:orders.some(o=>['completed','shipped'].includes(o.status))?'קיימת הזמנה שעברה תהליך מתקדם.':'הבדיקה הסופית תתבצע אחרי חיבור סליקה והרשאת הספק.'}
  ];
  const checks=[...freeChecks,...productChecks,...externalChecks];
  const passed=checks.filter(c=>c.l==='ok').length;
  const pct=Math.round((passed/checks.length)*100);
  const critical=checks.filter(c=>c.l==='bad').length;
  app.innerHTML=`<section class="hero"><h1>מצב מוכנות להשקה</h1><div class="muted">כל מה שאפשר להכין בלי תשלום מרוכז כאן. חסם אדום לא אומר שהאתר תקול — הוא אומר שיש שלב חיצוני שעוד לא ניתן להשלים.</div><div class="score"><b>${pct}%</b><div class="bar"><div class="fill" style="width:${pct}%"></div></div><span class="muted">${critical} חסמים</span></div><div class="links"><a class="btn yellow" href="/admin-tools">הגדרות והתראות</a><a class="btn" href="/admin">מוצרים והזמנות</a><a class="btn" href="/accounting">חשבונות</a><a class="btn" href="/expenses">הוצאות</a><a class="btn" href="/policies" target="_blank">עמוד מידע ללקוחות</a></div><div class="note"><b>היעד:</b> כששלושת החיבורים החיצוניים — הרשאת המוצר, סליקה ומסמכים חשבונאיים — יהיו זמינים, לא נצטרך לבנות מחדש את החנות; רק לחבר אותם לתשתית שכבר הוכנה.</div></section><div class="grid"><section class="card"><h2>מוכן בלי תשלום</h2>${freeChecks.map(c=>item(c.l,c.t,c.x)).join('')}</section><section class="card"><h2>מוצרים ואוטומציה</h2>${productChecks.map(c=>item(c.l,c.t,c.x)).join('')}</section><section class="card"><h2>חיבורים חיצוניים לפני מכירות אמיתיות</h2>${externalChecks.map(c=>item(c.l,c.t,c.x)).join('')}</section><section class="card"><h2>מצב מוצרים</h2>${item(active.length?'ok':'bad','מוצרים פעילים',`${active.length} מוצרים פעילים כרגע.`)}${item(active.filter(p=>p.fulfillment_ready).length===active.length&&active.length?'ok':'warn','מוכנים להזמנה אוטומטית',`${active.filter(p=>p.fulfillment_ready).length} מתוך ${active.length} מוכנים.`)}${item(active.filter(p=>p.supplier_sku_id).length===active.length&&active.length?'ok':'warn','SKU מאומת',`${active.filter(p=>p.supplier_sku_id).length} מתוך ${active.length} עם SKU.`)}</section></div>`
}
(async()=>{try{const [p,o]=await Promise.all([api('/api/admin/products'),api('/api/admin/orders?limit=100')]);render(p.products||[],o.orders||[],p.settings||{})}catch(e){if(e.message==='unauthorized')app.innerHTML='<div class="hero login"><h2>צריך להתחבר לניהול</h2><div class="muted">עמוד המוכנות מוגן באותה התחברות של ה-Admin.</div><div class="links" style="justify-content:center"><a class="btn yellow" href="/admin">כניסה לניהול</a></div></div>';else app.innerHTML='<div class="hero"><b>לא הצלחנו לטעון את מצב החנות.</b></div>'}})();
</script>
</body>
</html>
