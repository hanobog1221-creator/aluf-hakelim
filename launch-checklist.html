<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>מוכנות להשקה | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--warn:#8b6500;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f4;color:#171717}.top{background:var(--dark);color:#fff;border-bottom:1px solid #263342}.topin{max-width:980px;margin:auto;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:950;font-size:22px}.brand span{color:var(--yellow)}.top a{color:#fff;font-weight:850;text-decoration:none}.wrap{max-width:980px;margin:24px auto;padding:0 14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.hero{padding:20px;margin-bottom:14px}.hero h1{margin:0 0 4px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.score{display:flex;gap:10px;align-items:center;margin-top:14px}.score b{font-size:34px}.bar{height:12px;background:#edf0f2;border-radius:999px;overflow:hidden;flex:1}.fill{height:100%;background:var(--yellow);width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:17px}.card h2{margin:0 0 10px;font-size:19px}.check{border-top:1px solid #edf0f2;padding:11px 0;display:flex;gap:10px;align-items:flex-start}.check:first-of-type{border-top:0}.icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:950;flex:0 0 auto}.ok .icon{background:#e6f7ed;color:var(--ok)}.warn .icon{background:#fff4cf;color:var(--warn)}.bad .icon{background:#ffe7e8;color:var(--bad)}.check b{display:block;margin-bottom:2px}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{display:inline-block;background:#111923;color:#fff;text-decoration:none;border-radius:9px;padding:9px 12px;font-weight:850;font-size:13px}.btn.yellow{background:var(--yellow);color:#171717}.login{text-align:center;padding:50px 20px}@media(max-width:720px){.grid{grid-template-columns:1fr}.brand{font-size:19px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · מוכנות להשקה</div><a href="/admin">חזרה לניהול</a></div></div>
<main class="wrap" id="app"><div class="hero"><div class="muted">טוען את מצב החנות...</div></div></main>
<script>
const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}
async function api(url){const r=await fetch(url,{headers:{accept:'application/json'}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');return d}
function item(level,title,text){const symbol=level==='ok'?'✓':level==='bad'?'!':'•';return `<div class="check ${level}"><span class="icon">${symbol}</span><div><b>${esc(title)}</b><div class="muted">${esc(text)}</div></div></div>`}
function render(products,orders,settings){const active=products.filter(p=>p.active);const checks=[];
checks.push({l:settings.whatsapp_enabled&&settings.whatsapp_number?'ok':'bad',t:'WhatsApp עסקי',x:settings.whatsapp_enabled&&settings.whatsapp_number?'מחובר ומופעל באתר.':'עדיין לא מחובר או כבוי.'});
checks.push({l:settings.support_email?'ok':'warn',t:'אימייל שירות',x:settings.support_email?'מוגדר במערכת.':'מומלץ להוסיף לפני פתיחה מלאה.'});
checks.push({l:settings.minimum_profit_ils!=null?'ok':'warn',t:'הגנת רווח',x:settings.minimum_profit_ils!=null?`רווח מינימלי מוגדר: ₪${Number(settings.minimum_profit_ils).toFixed(2)}.`:'עדיין לא הוגדר רווח מינימלי להזמנה אוטומטית.'});
checks.push({l:active.every(p=>p.supplier_product_id)?'ok':'bad',t:'Product ID לכל מוצר פעיל',x:active.every(p=>p.supplier_product_id)?'לכל המוצרים הפעילים יש מזהה מוצר.':'יש מוצר פעיל שחסר לו Product ID.'});
checks.push({l:active.every(p=>p.supplier_sku_id)?'ok':'bad',t:'SKU מדויק לכל מוצר פעיל',x:active.every(p=>p.supplier_sku_id)?'כל ה-SKUים הוגדרו.':'עדיין חסרים SKUים מדויקים; זה יושלם אחרי פתיחת הרשאת ה-API.'});
checks.push({l:active.every(p=>p.fulfillment_ready)?'ok':'bad',t:'מוצרים מאומתים לאוטומציה',x:active.every(p=>p.fulfillment_ready)?'כל המוצרים הפעילים מאומתים להזמנה אוטומטית.':'יש מוצרים שעדיין חסומים בכוונה להזמנה אוטומטית.'});
checks.push({l:active.every(p=>p.supplier_in_stock!==null)?'ok':'warn',t:'בדיקת מלאי חיה',x:active.every(p=>p.supplier_in_stock!==null)?'מצב מלאי ידוע לכל מוצר פעיל.':'חלק מהמוצרים עדיין ממתינים לסנכרון מלאי.'});
checks.push({l:active.every(p=>p.supplier_shipping_available!==null)?'ok':'warn',t:'בדיקת משלוחים חיה',x:active.every(p=>p.supplier_shipping_available!==null)?'מצב משלוח ידוע לכל מוצר פעיל.':'חלק מהמוצרים עדיין ממתינים לבדיקת משלוח.'});
checks.push({l:'bad',t:'סליקה',x:'בכוונה עדיין לא חוברה — נשאיר את החלק בתשלום לסוף.'});
checks.push({l:'warn',t:'פרטי עסק לפני פתיחה מלאה',x:'יש להשלים שם עסק/עוסק, פרטי התקשרות ומידע חשבונאי לפני הפעלת מכירות אמיתיות.'});
checks.push({l:'ok',t:'עמוד משלוחים, ביטולים ופרטיות',x:'הוכן עמוד מידע ללקוחות וניתן לעדכן אותו לפני ההשקה.'});
checks.push({l:orders.some(o=>['completed','shipped'].includes(o.status))?'ok':'warn',t:'בדיקת הזמנה מקצה לקצה',x:orders.some(o=>['completed','shipped'].includes(o.status))?'קיימת הזמנה שעברה תהליך מתקדם.':'נבצע הזמנת מבחן מבוקרת אחרי חיבור API וסליקה.'});
const passed=checks.filter(c=>c.l==='ok').length;const pct=Math.round((passed/checks.length)*100);const critical=checks.filter(c=>c.l==='bad').length;
app.innerHTML=`<section class="hero"><h1>מצב מוכנות להשקה</h1><div class="muted">הרשימה הזאת מיועדת רק לניהול ועוזרת לנו לדעת מה אפשר לסגור עכשיו ומה באמת תלוי בחיבורים החיצוניים.</div><div class="score"><b>${pct}%</b><div class="bar"><div class="fill" style="width:${pct}%"></div></div><span class="muted">${critical} חסמים</span></div><div class="links"><a class="btn yellow" href="/admin-tools">הגדרות והתראות</a><a class="btn" href="/admin">מוצרים והזמנות</a><a class="btn" href="/policies" target="_blank">עמוד מידע ללקוחות</a></div></section><div class="grid"><section class="card"><h2>חנות ושירות</h2>${checks.slice(0,3).map(c=>item(c.l,c.t,c.x)).join('')}${checks.slice(8,11).map(c=>item(c.l,c.t,c.x)).join('')}</section><section class="card"><h2>אוטומציה והזמנות</h2>${checks.slice(3,8).map(c=>item(c.l,c.t,c.x)).join('')}${checks.slice(11).map(c=>item(c.l,c.t,c.x)).join('')}</section></div>`}
(async()=>{try{const [p,o]=await Promise.all([api('/api/admin/products'),api('/api/admin/orders?limit=100')]);render(p.products||[],o.orders||[],p.settings||{})}catch(e){if(e.message==='unauthorized')app.innerHTML='<div class="hero login"><h2>צריך להתחבר לניהול</h2><div class="muted">עמוד המוכנות מוגן באותה התחברות של ה-Admin.</div><div class="links" style="justify-content:center"><a class="btn yellow" href="/admin">כניסה לניהול</a></div></div>';else app.innerHTML='<div class="hero"><b>לא הצלחנו לטעון את מצב החנות.</b></div>'}})();
</script>
</body>
</html>
