<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>מוכנות להשקה | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#687582;--ok:#167342;--warn:#946900;--bad:#a51e28;--bg:#eef1f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717}.top{background:var(--dark);color:#fff}.topin{max-width:1080px;margin:auto;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}.top a{color:#fff;text-decoration:none;font-weight:850}.wrap{max-width:1080px;margin:22px auto;padding:0 14px 40px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.hero{padding:20px;margin-bottom:13px}.hero h1{margin:0 0 7px;font-size:28px}.heroStatus{font-weight:950;font-size:17px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:16px}.card h2{margin:0 0 9px;font-size:18px}.row{padding:10px 0;border-top:1px solid #edf0f2;display:flex;gap:9px;align-items:flex-start}.row:first-of-type{border-top:0}.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:950;flex:0 0 auto}.ok .dot{background:#e5f7ec;color:var(--ok)}.warn .dot{background:#fff3cb;color:var(--warn)}.bad .dot{background:#ffe5e7;color:var(--bad)}.row b{display:block;margin-bottom:2px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{border-radius:999px;padding:6px 9px;background:#f2f4f6;font-size:12px;font-weight:850}.chip.ok{background:#e5f7ec;color:var(--ok)}.chip.warn{background:#fff3cb;color:var(--warn)}.chip.bad{background:#ffe5e7;color:var(--bad)}.products{margin-top:8px}.product{font-size:12px;padding:6px 8px;background:#f6f8fa;border-radius:8px;margin:5px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:9px;background:#111923;color:#fff;text-decoration:none;padding:9px 12px;font-size:13px;font-weight:900;cursor:pointer}.btn.yellow{background:var(--yellow);color:#171717}.stamp{font-size:11px;color:#87919b;margin-top:10px}.login{text-align:center;padding:50px 20px;background:#fff;border:1px solid var(--line);border-radius:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · Launch Readiness</div><a href="/admin">חזרה לניהול</a></div></header>
<main class="wrap" id="app"><section class="hero"><div class="muted">בודק את כל מנגנוני ההשקה…</div></section></main>
<script>
const app=document.getElementById('app');
const labels={
 no_purchase_ready_products:'אין אף מוצר מוכן להזמנה',
 non_aliexpress_product_blockers:'יש חסימה במוצר שאינו AliExpress',
 paypal_to_cj_sandbox_e2e_not_verified:'בדיקת PayPal → CJ בסנדבוקס לא הושלמה',
 tracking_e2e_not_verified:'בדיקת Tracking מקצה לקצה לא הושלמה',
 automation_workers_not_ready:'אחד מעובדי האוטומציה/cron אינו פעיל',
 checkout_guards_not_ready:'הגנות רווח/תוקף משלוח אינן מוכנות',
 paypal_live_credentials_required:'נדרשים פרטי PayPal LIVE',
 cj_live_mode_required:'CJ עדיין במצב Sandbox',
 cj_autopay_required:'CJ AutoPay עדיין כבוי',
 cj_positive_balance_required:'נדרשת יתרה חיובית ב-CJ לפני הזמנות חיות',
 business_identity_required_for_live_sales:'חסרים פרטי עסק מלאים לפני מכירות חיות',
 aliexpress_catalog_permission_or_sync_pending:'מוצרי AliExpress ממתינים להרשאה/סנכרון',
 sales_switch_off:'מתג המכירות הראשי כבוי בכוונה'
};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function row(level,title,text){const s=level==='ok'?'✓':level==='bad'?'!':'•';return `<div class="row ${level}"><span class="dot">${s}</span><div><b>${esc(title)}</b><div class="muted">${esc(text)}</div></div></div>`}
function yes(v){return v?'ok':'bad'}
function money(v){return v==null?'לא ידוע':`$${Number(v).toFixed(2)}`}
async function load(){
 try{
  const r=await fetch('/api/admin?route=launch-readiness',{headers:{accept:'application/json'},cache:'no-store'});
  if(r.status===401){app.innerHTML='<div class="login"><h2>נדרשת כניסת מנהל</h2><p class="muted">הבדיקה מכילה מצב תפעולי ולכן זמינה רק אחרי התחברות לניהול.</p><a class="btn yellow" href="/admin">כניסה לניהול</a></div>';return}
  const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'readiness_failed');render(d);
 }catch(e){app.innerHTML=`<div class="login"><h2>לא ניתן לטעון את הבדיקה</h2><div class="muted">${esc(e.message)}</div><div class="actions" style="justify-content:center"><button class="btn yellow" onclick="load()">נסה שוב</button></div></div>`}
}
function render(d){
 const p=d.phase||{}, c=d.catalog||{}, pay=d.payments||{}, f=d.fulfillment||{}, a=d.automation||{}, g=d.guards||{}, b=d.business||{};
 let status='עדיין יש חסימות לפני השקה';let level='bad';
 if(p.salesEnabled&&p.canEnableSales){status='החנות במצב LIVE ומוכנה';level='ok'}
 else if(p.canEnableSales){status='הכול מוכן — אפשר לפתוח את מתג המכירות';level='ok'}
 else if(p.engineeringReady){status='המערכת מוכנה הנדסית — נשארו חיבורי LIVE / פרטי עסק / AliExpress';level='warn'}
 const blockers=(d.blockers||[]).map(x=>labels[x]||x);
 app.innerHTML=`
 <section class="hero"><h1>מוכנות להשקה</h1><div class="heroStatus">${esc(status)}</div><div class="chips">
  <span class="chip ${p.engineeringReady?'ok':'bad'}">הנדסה ${p.engineeringReady?'מוכנה':'לא מלאה'}</span>
  <span class="chip ${p.liveProvidersReady?'ok':'warn'}">ספקי LIVE ${p.liveProvidersReady?'מוכנים':'טרם הופעלו'}</span>
  <span class="chip ${p.businessReady?'ok':'warn'}">פרטי עסק ${p.businessReady?'מלאים':'חסרים'}</span>
  <span class="chip ${p.fullCatalogReady?'ok':(p.aliOnlyCatalogBlocker?'warn':'bad')}">קטלוג ${p.fullCatalogReady?'מלא':(p.aliOnlyCatalogBlocker?'Ali בלבד מעכב':'חסום')}</span>
 </div><div class="stamp">נבדק: ${esc(new Date(d.checkedAt).toLocaleString('he-IL'))}</div><div class="actions"><button class="btn yellow" onclick="load()">רענן בדיקה</button><a class="btn" href="/admin-paypal-test.html">בדיקת PayPal Sandbox</a><a class="btn" href="/">פתח חנות</a></div></section>
 <div class="grid">
  <section class="card"><h2>תשלום מקצה לקצה</h2>
   ${row(yes(pay.sandboxE2EVerified),'PayPal Sandbox → CJ',pay.sandboxE2EVerified?`עבר בהצלחה (${pay.sandboxE2EOrderId})`:'טרם אומת')}
   ${row(pay.paypalLiveReady?'ok':'warn','PayPal LIVE',pay.paypalLiveReady?'פרטי LIVE מוגדרים.':`כרגע: ${pay.paypalEnvironment||'לא ידוע'} — לפני כסף אמיתי נדרשים פרטי LIVE.`)}
  </section>
  <section class="card"><h2>CJ והזמנה אוטומטית</h2>
   ${row(f.trackingE2EVerified?'ok':'bad','Tracking אוטומטי',f.trackingE2EVerified?`נבדק בהזמנה ${f.trackingE2EOrderId}`:'טרם הוכח מקצה לקצה')}
   ${row(f.cjConfigured?'ok':'bad','חיבור CJ',f.cjConfigured?'API מחובר.':'API לא מוגדר.')}
   ${row(f.cjLiveReady?'ok':'warn','מצב חי',f.cjLiveReady?'Live + AutoPay + יתרה חיובית מוכנים.':`Sandbox: ${f.cjSandbox?'כן':'לא'} · AutoPay: ${f.cjAutoPay?'כן':'לא'} · יתרה: ${money(f.cjBalanceUsd)}`)}
  </section>
  <section class="card"><h2>קטלוג</h2>
   ${row(c.ready>0?'ok':'bad','מוצרים מוכנים',`${c.ready||0} מתוך ${c.active||0} מוצרים פעילים מוכנים להזמנה.`)}
   ${row((c.nonAliexpressBlocked||[]).length===0?'ok':'bad','חסימות שאינן AliExpress',(c.nonAliexpressBlocked||[]).length===0?'אין.':'יש מוצרים אחרים שעדיין חסומים.')}
   ${row((c.aliexpressBlocked||[]).length===0?'ok':'warn','AliExpress',(c.aliexpressBlocked||[]).length?`${c.aliexpressBlocked.length} מוצרים מחכים להרשאה/סנכרון.`:'כל מוצרי AliExpress מוכנים.')}
   <div class="products">${(c.readyProducts||[]).map(x=>`<div class="product">✓ ${esc(x.name)} · ${esc(x.supplier)}</div>`).join('')}</div>
  </section>
  <section class="card"><h2>אוטומציה והגנות</h2>
   ${row(a.workersReady?'ok':'bad','4 עבודות Cron',a.workersReady?'Sourcing, Catalog, Retry ו-Tracking פעילים בתזמון הנכון.':'אחת מעבודות הרקע חסרה/כבויה/בתזמון שגוי.')}
   ${row(g.ready?'ok':'bad','הגנות Checkout',g.ready?`רווח מינימלי ₪${Number(g.minimumProfitIls).toFixed(2)} · הצעת משלוח ${g.paymentQuoteTtlMinutes} דקות.`:'הגדרות ההגנה אינן תקינות.')}
  </section>
  <section class="card"><h2>עסק ומכירות</h2>
   ${row(b.ready?'ok':'warn','זהות עסקית',b.ready?'הפרטים הנדרשים להפעלה חיה קיימים.':'חסר מספר מס/סוג עסק תקין או פרט עסקי נדרש.')}
   ${row(p.salesEnabled?'ok':'warn','מתג מכירות',p.salesEnabled?'פתוח.':'כבוי בכוונה עד השלמת LIVE.')}
   ${row(p.canEnableSales?'ok':'warn','מותר לפתוח מכירות',p.canEnableSales?'כל שערי ה-LIVE עברו.':'עדיין לא — המערכת תישאר fail-closed.')}
  </section>
  <section class="card"><h2>מה עדיין נשאר</h2>
   ${blockers.length?blockers.map((x,i)=>row(x.includes('AliExpress')||x.includes('Ali')||x.includes('LIVE')||x.includes('CJ')||x.includes('עסק')||x.includes('מתג')?'warn':'bad',`#${i+1}`,x)).join(''):row('ok','אין חסימות','כל הבדיקות עברו.')}
  </section>
 </div>`;
}
load();
</script>
</body>
</html>
