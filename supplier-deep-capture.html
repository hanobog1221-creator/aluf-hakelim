<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>בדיקה עמוקה AliExpress | אלוף הכלים</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#eef1f4;color:#171717}.top{background:#0b1118;color:#fff;padding:16px}.wrap{max-width:820px;margin:20px auto;padding:0 14px}.p{background:#fff;border:1px solid #dfe4e9;border-radius:14px;padding:16px;margin-bottom:12px}.btn{display:inline-block;border:0;border-radius:10px;background:#ffc928;color:#111;padding:11px 15px;font-weight:900;text-decoration:none;cursor:pointer}.notice{background:#fff8d8;border:1px solid #efd36d;border-radius:10px;padding:11px;margin:10px 0}.ok{background:#effaf3;border-color:#b8dec7}.bad{background:#fff4f4;border-color:#ffd0d2}.muted{color:#687684;font-size:12px;line-height:1.6}</style>
</head>
<body><div class="top"><b>אלוף הכלים · בדיקה עמוקה ל‑AliExpress</b></div><main class="wrap">
<section class="p"><h2>לכידה ישירה של נתוני AliExpress</h2><p>v2 קוראת את תגובת ה‑PDP של המוצר הפתוח ומחלצת ממנה את מודולי SKU, מחיר, כמות ומשלוח. היא לא משתמשת ב‑cache של העגלה.</p><a id="bookmark" class="btn" href="#">🧠 לכידה עמוקה AliExpress v2</a><div class="muted" style="margin-top:9px">בחר את הווריאנט המדויק בעמוד AliExpress ורק אז לחץ על הסימנייה.</div></section>
<section class="p"><div id="status" class="notice">ממתין לנתונים.</div><div id="details" class="muted"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);
function makeBookmark(){const target=location.origin+'/supplier-deep-capture.html';const code=`(async()=>{let w;try{
w=window.open('about:blank','_blank');if(!w){alert('הדפדפן חסם חלון חדש');return}
const T=e=>String(e?.innerText||e?.textContent||'').replace(/\\s+/g,' ').trim();
const pageUrl=document.querySelector('link[rel=canonical]')?.href||location.href;const pid=(pageUrl.match(/(?:item\\/|product\\/)(\\d{8,20})\\.html/i)||location.href.match(/(?:item\\/|product\\/)(\\d{8,20})\\.html/i)||[])[1]||'';
const selected=[...document.querySelectorAll('[aria-checked="true"],[aria-selected="true"],[class*="sku-item--selected"],[class*="sku-item"][class*="selected"]')].filter(e=>String(e.className||'').toLowerCase().includes('sku')||e.closest('[class*="sku"]'));
const labels=[],attrs=[];for(const e of selected){let t=e.getAttribute('title')||e.getAttribute('aria-label')||e.querySelector('img')?.alt||T(e);t=String(t||'').trim();if(t&&t.length<120&&!labels.includes(t))labels.push(t);for(const a of [...(e.attributes||[])])attrs.push(a.name+'='+String(a.value||'').slice(0,240))}
const variant=labels.slice(0,6).join(' / '),selectedHtml=selected.map(e=>String(e.outerHTML||'')).join('\\n').slice(0,7000);
const clone=(v,d=0,seen=new WeakSet())=>{if(v==null||typeof v==='number'||typeof v==='boolean')return v;if(typeof v==='string')return v.slice(0,1800);if(typeof v!=='object')return String(v).slice(0,300);if(d>7)return '[depth]';if(seen.has(v))return '[circular]';seen.add(v);if(Array.isArray(v))return v.slice(0,120).map(x=>clone(x,d+1,seen));const o={};for(const k of Object.keys(v).slice(0,220)){try{o[k]=clone(v[k],d+1,seen)}catch{o[k]='[unreadable]'}}return o};
const parseText=t=>{try{return JSON.parse(t)}catch{}const a=t.indexOf('('),b=t.lastIndexOf(')');if(a>=0&&b>a){try{return JSON.parse(t.slice(a+1,b))}catch{}}return null};
const resources=performance.getEntriesByType('resource').map(e=>e.name).filter(u=>/acs\\.aliexpress\\.com\\/h5\\/mtop\\.aliexpress\\.pdp\\.pc\\.query/i.test(u));const pdpUrl=resources[resources.length-1]||'';if(!pdpUrl)throw new Error('לא נמצאה תגובת PDP בעמוד');
const r=await fetch(pdpUrl,{credentials:'include',cache:'no-store'});const text=await r.text();const parsed=parseText(text);if(!parsed)throw new Error('לא הצלחתי לפרש את תגובת PDP');
const matches=[];let walked=0;const seen=new WeakSet();const wanted=/^(PRICE|PRICE_PC|PRICE_EXTEND|SKU|SKU_PC|SKU_PRICE|SKU_PRICE_LIST|SKU_PROP|SKU_PROPERTY|QUANTITY|QUANTITY_PC|SHIPPING|SHIPPING_PC|DELIVERY|INVENTORY)$/i;const keyish=/(sku|price|quantity|inventory|shipping|delivery)/i;
const walk=(o,path,d)=>{if(!o||typeof o!=='object'||d>12||walked++>60000||seen.has(o))return;seen.add(o);let keys=[];try{keys=Object.keys(o)}catch{return}for(const k of keys){let v;try{v=o[k]}catch{continue}const p=path?path+'.'+k:k;if(wanted.test(k)&&v&&typeof v==='object'&&matches.length<40)matches.push({global:'pdp_response',path:p,snapshot:clone(v)});if(v&&typeof v==='object')walk(v,p,d+1)}if(matches.length<40&&keys.some(k=>keyish.test(k))&&keys.some(k=>/productId|itemId|skuId|skuIdStr|totalAvailableInventory|formattedAmount|shippingFee/i.test(k))){try{const s=clone(o);const id=String(o.productId??o.itemId??'');const sk=String(o.skuId??o.skuIdStr??'');if(id===pid||sk)matches.push({global:'pdp_response',path:path||'root',skuId:sk||null,snapshot:s})}catch{}}};walk(parsed,'root',0);
const snippets=[];const addSnippet=(label,re)=>{const m=re.exec(text);if(!m)return;const at=m.index;snippets.push(label+': '+text.slice(Math.max(0,at-500),Math.min(text.length,at+1500)).replace(/\\s+/g,' ').slice(0,1900))};addSnippet('selected-sku',new RegExp('1200\\d{10,20}'));addSnippet('quantity',/totalAvailableInventory/i);addSnippet('price',/(PRICE_PC|SKU_PRICE|formattedAmount|salePrice|activityAmount)/i);addSnippet('shipping',/(shippingFee|SHIP(PING)?_PC|deliveryOptionCode)/i);
const u=new URL(pdpUrl);const data={pageUrl,productId:pid,variant,selectedHtml,selectedAttributes:attrs.slice(0,30),globals:['pdp_response_v2'],cacheMatches:matches.slice(0,36),resourcePaths:[{host:u.hostname,path:u.pathname,queryKeys:[...u.searchParams.keys()]}],networkBodies:[{host:u.hostname,path:u.pathname,status:r.status,queryKeys:[...u.searchParams.keys()],snippets}],counts:{selected:selected.length,roots:1,walked,cacheMatches:matches.length,resources:1,networkBodies:1},capturedAt:new Date().toISOString()};
w.name=JSON.stringify(data);w.location=${JSON.stringify(target)};
}catch(e){try{if(w&&!w.closed)w.close()}catch{}alert('Deep capture failed: '+e.message)}})()`;return 'javascript:'+code.replace(/\n/g,'')}
$('#bookmark').href=makeBookmark();
(async()=>{const raw=window.name;window.name='';if(!raw)return;let data;try{data=JSON.parse(raw)}catch{$('#status').className='notice bad';$('#status').textContent='הנתונים לא נקראו.';return}$('#status').textContent='שומר את תגובת ה‑PDP לאדמין…';$('#details').textContent=`Product ${data.productId||'?'} · ${data.cacheMatches?.length||0} מודולי PDP`;try{const r=await fetch('/api/admin/supplier-capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'diagnostic',supplier_product_id:data.productId,captured_at:data.capturedAt,diagnostic:data})});const d=await r.json().catch(()=>({}));if(r.status===401){$('#status').className='notice bad';$('#status').innerHTML='צריך להתחבר לאדמין באותו Chrome ואז ללחוץ שוב. <a href="/admin">כניסה לאדמין</a>';return}if(!r.ok||!d.ok)throw new Error(d.error||'send_failed');$('#status').className='notice ok';$('#status').textContent='✅ תגובת PDP נלכדה ונשמרה. מכאן אני ממשיך לבד.';$('#details').textContent+=' · snapshot '+(d.snapshot_id||'saved')}catch(e){$('#status').className='notice bad';$('#status').textContent='השליחה נכשלה: '+e.message}})();
</script></body></html>
