<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>בדיקה עמוקה AliExpress | אלוף הכלים</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#eef1f4;color:#171717}.top{background:#0b1118;color:#fff;padding:16px}.wrap{max-width:820px;margin:20px auto;padding:0 14px}.p{background:#fff;border:1px solid #dfe4e9;border-radius:14px;padding:16px;margin-bottom:12px}.btn{display:inline-block;border:0;border-radius:10px;background:#ffc928;color:#111;padding:11px 15px;font-weight:900;text-decoration:none;cursor:pointer}.notice{background:#fff8d8;border:1px solid #efd36d;border-radius:10px;padding:11px;margin:10px 0}.ok{background:#effaf3;border-color:#b8dec7}.bad{background:#fff4f4;border-color:#ffd0d2}.muted{color:#687684;font-size:12px;line-height:1.6}</style>
</head>
<body><div class="top"><b>אלוף הכלים · בדיקה עמוקה ל‑AliExpress</b></div><main class="wrap">
<section class="p"><h2>בדיקת SKU / מלאי אמיתית</h2><p>הכלי לא שומר מוצר ולא משנה מלאי. הוא שולח לאדמין רק מבנה SKU/מלאי ונתיבי network ללא ערכי query.</p><a id="bookmark" class="btn" href="#">🧠 בדיקה עמוקה AliExpress</a><div class="muted" style="margin-top:9px">גרור פעם אחת לסרגל הסימניות. בעמוד המוצר ב‑AliExpress בחר את הווריאנט המדויק ולחץ על הסימנייה.</div></section>
<section class="p"><div id="status" class="notice">ממתין לנתונים.</div><div id="details" class="muted"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);
function makeBookmark(){const target=location.origin+'/supplier-deep-capture.html';const code=`(()=>{try{
const T=e=>String(e?.innerText||e?.textContent||'').replace(/\\s+/g,' ').trim();
const url=document.querySelector('link[rel=canonical]')?.href||location.href;const pid=(url.match(/(?:item\\/|product\\/)(\\d{8,20})\\.html/i)||location.href.match(/(?:item\\/|product\\/)(\\d{8,20})\\.html/i)||[])[1]||'';
const selected=[...document.querySelectorAll('[aria-checked="true"],[aria-selected="true"],[class*="sku-item--selected"],[class*="sku-item"][class*="selected"]')].filter(e=>String(e.className||'').toLowerCase().includes('sku')||e.closest('[class*="sku"]'));
const labels=[],attrs=[];for(const e of selected){let t=e.getAttribute('title')||e.getAttribute('aria-label')||e.querySelector('img')?.alt||T(e);t=String(t||'').trim();if(t&&t.length<120&&!labels.includes(t))labels.push(t);for(const a of [...(e.attributes||[])])attrs.push(a.name+'='+String(a.value||'').slice(0,240))}
const variant=labels.slice(0,6).join(' / ');const selectedHtml=selected.map(e=>String(e.outerHTML||'')).join('\\n').slice(0,7000);
const safeClone=(v,d=0,seen=new WeakSet())=>{if(v===null||v===undefined||typeof v==='number'||typeof v==='boolean')return v;if(typeof v==='string')return v.slice(0,500);if(typeof v!=='object')return String(v).slice(0,200);if(d>5)return '[depth]';if(seen.has(v))return '[circular]';seen.add(v);if(Array.isArray(v))return v.slice(0,60).map(x=>safeClone(x,d+1,seen));const o={};for(const k of Object.keys(v).slice(0,100)){try{o[k]=safeClone(v[k],d+1,seen)}catch{o[k]='[unreadable]'}}return o};
const cacheMatches=[];let walked=0;const roots=[];for(const name of ['_cache_product_items','runParams','__INIT_DATA__','__INITIAL_STATE__','__NEXT_DATA__','__PRELOADED_STATE__']){try{const r=window[name];if(r&&typeof r==='object')roots.push([name,r])}catch{}}
for(const name of Object.keys(window).filter(k=>/(cache.*product|product.*cache|sku.*data|product.*item|detail.*data)/i.test(k)).slice(0,30)){try{const r=window[name];if(r&&typeof r==='object'&&!roots.some(x=>x[0]===name))roots.push([name,r])}catch{}}
const scan=(root,name)=>{const seen=new WeakSet();let count=0;const rec=(o,path,d)=>{if(!o||typeof o!=='object'||d>10||count++>22000||cacheMatches.length>=30)return;if(seen.has(o))return;seen.add(o);walked++;let keys=[];try{keys=Object.keys(o)}catch{return}let explicit='';for(const k of ['skuId','skuIdStr','sku_id','skuID']){try{if(o[k]!=null)explicit=String(o[k])}catch{}}let productHit=false;try{productHit=keys.some(k=>{const v=o[k];return (typeof v==='string'||typeof v==='number')&&String(v)===pid})}catch{}const skuish=keys.some(k=>/(sku|inventory|stock|available|quantity|price|productId)/i.test(k));if((/^\\d{5,30}$/.test(explicit)||productHit||skuish&&/sku|product/i.test(path))&&cacheMatches.length<30){try{cacheMatches.push({global:name,path:path.slice(0,260),skuId:explicit||null,snapshot:safeClone(o)})}catch{}}for(const k of keys.slice(0,600)){let v;try{v=o[k]}catch{continue}if(v&&typeof v==='object')rec(v,path+'.'+k,d+1)}};rec(root,name,0)};for(const [n,r] of roots)scan(r,n);
const resourcePaths=[];for(const e of performance.getEntriesByType('resource').slice(-1200)){try{const u=new URL(e.name);if(!/(aliexpress|alicdn|alibaba|taobao)/i.test(u.hostname))continue;const key=(u.hostname+u.pathname+' '+[...u.searchParams.keys()].join(' '));if(!/(sku|product|detail|price|inventory|stock|mtop|api|trade)/i.test(key))continue;resourcePaths.push({host:u.hostname,path:u.pathname.slice(0,260),queryKeys:[...u.searchParams.keys()].slice(0,40),initiator:String(e.initiatorType||'').slice(0,40)})}catch{}}
const data={productId:pid,variant,selectedHtml,selectedAttributes:attrs.slice(0,30),globals:roots.map(x=>x[0]),cacheMatches,resourcePaths:resourcePaths.slice(0,80),counts:{selected:selected.length,roots:roots.length,walked,cacheMatches:cacheMatches.length,resources:resourcePaths.length},capturedAt:new Date().toISOString()};
const w=window.open('about:blank','_blank');if(!w){alert('הדפדפן חסם חלון חדש');return}w.name=JSON.stringify(data);w.location=${JSON.stringify(target)};
}catch(e){alert('Deep capture failed: '+e.message)}})()`;return 'javascript:'+code.replace(/\n/g,'')}
$('#bookmark').href=makeBookmark();
(async()=>{const raw=window.name;window.name='';if(!raw)return;let data;try{data=JSON.parse(raw)}catch{$('#status').className='notice bad';$('#status').textContent='הנתונים לא נקראו.';return}$('#status').textContent='שולח את הבדיקה לאדמין…';$('#details').textContent=`Product ${data.productId||'?'} · ${data.cacheMatches?.length||0} מבני cache · ${data.resourcePaths?.length||0} נתיבי network`;try{const r=await fetch('/api/admin/supplier-capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'diagnostic',supplier_product_id:data.productId,captured_at:data.capturedAt,diagnostic:data})});const d=await r.json().catch(()=>({}));if(r.status===401){$('#status').className='notice bad';$('#status').innerHTML='צריך להתחבר לאדמין באותו Chrome ואז ללחוץ שוב. <a href="/admin">כניסה לאדמין</a>';return}if(!r.ok||!d.ok)throw new Error(d.error||'send_failed');$('#status').className='notice ok';$('#status').textContent='✅ נשלח. אין צורך לשמור כלום — אפשר לחזור לצ׳אט.'}catch(e){$('#status').className='notice bad';$('#status').textContent='השליחה נכשלה: '+e.message}})();
</script></body></html>
