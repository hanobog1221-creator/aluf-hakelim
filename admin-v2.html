<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ניהול אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f4;color:#171717}button,input,textarea,select{font:inherit}.hidden{display:none!important}.top{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;border-bottom:1px solid #263342}.topin{max-width:1180px;margin:auto;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}.topActions{display:flex;gap:7px}.top a,.top button{border:1px solid #38485a;background:#17212d;color:#fff;border-radius:9px;padding:8px 11px;font-weight:850;text-decoration:none}.wrap{max-width:1180px;margin:20px auto;padding:0 14px}.login{max-width:430px;margin:65px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 16px 45px #0002}.login h1{margin:0 0 18px}.field{display:flex;flex-direction:column;gap:6px;margin:9px 0}.field label{font-size:12px;font-weight:900}.field input,.field textarea,.field select{width:100%;border:1px solid #cfd5dc;border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:78px;resize:vertical}.btn{border:0;border-radius:10px;background:var(--yellow);padding:10px 14px;font-weight:950;cursor:pointer}.btn.dark{background:#111923;color:#fff}.btn.small{padding:8px 10px;font-size:12px}.error{display:none;background:#fff0f0;border:1px solid #ffc8cb;color:#a91f2a;padding:10px;border-radius:10px;margin:10px 0}.error.show{display:block}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.stat b{font-size:24px;display:block}.stat small{color:var(--muted)}.tabs{display:flex;gap:7px;margin-bottom:13px;overflow:auto}.tab{border:1px solid #d7dde3;background:#fff;border-radius:10px;padding:9px 14px;font-weight:900;white-space:nowrap}.tab.active{background:#111923;color:#fff;border-color:#111923}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0 13px}.toolbar h2{margin:0}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:11px;overflow:hidden}.panel{padding:15px}.cardHead{padding:14px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #edf0f2}.cardHead h3{margin:0;font-size:17px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;background:#eef1f4}.pill.ok{background:#e5f7ed;color:var(--ok)}.pill.off{background:#ffe8e9;color:var(--bad)}.cardBody{padding:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid .full{grid-column:1/-1}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:11px}.saveMsg{font-size:12px;color:var(--ok);font-weight:850}.orderMeta{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:11px}.orderMeta div{background:#f6f8fa;border-radius:9px;padding:9px}.orderMeta b{display:block;font-size:11px;color:#66717c;margin-bottom:4px}.items{font-size:12px;line-height:1.65;background:#fafbfc;border-radius:9px;padding:9px}.empty{text-align:center;color:#77818c;padding:32px}.notice{background:#fff8d8;border:1px solid #f0d46b;border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.5;margin-bottom:11px}.toggleBox{display:flex;align-items:center;gap:7px;font-weight:850}.newForm{display:none}.newForm.open{display:block}.supplierResolve{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.supplierResolve input{flex:1;min-width:220px}.supplierResolve .saveMsg{min-width:120px}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.grid .full{grid-column:auto}.orderMeta{grid-template-columns:1fr 1fr}.brand{font-size:18px}}@media(max-width:470px){.orderMeta{grid-template-columns:1fr}.topin{align-items:flex-start}.topActions{flex-wrap:wrap;justify-content:flex-end}.supplierResolve{align-items:stretch}.supplierResolve input{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · ניהול</div><div class="topActions"><a id="toolsLink" class="hidden" href="/admin-tools">התראות והגדרות</a><a id="storeLink" class="hidden" href="/" target="_blank">פתח חנות</a><button id="logoutBtn" class="hidden">התנתק</button></div></div></div>
<div class="wrap">
<section id="loginBox" class="login"><h1>כניסה לניהול</h1><div class="field"><label>שם משתמש</label><input id="username" value="admin" autocomplete="username"></div><div class="field"><label>סיסמה</label><input id="password" type="password" autocomplete="current-password"></div><div class="error" id="loginError">שם משתמש או סיסמה לא נכונים.</div><button class="btn" id="loginBtn" style="width:100%">כניסה</button></section>
<section id="app" class="hidden">
<div class="summary"><div class="stat"><b id="statProducts">0</b><small>מוצרים</small></div><div class="stat"><b id="statActive">0</b><small>פעילים</small></div><div class="stat"><b id="statOrders">0</b><small>הזמנות</small></div><div class="stat"><b id="statPaid">0</b><small>שולמו</small></div><div class="stat"><b id="statAttention">0</b><small>דורשות טיפול</small></div></div>
<div class="tabs"><button class="tab active" data-tab="products">מוצרים</button><button class="tab" data-tab="orders">הזמנות</button></div>
<div id="productsTab"><div class="toolbar"><h2>מוצרים</h2><button class="btn small" id="newProductBtn">+ מוצר חדש</button></div><div class="panel newForm" id="newProductBox"><h3>הוספת מוצר</h3><div class="notice">אפשר להוסיף מוצר גם לפני שיש SKU. מוצר חדש לא יסומן כמוכן להזמנה אוטומטית עד שכל פרטי הספק יאומתו.</div><div class="grid"><div class="field"><label>מזהה פנימי באנגלית *</label><input id="npId" placeholder="impact2"></div><div class="field"><label>שם מוצר *</label><input id="npName"></div><div class="field"><label>מחיר מכירה *</label><input id="npPrice" type="number" step="0.01"></div><div class="field"><label>מחיר קודם</label><input id="npOldPrice" type="number" step="0.01"></div><div class="field full"><label>קישור לתמונה</label><input id="npImage"></div><div class="field full"><label>תיאור</label><textarea id="npDescription"></textarea></div><div class="field"><label>קטגוריות — מופרד בפסיקים</label><input id="npCategories" placeholder="power, car"></div><div class="field"><label>תגית</label><input id="npBadge"></div><div class="field full"><label>קישור ספק</label><div class="supplierResolve"><input id="npSupplierUrl" placeholder="הדבק קישור קצר או מלא"><button class="btn small dark" type="button" id="resolveSupplierBtn">זהה Product ID</button><span class="saveMsg" id="resolveSupplierMsg"></span></div></div><div class="field"><label>Product ID</label><input id="npProductId"></div><div class="field"><label>SKU ID</label><input id="npSkuId"></div><div class="field full"><label>וריאנט</label><input id="npVariant"></div></div><div class="row"><button class="btn" id="createProductBtn">הוסף מוצר</button><span class="saveMsg" id="newProductMsg"></span></div></div><div id="productsList"></div></div>
<div id="ordersTab" class="hidden"><div class="toolbar"><h2>הזמנות</h2><button class="btn small dark" id="refreshOrdersBtn">רענן</button></div><div id="ordersList"></div></div>
</section></div>
<script>
const state={products:[],orders:[]};const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '₪'+Number(v||0).toFixed(2)}
function fmtDate(v){if(!v)return '—';try{return new Date(v).toLocaleString('he-IL')}catch{return v}}
function statusHe(v){return ({draft:'טיוטה',payment_pending:'ממתין לתשלום',unpaid:'לא שולם',pending:'ממתין',paid:'שולם',failed:'נכשל',refunded:'הוחזר',processing:'בטיפול',ordered:'הוזמן',shipped:'נשלח',completed:'הושלם',cancelled:'בוטל',error:'שגיאה',not_started:'לא התחיל',waiting:'ממתין',ready:'מוכן',ordering:'מבצע הזמנה',delivered:'נמסר'})[v]||v||'—'}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(r.status===401){showLogin();throw new Error('unauthorized')}if(!r.ok||!data.ok)throw new Error(data.error||'request_failed');return data}
function showLogin(){$('#loginBox').classList.remove('hidden');$('#app').classList.add('hidden');['logoutBtn','toolsLink','storeLink'].forEach(id=>$('#'+id).classList.add('hidden'))}
function showApp(){$('#loginBox').classList.add('hidden');$('#app').classList.remove('hidden');['logoutBtn','toolsLink','storeLink'].forEach(id=>$('#'+id).classList.remove('hidden'))}
async function login(){const btn=$('#loginBtn');btn.disabled=true;$('#loginError').classList.remove('show');try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});$('#password').value='';await loadAll();showApp()}catch(e){if(e.message!=='unauthorized')$('#loginError').classList.add('show')}finally{btn.disabled=false}}
async function logout(){try{await api('/api/admin/logout',{method:'POST',body:'{}'})}catch{}showLogin()}
async function loadAll(){const [p,o]=await Promise.all([api('/api/admin/products'),api('/api/admin/orders?limit=200')]);state.products=p.products||[];state.orders=o.orders||[];renderAll()}
async function refreshOrders(){const o=await api('/api/admin/orders?limit=200');state.orders=o.orders||[];renderSummary();renderOrders()}
function renderAll(){renderSummary();renderProducts();renderOrders()}
function renderSummary(){$('#statProducts').textContent=state.products.length;$('#statActive').textContent=state.products.filter(p=>p.active).length;$('#statOrders').textContent=state.orders.length;$('#statPaid').textContent=state.orders.filter(o=>o.payment_status==='paid').length;$('#statAttention').textContent=state.orders.filter(o=>o.last_error||o.status==='error'||o.fulfillment_status==='failed').length}
function productCard(p){return `<div class="card" data-product="${esc(p.id)}"><div class="cardHead"><div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.id)} · ${p.fulfillment_ready?'מוכן להזמנה אוטומטית':'עדיין לא מאומת להזמנה אוטומטית'}</div></div><span class="pill ${p.active?'ok':'off'}">${p.active?'פעיל':'כבוי'}</span></div><div class="cardBody"><div class="grid"><div class="field"><label>שם</label><input data-k="name" value="${esc(p.name)}"></div><div class="field"><label>מחיר</label><input data-k="selling_price" type="number" step="0.01" value="${esc(p.selling_price)}"></div><div class="field"><label>מחיר קודם</label><input data-k="old_price" type="number" step="0.01" value="${p.old_price??''}"></div><div class="field"><label>סדר הצגה</label><input data-k="sort_order" type="number" value="${esc(p.sort_order||0)}"></div><div class="field full"><label>תמונה</label><input data-k="image_url" value="${esc(p.image_url||'')}"></div><div class="field full"><label>תיאור</label><textarea data-k="description">${esc(p.description||'')}</textarea></div><div class="field"><label>תגית</label><input data-k="badge" value="${esc(p.badge||'')}"></div><div class="field"><label>קטגוריות</label><input data-k="categories" value="${esc((p.categories||[]).join(', '))}"></div><div class="field full"><label>קישור ספק</label><input data-k="supplier_url" value="${esc(p.supplier_url||'')}"></div><div class="field"><label>Product ID</label><input data-k="supplier_product_id" value="${esc(p.supplier_product_id||'')}"></div><div class="field"><label>SKU ID</label><input data-k="supplier_sku_id" value="${esc(p.supplier_sku_id||'')}"></div><div class="field full"><label>וריאנט</label><input data-k="variant_label" value="${esc(p.variant_label||'')}"></div><div class="field"><label>עלות ספק</label><input value="${p.supplier_price??''}" disabled></div><div class="field"><label>משלוח ספק</label><input value="${p.supplier_shipping??''}" disabled></div></div><div class="row"><label class="toggleBox"><input data-k="active" type="checkbox" ${p.active?'checked':''}> פעיל באתר</label><button class="btn small" onclick="saveProduct('${esc(p.id)}')">שמור</button><span class="saveMsg" id="save-${esc(p.id)}"></span></div></div></div>`}
function renderProducts(){$('#productsList').innerHTML=state.products.length?state.products.map(productCard).join(''):'<div class="empty">אין מוצרים.</div>'}
async function saveProduct(id){const card=document.querySelector(`[data-product="${CSS.escape(id)}"]`);const payload={id};card.querySelectorAll('[data-k]').forEach(el=>{let v=el.type==='checkbox'?el.checked:el.value;const k=el.dataset.k;if(k==='categories')v=String(v).split(',').map(x=>x.trim()).filter(Boolean);if(['selling_price','old_price','sort_order'].includes(k)&&v!=='')v=Number(v);if(k==='old_price'&&v==='')v=null;payload[k]=v});const msg=document.getElementById('save-'+id);msg.textContent='שומר...';try{const data=await api('/api/admin/products',{method:'PATCH',body:JSON.stringify(payload)});const i=state.products.findIndex(p=>p.id===id);if(i>=0)state.products[i]=data.product;renderAll()}catch(e){msg.textContent='שגיאה בשמירה'}}
function productIdFromFullUrl(value){const m=String(value||'').match(/\/item\/(\d{8,20})(?:\.html)?/i);return m?m[1]:null}
async function resolveNewSupplierLink(silent=false){const input=$('#npSupplierUrl'),target=$('#npProductId'),msg=$('#resolveSupplierMsg');const value=input.value.trim();if(!value){if(!silent)msg.textContent='הדבק קישור קודם';return null}const direct=productIdFromFullUrl(value);if(direct){target.value=direct;msg.textContent='זוהה ✓';return direct}if(!/^https:\/\/a\.aliexpress\.com\//i.test(value)){if(!silent)msg.textContent='קישור לא מזוהה';return null}msg.textContent='מזהה...';try{const data=await api('/api/aliexpress/resolve?url='+encodeURIComponent(value),{method:'GET'});if(!data.productId)throw new Error('missing_product_id');target.value=String(data.productId);msg.textContent='זוהה ✓';return String(data.productId)}catch(e){msg.textContent=silent?'':'לא הצלחנו לזהות';return null}}
async function createProduct(){const msg=$('#newProductMsg');msg.textContent='שומר...';if(!$('#npProductId').value.trim()&&$('#npSupplierUrl').value.trim())await resolveNewSupplierLink(true);const payload={id:$('#npId').value.trim(),name:$('#npName').value.trim(),selling_price:Number($('#npPrice').value),old_price:$('#npOldPrice').value?Number($('#npOldPrice').value):null,image_url:$('#npImage').value.trim(),description:$('#npDescription').value.trim(),categories:$('#npCategories').value.split(',').map(x=>x.trim()).filter(Boolean),badge:$('#npBadge').value.trim(),supplier_url:$('#npSupplierUrl').value.trim(),supplier_product_id:$('#npProductId').value.trim(),supplier_sku_id:$('#npSkuId').value.trim(),variant_label:$('#npVariant').value.trim(),active:true,sort_order:state.products.length};try{const data=await api('/api/admin/products',{method:'POST',body:JSON.stringify(payload)});state.products.push(data.product);renderAll();['npId','npName','npPrice','npOldPrice','npImage','npDescription','npCategories','npBadge','npSupplierUrl','npProductId','npSkuId','npVariant'].forEach(id=>document.getElementById(id).value='');$('#resolveSupplierMsg').textContent='';msg.textContent='המוצר נוסף ✓'}catch(e){msg.textContent=e.message==='product_exists'?'המזהה כבר קיים':'שגיאה בהוספה'}}
function orderCard(o){const c=o.customer||{};const items=(o.items||[]).map(i=>`${esc(i.name)} × ${esc(i.qty)}`).join('<br>')||'—';const address=[c.street,c.houseNumber,c.apartment&&('דירה '+c.apartment),c.city,c.postalCode].filter(Boolean).join(', ');const finalTotal=Number(o.total||0)+Number(o.shipping_cost||0);return `<div class="card" data-order="${esc(o.order_id)}"><div class="cardHead"><div><h3>${esc(o.order_id)}</h3><div class="muted">${fmtDate(o.created_at)}</div></div><span class="pill ${o.payment_status==='paid'?'ok':''}">${statusHe(o.payment_status)}</span></div><div class="cardBody"><div class="orderMeta"><div><b>לקוח</b>${esc(c.fullName||'—')}</div><div><b>טלפון</b>${esc(c.phone||'—')}</div><div><b>סה״כ</b>${money(finalTotal)}</div><div><b>כתובת</b>${esc(address||'—')}</div><div><b>משלוח</b>${o.shipping_quote_status==='quoted'?money(o.shipping_cost||0):'בבדיקה'}</div></div><div class="items">${items}</div><div class="grid" style="margin-top:11px"><div class="field"><label>סטטוס הזמנה</label><select data-ok="status">${['draft','payment_pending','paid','processing','ordered','shipped','completed','cancelled','error'].map(v=>`<option value="${v}" ${o.status===v?'selected':''}>${statusHe(v)}</option>`).join('')}</select></div><div class="field"><label>סטטוס טיפול</label><select data-ok="fulfillment_status">${['not_started','waiting','ready','ordering','ordered','shipped','delivered','failed','cancelled'].map(v=>`<option value="${v}" ${o.fulfillment_status===v?'selected':''}>${statusHe(v)}</option>`).join('')}</select></div><div class="field"><label>מספר הזמנה אצל הספק</label><input data-ok="supplier_order_id" value="${esc(o.supplier_order_id||'')}"></div><div class="field"><label>מספר מעקב</label><input data-ok="tracking_number" value="${esc(o.tracking_number||'')}"></div><div class="field full"><label>שגיאה טכנית</label><input data-ok="last_error" value="${esc(o.last_error||'')}"></div></div><div class="row"><button class="btn small dark" onclick="saveOrder('${esc(o.order_id)}')">שמור הזמנה</button><span class="saveMsg" id="order-save-${esc(o.order_id)}"></span></div></div></div>`}
function renderOrders(){$('#ordersList').innerHTML=state.orders.length?state.orders.map(orderCard).join(''):'<div class="empty">אין הזמנות עדיין.</div>'}
async function saveOrder(id){const card=document.querySelector(`[data-order="${CSS.escape(id)}"]`);const payload={order_id:id};card.querySelectorAll('[data-ok]').forEach(el=>payload[el.dataset.ok]=el.value);const msg=document.getElementById('order-save-'+id);msg.textContent='שומר...';try{const data=await api('/api/admin/orders',{method:'PATCH',body:JSON.stringify(payload)});const i=state.orders.findIndex(o=>o.order_id===id);if(i>=0)state.orders[i]=data.order;renderSummary();renderOrders()}catch(e){msg.textContent='שגיאה בשמירה'}}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const tab=btn.dataset.tab;$('#productsTab').classList.toggle('hidden',tab!=='products');$('#ordersTab').classList.toggle('hidden',tab!=='orders')}));
$('#loginBtn').addEventListener('click',login);$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#logoutBtn').addEventListener('click',logout);$('#newProductBtn').addEventListener('click',()=>$('#newProductBox').classList.toggle('open'));$('#createProductBtn').addEventListener('click',createProduct);$('#resolveSupplierBtn').addEventListener('click',()=>resolveNewSupplierLink(false));$('#npSupplierUrl').addEventListener('blur',()=>{if(!$('#npProductId').value.trim())resolveNewSupplierLink(true)});$('#refreshOrdersBtn').addEventListener('click',()=>refreshOrders().catch(()=>{}));loadAll().then(showApp).catch(()=>showLogin());
</script>
<script src="/admin-enhancements.js"></script>
</body>
</html>
