<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>ספקי תשלום | אלוף הכלים</title><style>:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#66717d;--ok:#197342;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef1f4;color:#171717}.top{background:var(--dark);color:#fff}.topin,.wrap{max-width:900px;margin:auto}.topin{padding:14px;display:flex;justify-content:space-between}.top a{color:#fff}.wrap{padding:20px 14px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:12px}.card.selected{border:2px solid var(--yellow)}.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:#eef1f4}.ok{color:var(--ok)}.bad{color:var(--bad)}.muted{color:var(--muted);font-size:13px;line-height:1.55}</style></head><body><div class="top"><div class="topin"><b>אלוף הכלים · תשלומים</b><a href="/admin">חזרה לניהול</a></div></div><main class="wrap"><section class="panel"><h1>ספקי תשלום — מסלול B</h1><p class="muted">הספק נבחר בהגדרות השרת בלבד. סודות לעולם אינם מוצגים כאן, וספק ללא אישור ופרטי API נשאר מושבת.</p></section><section id="providers" class="panel">טוען…</section></main><script>const el=document.getElementById('providers');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/admin/payment-providers',{headers:{Accept:'application/json'}}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');el.innerHTML='<h2>מצב נוכחי</h2>'+d.providers.map(p=>`<article class="card ${p.id===d.selected?'selected':''}"><div><b>${esc(p.label)}</b> ${p.id===d.selected?'<span class="tag">נבחר</span>':''}</div><p class="${p.enabled&&p.configured?'ok':'bad'}">${p.enabled&&p.configured?'מוגדר':'מושבת / ממתין לאישור'}</p><div class="muted">סביבה: ${esc(p.environment)} · Live: ${p.live?'כן':'לא'} · מקור אישורים: ${esc(p.credentialSource)}</div>${p.status?`<div class="muted">מצב: ${esc(p.status)}</div>`:''}</article>`).join('')}).catch(e=>{el.textContent=e.message==='unauthorized'?'נדרשת כניסה לניהול.':'לא הצלחנו לטעון את מצב ספקי התשלום.'})</script></body></html>
