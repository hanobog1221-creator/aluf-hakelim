<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>החזרים | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--warn:#8b6500;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#171717;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.top{background:var(--dark);color:#fff}.topin{max-width:1050px;margin:auto;padding:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{color:#fff;text-decoration:none;font-weight:850}.wrap{max-width:1050px;margin:20px auto;padding:0 14px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:12px}.panel{padding:16px}.panel h1{margin:0 0 6px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.notice{background:#fff8d8;border:1px solid #efd36d;border-radius:11px;padding:11px 13px;margin-top:12px;font-size:13px;line-height:1.55}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}.stat{background:#f7f9fb;border-radius:10px;padding:11px}.stat b{display:block;font-size:22px}.stat small{color:var(--muted)}.card{overflow:hidden}.head{padding:13px 14px;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head h2{margin:0 0 3px;font-size:16px}.pill{border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;background:#eef1f4}.pill.ok{background:#e5f7ed;color:var(--ok)}.pill.warn{background:#fff4cf;color:var(--warn)}.pill.bad{background:#ffe7e8;color:var(--bad)}.body{padding:14px}.meta{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.box{background:#f7f9fb;border-radius:9px;padding:9px;min-width:0}.box b{display:block;font-size:11px;color:#66717c;margin-bottom:4px}.refundForm{display:grid;grid-template-columns:220px 180px 1fr;gap:9px;margin-top:12px;align-items:end}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:900}.field input,.field select{border:1px solid #cfd5dc;border-radius:9px;padding:10px;background:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 12px;background:var(--yellow);font-weight:950;cursor:pointer}.btn.dark{background:#111923;color:#fff}.btn.light{background:#fff;border:1px solid #d7dde3}.btn:disabled{opacity:.55}.msg{margin-top:9px;font-size:12px;font-weight:850}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.empty{text-align:center;padding:35px;color:#77818c}.login{text-align:center;padding:45px 20px}.search{width:100%;max-width:420px;border:1px solid #cfd5dc;border-radius:10px;padding:11px;margin-top:12px}@media(max-width:850px){.meta{grid-template-columns:1fr 1fr}.refundForm{grid-template-columns:1fr 1fr}.refundForm .actions{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}}@media(max-width:500px){.meta,.refundForm,.summary{grid-template-columns:1fr}.refundForm .actions{grid-column:auto}.topin{align-items:flex-start}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · החזרים</div><div class="links"><a href="/accounting">חשבונות</a><a href="/admin">ניהול</a></div></div></div>
<main class="wrap" id="app"><section class="panel"><div class="muted">טוען...</div></section></main>
<script>
const app=document.getElementById('app');let orders=[];let query='';const messages=new Map();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '₪'+Number(v||0).toFixed(2)}
function dt(v){if(!v)return '—';try{return new Date(v).toLocaleString('he-IL')}catch{return String(v)}}
function gross(o){return Number((Number(o.total||0)+Number(o.shipping_cost||0)).toFixed(2))}
function completed(o){return ['partial','refunded'].includes(String(o.refund_status||''))||Boolean(o.refunded_at)}
function refundHe(v){return ({none:'אין החזר',requested:'התבקש',approved:'אושר',rejected:'נדחה',processing:'בטיפול',partial:'הוחזר חלקית',refunded:'הוחזר במלואו'})[v]||v||'אין החזר'}
function refundState(v){if(v==='refunded'||v==='partial')return 'ok';if(v==='rejected')return 'bad';if(v&&v!=='none')return 'warn';return ''}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok){const e=new Error(d.error||'request_failed');e.data=d;throw e}return d}
function visible(){const q=query.trim().toLocaleLowerCase('he');return orders.filter(o=>{if(!o.paid_at&&!['paid','refunded'].includes(o.payment_status))return false;if(!q)return true;const c=o.customer||{};return [o.order_id,c.fullName,c.phone,o.payment_reference,o.refund_status].filter(Boolean).join(' ').toLocaleLowerCase('he').includes(q)})}
function card(o){const g=gross(o);const amount=Number(o.refund_amount||0);const msg=messages.get(o.order_id);return `<section class="card" data-order="${esc(o.order_id)}"><div class="head"><div><h2>${esc(o.order_id)}</h2><div class="muted">${esc(o.customer?.fullName||'—')} · ${esc(o.customer?.phone||'—')} · שולם ${esc(dt(o.paid_at))}</div></div><span class="pill ${refundState(o.refund_status)}">${esc(refundHe(o.refund_status))}</span></div><div class="body"><div class="meta"><div class="box"><b>שולם</b>${money(g)}</div><div class="box"><b>החזר רשום</b>${money(amount)}</div><div class="box"><b>יתרה מצטברת</b>${money(Math.max(0,g-(completed(o)?amount:0)))}</div><div class="box"><b>סטטוס תשלום</b>${esc(o.payment_status||'—')}</div><div class="box"><b>בוצע בתאריך</b>${esc(dt(o.refunded_at))}</div></div><div class="refundForm"><div class="field"><label>סטטוס החזר</label><select data-k="refund_status">${[['none','אין'],['requested','התבקש'],['approved','אושר'],['rejected','נדחה'],['processing','בטיפול'],['partial','החזר חלקי בוצע'],['refunded','החזר מלא בוצע']].map(([v,l])=>`<option value="${v}" ${o.refund_status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>סכום החזר</label><input data-k="refund_amount" type="number" min="0" max="${g}" step="0.01" value="${amount.toFixed(2)}"></div><div class="actions"><button class="btn light" type="button" onclick="fillFull('${esc(o.order_id)}')">מלא סכום מלא</button><button class="btn dark" type="button" onclick="saveRefund('${esc(o.order_id)}')">שמור רישום</button></div></div><div class="muted" style="margin-top:9px"><b>חשוב:</b> המסך לא מעביר כסף. מסמנים “בוצע” רק אחרי שההחזר בוצע בפועל אצל ספק הסליקה/בנק. לאחר שמירה, הדוח הכספי מתעדכן אוטומטית.</div>${msg?`<div class="msg ${msg.ok?'ok':'bad'}">${esc(msg.text)}</div>`:''}</div></section>`}
function render(){const list=visible();const completedCount=orders.filter(o=>completed(o)&&Number(o.refund_amount||0)>0).length;const completedTotal=orders.reduce((s,o)=>s+(completed(o)?Number(o.refund_amount||0):0),0);const pending=orders.filter(o=>['requested','approved','processing'].includes(o.refund_status)).length;app.innerHTML=`<section class="panel"><h1>ניהול ורישום החזרים</h1><div class="muted">כל שינוי כאן הוא רישום חשבונאי/תפעולי בלבד. החזר כספי אמיתי חייב להתבצע אצל ספק הסליקה, וכשנחבר ספק תשלום נוכל לחבר גם את שלב ההחזר אליו.</div><div class="notice">המערכת לא מאפשרת לרשום החזר גדול מהסכום ששולם. “החזר מלא” חייב להיות בדיוק מלוא הסכום, ו“החזר חלקי” חייב להיות קטן ממנו.</div><div class="summary"><div class="stat"><b>${orders.filter(o=>o.paid_at).length}</b><small>הזמנות ששולמו</small></div><div class="stat"><b>${completedCount}</b><small>החזרים שבוצעו</small></div><div class="stat"><b>${money(completedTotal)}</b><small>סה״כ החזר מצטבר</small></div><div class="stat"><b>${pending}</b><small>ממתינים/בטיפול</small></div></div><input id="search" class="search" placeholder="חיפוש הזמנה, לקוח או טלפון" value="${esc(query)}"></section>${list.length?list.map(card).join(''):'<section class="panel empty">אין הזמנות מתאימות.</section>'}`;document.getElementById('search')?.addEventListener('input',e=>{query=e.target.value;render()})}
function fillFull(id){const card=document.querySelector(`[data-order="${CSS.escape(id)}"]`);const order=orders.find(o=>o.order_id===id);if(!card||!order)return;card.querySelector('[data-k="refund_status"]').value='refunded';card.querySelector('[data-k="refund_amount"]').value=gross(order).toFixed(2)}
function friendly(error){return ({invalid_refund_status:'סטטוס ההחזר לא תקין.',invalid_refund_amount:'סכום ההחזר לא תקין או גדול מהסכום ששולם.',invalid_partial_refund_amount:'החזר חלקי חייב להיות גדול מאפס וקטן מהסכום ששולם.',invalid_full_refund_amount:'החזר מלא חייב להיות בדיוק הסכום ששולם.',refund_requires_paid_order:'אפשר לרשום החזר שבוצע רק להזמנה ששולמה.',completed_refund_cannot_reopen:'החזר שכבר הושלם לא ניתן להחזיר לסטטוס ביניים דרך המסך.',invalid_refund_update:'ה-DB דחה את רישום ההחזר בגלל אי-התאמה.'})[error]||'לא הצלחנו לשמור את רישום ההחזר.'}
async function saveRefund(id){const card=document.querySelector(`[data-order="${CSS.escape(id)}"]`);const order=orders.find(o=>o.order_id===id);if(!card||!order)return;const status=card.querySelector('[data-k="refund_status"]').value;const amount=Number(card.querySelector('[data-k="refund_amount"]').value||0);if(['partial','refunded'].includes(status)){const ok=window.confirm('אישור זה רושם שהכסף כבר הוחזר בפועל ללקוח. להמשיך?');if(!ok)return}messages.set(id,{ok:true,text:'שומר...'});render();try{const d=await api('/api/admin/orders',{method:'PATCH',body:JSON.stringify({order_id:id,refund_status:status,refund_amount:amount})});const i=orders.findIndex(o=>o.order_id===id);if(i>=0)orders[i]=d.order;messages.set(id,{ok:true,text:'נשמר ✓ הדוחות יתעדכנו אוטומטית.'})}catch(e){messages.set(id,{ok:false,text:friendly(e.message)})}render()}
function showLogin(){app.innerHTML='<section class="panel login"><h2>צריך להתחבר לניהול</h2><div class="muted">העמוד מוגן באותה התחברות של ה-Admin.</div><div style="margin-top:12px"><a class="btn" href="/admin" style="text-decoration:none;color:#171717">כניסה לניהול</a></div></section>'}
async function load(){try{const d=await api('/api/admin/orders?limit=200');orders=d.orders||[];render()}catch(e){if(e.message==='unauthorized')showLogin();else app.innerHTML='<section class="panel">לא הצלחנו לטעון הזמנות.</section>'}}
load();
</script>
</body>
</html>
