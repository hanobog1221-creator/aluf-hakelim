<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>החזרים | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--warn:#8b6500;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#171717;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.top{background:var(--dark);color:#fff}.topin{max-width:1080px;margin:auto;padding:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{color:#fff;text-decoration:none;font-weight:850}.wrap{max-width:1080px;margin:20px auto;padding:0 14px 40px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:12px}.panel{padding:16px}.panel h1{margin:0 0 6px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.notice{background:#fff8d8;border:1px solid #efd36d;border-radius:11px;padding:11px 13px;margin-top:12px;font-size:13px;line-height:1.55}.notice.good{background:#e9f8ef;border-color:#b9e4c9;color:#155f39}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}.stat{background:#f7f9fb;border-radius:10px;padding:11px}.stat b{display:block;font-size:22px}.stat small{color:var(--muted)}.card{overflow:hidden}.head{padding:13px 14px;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head h2{margin:0 0 3px;font-size:16px}.pill{border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;background:#eef1f4}.pill.ok{background:#e5f7ed;color:var(--ok)}.pill.warn{background:#fff4cf;color:var(--warn)}.pill.bad{background:#ffe7e8;color:var(--bad)}.body{padding:14px}.meta{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.box{background:#f7f9fb;border-radius:9px;padding:9px;min-width:0}.box b{display:block;font-size:11px;color:#66717c;margin-bottom:4px}.refundForm{display:grid;grid-template-columns:180px 1fr;gap:9px;margin-top:12px;align-items:end}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:900}.field input,.field select{border:1px solid #cfd5dc;border-radius:9px;padding:10px;background:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 12px;background:var(--yellow);font-weight:950;cursor:pointer}.btn.dark{background:#111923;color:#fff}.btn.light{background:#fff;border:1px solid #d7dde3}.btn.red{background:#a51e28;color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{margin-top:9px;font-size:12px;font-weight:850;line-height:1.5}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}.empty{text-align:center;padding:35px;color:#77818c}.login{text-align:center;padding:45px 20px}.search{width:100%;max-width:420px;border:1px solid #cfd5dc;border-radius:10px;padding:11px;margin-top:12px}.providerBox{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f7f9fb;font-size:12px;line-height:1.55}.manual{margin-top:12px;border-top:1px solid #edf0f2;padding-top:12px}@media(max-width:900px){.meta{grid-template-columns:1fr 1fr 1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:620px){.meta,.refundForm,.summary{grid-template-columns:1fr}.topin{align-items:flex-start}.refundForm .actions{grid-column:auto}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · החזרים</div><div class="links"><a href="/accounting">חשבונות</a><a href="/launch-checklist.html">מוכנות להשקה</a><a href="/admin">ניהול</a></div></div></div>
<main class="wrap" id="app"><section class="panel"><div class="muted">טוען...</div></section></main>
<script>
const app=document.getElementById('app');let orders=[];let query='';const messages=new Map();const busy=new Set();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '₪'+Number(v||0).toFixed(2)}
function dt(v){if(!v)return '—';try{return new Date(v).toLocaleString('he-IL')}catch{return String(v)}}
function gross(o){return Number((Number(o.total||0)+Number(o.shipping_cost||0)).toFixed(2))}
function refunded(o){return Number(o.refund_amount||0)}
function remaining(o){return Number(Math.max(0,gross(o)-refunded(o)).toFixed(2))}
function completed(o){return ['partial','refunded'].includes(String(o.refund_status||''))||Number(o.refund_amount||0)>0}
function refundHe(v){return ({none:'אין החזר',requested:'התבקש',approved:'אושר',rejected:'נדחה',processing:'בטיפול',partial:'הוחזר חלקית',refunded:'הוחזר במלואו'})[v]||v||'אין החזר'}
function refundState(v){if(v==='refunded'||v==='partial')return 'ok';if(v==='rejected')return 'bad';if(v&&v!=='none')return 'warn';return ''}
function providerHe(v){return v==='paypal'?'PayPal':(v||'—')}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok){const e=new Error(d.error||'request_failed');e.data=d;throw e}return d}
function visible(){const q=query.trim().toLocaleLowerCase('he');return orders.filter(o=>{if(!o.paid_at&&!['paid','refunded'].includes(o.payment_status))return false;if(!q)return true;const c=o.customer||{};return [o.order_id,c.fullName,c.phone,o.payment_reference,o.payment_provider,o.refund_status].filter(Boolean).join(' ').toLocaleLowerCase('he').includes(q)})}
function requestStorageKey(id,amount){return `alufRefundRequest:${id}:${Number(amount).toFixed(2)}`}
function newRequestId(){if(window.crypto?.randomUUID)return 'refund-'+crypto.randomUUID();return 'refund-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12)}
function refundRequestId(id,amount){const key=requestStorageKey(id,amount);let value=sessionStorage.getItem(key);if(!value){value=newRequestId();sessionStorage.setItem(key,value)}return value}
function clearRefundRequestId(id,amount){sessionStorage.removeItem(requestStorageKey(id,amount))}
function friendly(error){return ({invalid_refund_amount:'סכום ההחזר לא תקין.',refund_amount_exceeds_remaining:'סכום ההחזר גדול מהיתרה שנשארה להחזר.',order_already_fully_refunded:'ההזמנה כבר הוחזרה במלואה.',refund_requires_paid_order:'אפשר להחזיר רק הזמנה ששולמה.',order_not_paid_by_paypal:'ההזמנה לא שולמה דרך PayPal.',paypal_capture_reference_missing:'לא נמצא מזהה Capture של PayPal.',live_refund_requires_paypal_live:'PayPal LIVE עדיין לא מחובר, ולכן החזר של הזמנה חיה חסום.',sandbox_refund_requires_paypal_sandbox:'בדיקת Sandbox דורשת PayPal Sandbox.',refund_request_conflict:'אותו מזהה בקשה כבר שייך לפעולה אחרת.',invalid_refund_request_id:'מזהה פעולת ההחזר לא תקין.',paypal_refund_response_mismatch:'PayPal החזיר סכום/מטבע שלא תואם לבקשה.'})[error]||`ההחזר נכשל: ${error}`}
function paypalBox(o){const left=remaining(o);const disabled=left<=0||busy.has(o.order_id);return `<div class="providerBox"><b>החזר כספי אמיתי דרך PayPal</b><br>הכפתור מבצע Refund אצל PayPal ורק אחרי תשובת הספק מעדכן את ההזמנה והנהלת החשבונות. Retry של אותה פעולה משתמש באותו Request ID ולא מחזיר כסף פעמיים.</div><div class="refundForm"><div class="field"><label>סכום להחזר עכשיו</label><input data-k="paypal_amount" type="number" min="0.01" max="${left.toFixed(2)}" step="0.01" value="${left>0?left.toFixed(2):'0.00'}" ${disabled?'disabled':''}></div><div class="actions"><button class="btn light" type="button" onclick="fillRemaining('${esc(o.order_id)}')" ${disabled?'disabled':''}>מלא יתרה</button><button class="btn dark" type="button" onclick="paypalRefund('${esc(o.order_id)}')" ${disabled?'disabled':''}>${busy.has(o.order_id)?'מבצע החזר…':'בצע החזר ב‑PayPal'}</button></div></div><div class="muted" style="margin-top:9px"><b>חשוב:</b> החזר ללקוח לא מבטל אוטומטית הזמנה שכבר נשלחה/שולמה אצל הספק. אם קיימת הזמנת ספק, המערכת תתריע שצריך לבדוק ביטול בנפרד.</div>`}
function manualBox(o){return `<div class="manual"><div class="muted"><b>תשלום שאינו PayPal:</b> כאן אפשר לנהל רישום תפעולי בלבד. אין העברת כסף אוטומטית לספק סליקה אחר.</div><div class="refundForm"><div class="field"><label>סטטוס</label><select data-k="manual_status">${[['none','אין'],['requested','התבקש'],['approved','אושר'],['rejected','נדחה'],['processing','בטיפול'],['partial','בוצע חלקית ידנית'],['refunded','בוצע מלא ידנית']].map(([v,l])=>`<option value="${v}" ${o.refund_status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="actions"><button class="btn light" type="button" onclick="manualRefund('${esc(o.order_id)}')">שמור רישום ידני</button></div></div></div>`}
function card(o){const g=gross(o),amt=refunded(o),left=remaining(o),msg=messages.get(o.order_id);return `<section class="card" data-order="${esc(o.order_id)}"><div class="head"><div><h2>${esc(o.order_id)}</h2><div class="muted">${esc(o.customer?.fullName||'—')} · ${esc(o.customer?.phone||'—')} · שולם ${esc(dt(o.paid_at))}</div></div><span class="pill ${refundState(o.refund_status)}">${esc(refundHe(o.refund_status))}</span></div><div class="body"><div class="meta"><div class="box"><b>שולם</b>${money(g)}</div><div class="box"><b>הוחזר בפועל</b>${money(amt)}</div><div class="box"><b>נותר להחזר</b>${money(left)}</div><div class="box"><b>ספק סליקה</b>${esc(providerHe(o.payment_provider))}</div><div class="box"><b>סטטוס תשלום</b>${esc(o.payment_status||'—')}</div><div class="box"><b>עדכון החזר</b>${esc(dt(o.refunded_at))}</div></div>${o.payment_provider==='paypal'?paypalBox(o):manualBox(o)}${msg?`<div class="msg ${msg.level||'ok'}">${esc(msg.text)}</div>`:''}</div></section>`}
function render(){const list=visible();const completedCount=orders.filter(o=>completed(o)&&refunded(o)>0).length;const completedTotal=orders.reduce((s,o)=>s+refunded(o),0);const pending=orders.filter(o=>['requested','approved','processing'].includes(o.refund_status)).length;app.innerHTML=`<section class="panel"><h1>החזרים וזיכויים</h1><div class="notice good"><b>PayPal מחובר למנגנון החזר אמיתי.</b> בהזמנות PayPal הכפתור כאן פונה ל‑PayPal, ורק Refund שאומת אצל הספק נרשם כהוצאה ומפחית את ההכנסה בדוח.</div><div class="notice">המערכת חוסמת החזר מעבר לסכום ששולם ושומרת Request ID לכל פעולה כדי למנוע כפל החזר ב‑retry. ביטול/זיכוי אצל ספק המוצר הוא תהליך נפרד.</div><div class="summary"><div class="stat"><b>${orders.filter(o=>o.paid_at).length}</b><small>הזמנות ששולמו</small></div><div class="stat"><b>${completedCount}</b><small>הזמנות עם החזר</small></div><div class="stat"><b>${money(completedTotal)}</b><small>סה״כ הוחזר</small></div><div class="stat"><b>${pending}</b><small>ממתינים/בטיפול</small></div></div><input id="search" class="search" placeholder="חיפוש הזמנה, לקוח או טלפון" value="${esc(query)}"></section>${list.length?list.map(card).join(''):'<section class="panel empty">אין הזמנות מתאימות.</section>'}`;document.getElementById('search')?.addEventListener('input',e=>{query=e.target.value;render()})}
function fillRemaining(id){const card=document.querySelector(`[data-order="${CSS.escape(id)}"]`),o=orders.find(x=>x.order_id===id);if(!card||!o)return;card.querySelector('[data-k="paypal_amount"]').value=remaining(o).toFixed(2)}
async function paypalRefund(id){const card=document.querySelector(`[data-order="${CSS.escape(id)}"]`),o=orders.find(x=>x.order_id===id);if(!card||!o||busy.has(id))return;const amount=Number(card.querySelector('[data-k="paypal_amount"]').value||0);const left=remaining(o);if(!Number.isFinite(amount)||amount<=0||amount>left){messages.set(id,{level:'bad',text:'הסכום חייב להיות גדול מאפס ולא לעבור את היתרה להחזר.'});render();return}const sandbox=id.startsWith('AH-SBX-PAY-');const question=sandbox?`לבצע החזר Sandbox של ${money(amount)}? לא מדובר בכסף אמיתי.`:`לבצע עכשיו החזר אמיתי של ${money(amount)} ללקוח דרך PayPal?`;if(!window.confirm(question))return;const requestId=refundRequestId(id,amount);busy.add(id);messages.set(id,{level:'warn',text:'שולח בקשת החזר ל‑PayPal… אל תלחץ שוב.'});render();try{const d=await api('/api/admin?route=paypal-refund',{method:'POST',body:JSON.stringify({action:'refund',order_id:id,amount,request_id:requestId})});const i=orders.findIndex(x=>x.order_id===id);if(i>=0&&d.order)orders[i]=d.order;if(d.status==='COMPLETED'){clearRefundRequestId(id,amount);messages.set(id,{level:'ok',text:`PayPal אישר החזר ${money(amount)} ✓${d.deduplicated?' (Retry זוהה, לא בוצע החזר כפול)':''}${d.supplierCancellationRequired?' · קיימת הזמנת ספק — בדוק ביטול בנפרד.':''}`})}else{messages.set(id,{level:'warn',text:`ההחזר אצל PayPal במצב ${d.status}. שמרנו את אותו Request ID להמשך/Retry.`})}}catch(e){messages.set(id,{level:'bad',text:friendly(e.message)})}finally{busy.delete(id);await refreshOrders(false);render()}}
async function manualRefund(id){const card=document.querySelector(`[data-order="${CSS.escape(id)}"]`),o=orders.find(x=>x.order_id===id);if(!card||!o)return;const status=card.querySelector('[data-k="manual_status"]').value;let amount=refunded(o);if(status==='refunded')amount=gross(o);if(status==='none')amount=0;if(status==='partial'){const raw=window.prompt('סכום שהוחזר בפועל:');if(raw===null)return;amount=Number(raw)}if(['partial','refunded'].includes(status)&&!window.confirm('זהו רישום ידני בלבד. אשר רק אם הכסף כבר הוחזר בפועל מחוץ למערכת.'))return;try{const d=await api('/api/admin/orders',{method:'PATCH',body:JSON.stringify({order_id:id,refund_status:status,refund_amount:amount})});const i=orders.findIndex(x=>x.order_id===id);if(i>=0)orders[i]=d.order;messages.set(id,{level:'ok',text:'הרישום הידני נשמר.'})}catch(e){messages.set(id,{level:'bad',text:friendly(e.message)})}render()}
function showLogin(){app.innerHTML='<section class="panel login"><h2>צריך להתחבר לניהול</h2><div class="muted">העמוד מוגן באותה התחברות של ה‑Admin.</div><div style="margin-top:12px"><a class="btn" href="/admin" style="text-decoration:none;color:#171717">כניסה לניהול</a></div></section>'}
async function refreshOrders(doRender=true){try{const d=await api('/api/admin/orders?limit=200');orders=d.orders||[];if(doRender)render()}catch(e){if(e.message==='unauthorized')showLogin();else app.innerHTML=`<section class="panel"><h2>שגיאה</h2><div class="muted">${esc(e.message)}</div></section>`}}
refreshOrders();
</script>
</body>
</html>
