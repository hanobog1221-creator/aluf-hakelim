<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>בדיקת מלאי AliExpress | אלוף הכלים</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eef1f4;color:#171717}.top{background:#0b1118;color:#fff;padding:15px}.wrap{max-width:820px;margin:20px auto;padding:0 14px}.p{background:#fff;border:1px solid #dfe4e9;border-radius:14px;padding:16px;margin-bottom:12px}.btn{display:inline-block;border:0;border-radius:10px;background:#ffc928;color:#111;padding:11px 15px;font-weight:900;text-decoration:none;cursor:pointer}.dark{background:#111923;color:#fff}.notice{background:#fff8d8;border:1px solid #efd36d;border-radius:10px;padding:11px;margin:10px 0}.ok{background:#effaf3;border-color:#b8dec7}.bad{background:#fff4f4;border-color:#ffd0d2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f{display:flex;flex-direction:column;gap:5px}.f.full{grid-column:1/-1}input,select{padding:10px;border:1px solid #ccd4dc;border-radius:9px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.f.full{grid-column:auto}}</style></head>
<body><div class="top"><b>אלוף הכלים · בדיקת מלאי</b></div><main class="wrap">
<section class="p"><h2>בדיקת זמינות של הווריאנט הנבחר</h2><p>הכלי בודק רק את מה שהעמוד מציג כרגע: כפתור קנייה/עגלה פעיל, הודעת אזל מהמלאי והודעות "נותרו X".</p><a id="bookmark" class="btn" href="#">✅ בדוק מלאי באלי</a></section>
<section class="p"><div id="status" class="notice">ממתין לבדיקה.</div><div id="form" class="hidden"><div class="grid"><div class="f full"><label>מוצר באתר</label><select id="product"></select></div><div class="f"><label>Product ID</label><input id="pid" readonly></div><div class="f"><label>וריאנט</label><input id="variant" readonly></div><div class="f"><label>SKU שמור</label><input id="sku" readonly></div><div class="f"><label>מצב מלאי</label><input id="stock" readonly></div><div class="f"><label>כמות מפורשת</label><input id="qty" readonly></div><div class="f full"><label>ראיה</label><input id="evidence" readonly></div></div><p><button id="save" class="btn dark">שמור מצב מלאי</button></p><div id="msg" class="notice hidden"></div></div></section>
</main><script>
const $=s=>document.querySelector(s);let products=[],payload=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function makeBookmark(){const target=location.origin+'/supplier-stock-capture.html';const code=`(()=>{try{const T=e=>String(e?.innerText||e?.textContent||'').replace(/\\s+/g,' ').trim();const V=e=>{try{const r=e.getBoundingClientRect();const s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'}catch{return false}};const url=document.querySelector('link[rel=canonical]')?.href||location.href;const pid=(url.match(/(?:item\\/|product\\/)(\\d{8,20})\\.html/i)||location.href.match(/(?:item\\/|product\\/)(\\d{8,20})\\.html/i)||[])[1]||'';const selected=[...document.querySelectorAll('[aria-checked="true"],[aria-selected="true"],[class*="sku-item--selected"],[class*="sku-item"][class*="selected"]')].filter(e=>String(e.className||'').toLowerCase().includes('sku')||e.closest('[class*="sku"]'));const labels=[];for(const e of selected){let t=e.getAttribute('title')||e.getAttribute('aria-label')||e.querySelector('img')?.alt||T(e);t=String(t||'').trim();if(t&&t.length<100&&!labels.includes(t))labels.push(t)}const variant=labels.slice(0,5).join(' / ');const body=T(document.body);let qty=null,evidence='',inStock=null;let m=body.match(/(?:only|just)\\s+(\\d{1,7})\\s+(?:left|remaining)/i)||body.match(/(?:נותרו|נשארו)\\s*(\\d{1,7})/i)||body.match(/(\\d{1,7})\\s+(?:pieces?|items?)\\s+(?:available|left)/i);if(m){qty=Number(m[1]);inStock=qty>0;evidence='כמות מפורשת בעמוד: '+qty}const sold=/(sold out|out of stock|currently unavailable|אזל מהמלאי|לא במלאי|המוצר אינו זמין)/i.test(body);if(sold){inStock=false;evidence=evidence||'העמוד מציג הודעת אזל/לא זמין'}const buttons=[...document.querySelectorAll('button,a,[role="button"]')].filter(V);const buy=buttons.filter(e=>/(add to cart|buy now|add to bag|הוסף לעגלה|קנה עכשיו|רכישה עכשיו)/i.test(T(e)));const enabled=buy.filter(e=>!e.disabled&&e.getAttribute('aria-disabled')!=='true'&&!/disabled|sold-out|unavailable/i.test(String(e.className||'')));if(inStock===null&&enabled.length){inStock=true;evidence='כפתור קנייה/הוספה לעגלה פעיל עבור הווריאנט'}if(inStock===null&&buy.length&&!enabled.length){inStock=false;evidence='כפתור הקנייה קיים אך מושבת'}const data={productId:pid,pageUrl:url,variant,inStock,qty,evidence,capturedAt:new Date().toISOString()};window.open(${JSON.stringify(target)}+'#data='+encodeURIComponent(JSON.stringify(data)),'_blank')}catch(e){alert('Stock check failed: '+e.message)}})()`;return 'javascript:'+code.replace(/\n/g,'')}
$('#bookmark').href=makeBookmark();
async function load(){const r=await fetch('/api/admin/products',{cache:'no-store'});if(r.status===401){$('#status').className='notice bad';$('#status').innerHTML='צריך להתחבר לאדמין קודם: <a href="/admin">כניסה</a>';throw new Error('unauthorized')}const d=await r.json();if(!r.ok||!d.ok)throw new Error('load_failed');products=d.products||[]}
function decode(){const raw=location.hash.startsWith('#data=')?location.hash.slice(6):'';try{return raw?JSON.parse(decodeURIComponent(raw)):null}catch{return null}}
function fill(){payload=decode();if(!payload)return;const match=products.find(p=>String(p.supplier_product_id||'')===String(payload.productId||''));$('#product').innerHTML=products.map(p=>`<option value="${esc(p.id)}" ${match&&p.id===match.id?'selected':''}>${esc(p.name)}</option>`).join('');$('#pid').value=payload.productId||'';$('#variant').value=payload.variant||'';$('#sku').value=match?.supplier_sku_id||'';$('#stock').value=payload.inStock===true?'במלאי':payload.inStock===false?'אזל מהמלאי':'לא ידוע';$('#qty').value=payload.qty??'';$('#evidence').value=payload.evidence||'';$('#form').classList.remove('hidden');if(!match){$('#status').className='notice bad';$('#status').textContent='לא נמצא מוצר תואם באתר.'}else if(!match.supplier_sku_id){$('#status').className='notice bad';$('#status').textContent='למוצר עדיין אין SKU שמור.'}else if(payload.inStock===null){$('#status').className='notice bad';$('#status').textContent='לא הצלחתי לקבוע זמינות בביטחון.'}else{$('#status').className='notice ok';$('#status').textContent='זמינות זוהתה. אפשר לשמור.'}}
$('#save').onclick=async()=>{const p=products.find(x=>x.id===$('#product').value);if(!p||!p.supplier_sku_id||payload?.inStock===null){$('#msg').className='notice bad';$('#msg').textContent='אין מספיק נתונים בטוחים לשמירה.';$('#msg').classList.remove('hidden');return}$('#save').disabled=true;try{const r=await fetch('/api/admin/supplier-capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:p.id,supplier_product_id:p.supplier_product_id,supplier_sku_id:p.supplier_sku_id,supplier_stock:payload.qty,supplier_in_stock:payload.inStock,captured_at:payload.capturedAt})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'save_failed');$('#msg').className='notice ok';$('#msg').textContent='נשמר ✓ מצב המלאי עודכן.'}catch(e){$('#msg').className='notice bad';$('#msg').textContent='שמירה נכשלה: '+e.message}finally{$('#msg').classList.remove('hidden');$('#save').disabled=false}}
(async()=>{try{await load();fill()}catch(e){if(e.message!=='unauthorized'){$('#status').className='notice bad';$('#status').textContent='טעינת האדמין נכשלה.'}}})();
</script></body></html>
