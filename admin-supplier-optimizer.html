<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>מנוע המחיר החכם | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#171717;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:var(--dark);color:#fff}.topin{max-width:1120px;margin:auto;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}a{color:inherit}.top a{border:1px solid #38485a;border-radius:9px;padding:8px 10px;text-decoration:none}.wrap{max-width:1120px;margin:20px auto;padding:0 14px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:12px}.panel{padding:16px}.toolbar,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:24px;margin:0 0 5px}.muted{font-size:12px;color:var(--muted);line-height:1.55}.status{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:900;background:#ffe8e9;color:var(--bad)}.status.on{background:#e5f7ed;color:var(--ok)}.settings{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:15px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;font-weight:850;color:#66717c}.field input{border:1px solid #cfd6dd;border-radius:9px;padding:9px;width:100%}.switch{justify-content:flex-end}.switch input{width:22px;height:22px}.btn{border:0;border-radius:10px;background:var(--yellow);padding:10px 13px;font-weight:950;cursor:pointer}.btn.dark{background:#111923;color:#fff}.btn.light{background:#fff;border:1px solid #d7dde3}.btn:disabled{opacity:.55}.note{margin-top:12px;border:1px solid #efd36d;background:#fff8d8;border-radius:10px;padding:10px;font-size:12px;line-height:1.6}.card{padding:14px}.cardhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.card h2{font-size:17px;margin:0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:11px}.box{background:#f7f9fb;border-radius:10px;padding:10px}.box b{display:block;font-size:11px;color:#66717c;margin-bottom:4px}.box span{font-size:13px;font-weight:850}.offers{margin-top:10px;font-size:12px;line-height:1.7}.offer{border-top:1px solid #edf0f2;padding:7px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}.message{font-size:13px;font-weight:850;margin-top:10px}.login{text-align:center;padding:45px 20px}@media(max-width:800px){.settings,.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.settings,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · מנוע מחיר</div><div><a href="/suppliers">ספקים</a> <a href="/admin">ניהול</a></div></div></div>
<main class="wrap" id="app"><section class="panel">טוען...</section></main>
<script>
const app=document.getElementById('app');let preview=null,settings={};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return v==null?'—':'₪'+Number(v).toFixed(2)}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');return d}
function blockerName(value){return ({quote_stale:'הצעה ישנה',product_price_unknown:'מחיר חסר',shipping_price_unknown:'מחיר משלוח חסר',shipping_unknown:'משלוח לא ידוע',shipping_unavailable:'אין משלוח לישראל',stock_unknown:'מלאי לא ידוע',out_of_stock:'אזל במלאי',product_equivalence_not_verified:'מוצר/וריאנט לא אומת',automatic_fulfillment_not_supported:'אין הזמנה אוטומטית',provider_disabled:'ספק לא פעיל',supplier_product_id_missing:'חסר מזהה מוצר',supplier_sku_id_missing:'חסר מזהה וריאנט',supplier_sku_attr_missing:'חסר מאפיין וריאנט מדויק'}[value]||value)}
function productCard(p){const eligible=p.offers.filter(o=>o.eligible).length;return `<section class="card"><div class="cardhead"><div><h2>${esc(p.name)}</h2><div class="muted">${esc(p.productId)}</div></div><b class="${p.selectedProvider?'ok':'bad'}">${p.selectedProvider?'נבחר '+esc(p.selectedProvider):'אין כרגע הצעה בטוחה'}</b></div><div class="grid"><div class="box"><b>ספק נוכחי</b><span>${esc(p.currentProvider||'—')}</span></div><div class="box"><b>עלות נוכחית + משלוח</b><span>${money(p.currentLandedCost)}</span></div><div class="box"><b>העלות הזולה שנבחרה</b><span>${money(p.selectedLandedCost)}</span></div><div class="box"><b>מחיר מכירה אוטומטי</b><span>${money(p.pricing?.sellingPrice)}</span></div><div class="box"><b>רווח נטו צפוי</b><span>${money(p.pricing?.projectedNetProfit)}</span></div></div><div class="offers"><b>${eligible} הצעות כשירות מתוך ${p.offers.length}</b>${p.offers.map(o=>`<div class="offer"><span class="${o.eligible?'ok':'bad'}">${esc(o.provider||'—')} · ${money(o.landedCost)}</span>${o.blockers?.length?' · חסום: '+o.blockers.map(blockerName).map(esc).join(', '):' · כשיר לבחירה'}</div>`).join('')}</div></section>`}
function render(message=''){const enabled=settings.supplier_optimizer_enabled===true;const products=preview?.products||[];app.innerHTML=`<section class="panel"><div class="toolbar"><div><h1>מנוע הספק והמחיר החכם</h1><div class="muted">בוחר רק הצעה מאומתת וטרייה עם משלוח לישראל והזמנה אוטומטית, ומגן על רווח מינימלי של 25 ₪.</div></div><span class="status ${enabled?'on':''}">${enabled?'האוטומציה פעילה':'האוטומציה כבויה'}</span></div><div class="settings"><div class="field switch"><label>הפעל החלפה אוטומטית</label><input id="enabled" type="checkbox" ${enabled?'checked':''}></div><div class="field"><label>רווח מינימלי (₪)</label><input id="profit" type="number" min="25" step="0.01" value="${esc(Math.max(25,Number(settings.minimum_profit_ils||25)))}"></div><div class="field"><label>עמלת סליקה משוערת (%)</label><input id="feePercent" type="number" min="0" max="99" step="0.01" value="${esc(settings.pricing_fee_percent||0)}"></div><div class="field"><label>עמלה קבועה להזמנה (₪)</label><input id="feeFixed" type="number" min="0" step="0.01" value="${esc(settings.pricing_fee_fixed_ils||0)}"></div><div class="field"><label>רזרבת ביטחון (₪)</label><input id="reserve" type="number" min="0" step="0.01" value="${esc(settings.pricing_reserve_ils||0)}"></div></div><div class="actions" style="margin-top:12px"><div><button class="btn" onclick="saveSettings(this)">שמור הגדרות</button> <button class="btn light" onclick="reload(this)">בדיקה מחדש</button></div><button class="btn dark" onclick="applyNow(this)" ${enabled?'':'disabled'}>הפעל בחירה עכשיו</button></div><div class="note">המשלוח משמש להשוואה בין הספקים, אבל אינו מתווסף פעמיים למחיר המוצר — באתר הוא נגבה מהלקוח בנפרד. הצעה חסרה או ישנה נחסמת אוטומטית.</div>${message?`<div class="message">${esc(message)}</div>`:''}</section>${products.length?products.map(productCard).join(''):'<section class="panel">אין מוצרים פעילים להצגה.</section>'}`}
async function load(){const [p,s]=await Promise.all([api('/api/admin/supplier-optimizer'),api('/api/admin/products')]);preview=p;settings=s.settings||{};render()}
function num(id,fallback=0){const n=Number(document.getElementById(id)?.value);if(!Number.isFinite(n)||n<0)throw new Error('invalid');return n||fallback}
async function saveSettings(button){button.disabled=true;try{const d=await api('/api/admin/products',{method:'POST',body:JSON.stringify({action:'settings',supplier_optimizer_enabled:document.getElementById('enabled').checked,minimum_profit_ils:Math.max(25,num('profit',25)),pricing_fee_percent:num('feePercent'),pricing_fee_fixed_ils:num('feeFixed'),pricing_reserve_ils:num('reserve')})});settings=d.settings||settings;await reload();render('ההגדרות נשמרו.')}catch(e){if(e.message==='unauthorized')return login();render('לא הצלחנו לשמור את ההגדרות.')}finally{button.disabled=false}}
async function reload(button){if(button)button.disabled=true;try{preview=await api('/api/admin/supplier-optimizer');render('הבדיקה עודכנה.')}catch(e){if(e.message==='unauthorized')return login();render('לא הצלחנו לעדכן את הבדיקה.')}finally{if(button)button.disabled=false}}
async function applyNow(button){if(!confirm('להחיל עכשיו את הספקים והמחירים הבטוחים שנבחרו?'))return;button.disabled=true;try{const d=await api('/api/admin/supplier-optimizer',{method:'POST',body:JSON.stringify({action:'apply'})});await load();render(`עודכנו ${d.results?.length||0} מוצרים; ${d.skipped?.length||0} נשארו חסומים.`)}catch(e){if(e.message==='unauthorized')return login();render('ההפעלה נעצרה בבטחה: '+e.message)}finally{button.disabled=false}}
function login(){app.innerHTML='<section class="panel login"><h2>צריך להתחבר לניהול</h2><a class="btn" href="/admin">כניסה לניהול</a></section>'}
load().catch(e=>e.message==='unauthorized'?login():app.innerHTML='<section class="panel">לא הצלחנו לטעון את מנוע המחיר.</section>');
</script>
</body>
</html>
