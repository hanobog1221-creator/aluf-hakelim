<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ספקים ואוטומציה | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--warn:#8b6500;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f4;color:#171717}button,input{font:inherit}.top{background:var(--dark);color:#fff;border-bottom:1px solid #263342;position:sticky;top:0;z-index:10}.topin{max-width:1120px;margin:auto;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--yellow)}.links{display:flex;gap:7px;flex-wrap:wrap}.top a{color:#fff;text-decoration:none;border:1px solid #38485a;border-radius:9px;padding:8px 10px;font-weight:850}.wrap{max-width:1120px;margin:20px auto;padding:0 14px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:12px}.panel{padding:16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toolbar h1{margin:0;font-size:24px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.stat{background:#f7f9fb;border-radius:11px;padding:12px}.stat b{display:block;font-size:23px}.stat small{color:var(--muted)}.btn{border:0;border-radius:10px;background:var(--yellow);padding:10px 13px;font-weight:950;cursor:pointer}.btn.dark{background:#111923;color:#fff}.btn.light{background:#fff;border:1px solid #d7dde3}.btn:disabled{opacity:.55;cursor:not-allowed}.notice{background:#fff8d8;border:1px solid #efd36d;border-radius:11px;padding:11px 13px;margin-top:12px;font-size:13px;line-height:1.55}.card{overflow:hidden}.head{padding:14px 15px;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.head h2{font-size:17px;margin:0 0 4px}.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;background:#eef1f4}.pill.ok{background:#e5f7ed;color:var(--ok)}.pill.warn{background:#fff4cf;color:var(--warn)}.pill.bad{background:#ffe8e9;color:var(--bad)}.body{padding:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{background:#f7f9fb;border-radius:10px;padding:10px;min-width:0}.box b{display:block;font-size:11px;color:#66717c;margin-bottom:4px}.box span{font-size:13px;font-weight:850;word-break:break-word}.blockers{margin-top:10px;background:#effaf3;border:1px solid #b8dec7;border-radius:10px;padding:10px;font-size:12px;line-height:1.65;color:#155d35}.blockers.bad{background:#fff4f4;border-color:#ffd0d2;color:#8c1822}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.actions a{color:#171717;text-decoration:none}.syncmsg{font-size:12px;font-weight:850;margin-top:9px}.syncmsg.ok{color:var(--ok)}.syncmsg.bad{color:var(--bad)}.safety{margin-top:12px;border:1px solid #e2e7eb;border-radius:11px;padding:11px;background:#fafbfc}.safety h3{margin:0 0 8px;font-size:14px}.safetyGrid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;font-weight:850;color:#66717c}.field input{width:100%;border:1px solid #cfd6dd;border-radius:9px;padding:9px;background:#fff}.skuBox{margin-top:11px;border-top:1px solid #edf0f2;padding-top:11px}.skuBox h3{font-size:14px;margin:0 0 8px}.skuRow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid #e3e7eb;border-radius:9px;padding:8px;margin:7px 0;font-size:12px}.skuRow.match{border-color:#84c99f;background:#effaf3}.login{text-align:center;padding:45px 20px}.empty{text-align:center;color:#7c8792;padding:30px}@media(max-width:850px){.grid,.summary{grid-template-columns:1fr 1fr}.safetyGrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.summary,.safetyGrid{grid-template-columns:1fr}.topin{align-items:flex-start}.skuRow{grid-template-columns:1fr}.toolbar h1{font-size:20px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · ספקים</div><div class="links"><a href="/admin">ניהול</a><a href="/launch-checklist">מוכנות להשקה</a></div></div></div>
<main class="wrap" id="app"><div class="panel"><div class="muted">טוען...</div></div></main>
<script>
const app=document.getElementById('app');
const MAX_AGE_MS=8*60*60*1000;
let products=[];
let settings={};
const snapshots=new Map();
const messages=new Map();
let syncingAll=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return v==null||v===''?'—':'₪'+Number(v||0).toFixed(2)}
function dt(v){if(!v)return '—';try{return new Date(v).toLocaleString('he-IL')}catch{return String(v)}}
function fresh(v){const n=v?Date.parse(v):NaN;return Number.isFinite(n)&&Date.now()-n<=MAX_AGE_MS}
function norm(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ')}
async function adminApi(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');return d}
function productMargin(p){const sale=Number(p.selling_price);const cost=p.supplier_price_ils==null?null:Number(p.supplier_price_ils);if(!Number.isFinite(sale)||!Number.isFinite(cost))return null;return Number((sale-cost).toFixed(2))}
function supplierCashCost(p){const cost=p.supplier_price_ils==null?null:Number(p.supplier_price_ils);const ship=p.supplier_shipping==null?null:Number(p.supplier_shipping);if(!Number.isFinite(cost)||!Number.isFinite(ship))return null;return Number((cost+ship).toFixed(2))}
function effectiveMinProfit(p){const local=p.minimum_profit==null?null:Number(p.minimum_profit);if(Number.isFinite(local))return {value:local,source:'מוצר'};const global=settings?.minimum_profit_ils==null?null:Number(settings.minimum_profit_ils);return Number.isFinite(global)?{value:global,source:'כללי'}:{value:null,source:null}}
function readiness(p){const blockers=[];if(!p.active)blockers.push('המוצר כבוי');if(!p.supplier_product_id)blockers.push('חסר Product ID');if(!p.supplier_sku_id)blockers.push('חסר SKU מדויק');if(!p.sku_verified_at)blockers.push('ה-SKU עדיין לא אומת מול הספק');if(p.supplier_in_stock!==true)blockers.push(p.supplier_in_stock===false?'אזל במלאי אצל הספק':'המלאי אצל הספק עדיין לא ידוע');if(p.supplier_shipping_available!==true)blockers.push(p.supplier_shipping_available===false?'אין משלוח לישראל':'זמינות המשלוח עדיין לא ידועה');if(!fresh(p.last_sync_at))blockers.push('בדיקת המוצר חסרה או ישנה מ-8 שעות');if(!fresh(p.shipping_last_checked_at))blockers.push('בדיקת המשלוח חסרה או ישנה מ-8 שעות');if(p.supplier_price_ils==null)blockers.push('מחיר הספק בש״ח עדיין לא ידוע');if(p.supplier_sync_error)blockers.push('שגיאת סנכרון מוצר');if(p.shipping_sync_error)blockers.push('שגיאת בדיקת משלוח');const m=productMargin(p);const min=effectiveMinProfit(p);if(min.value!=null&&m!=null&&m<min.value)blockers.push(`הרווח ${money(m)} נמוך ממינימום ${money(min.value)}`);const cap=p.auto_fulfill_max_cost==null?null:Number(p.auto_fulfill_max_cost);const cash=supplierCashCost(p);if(Number.isFinite(cap)&&cash!=null&&cash>cap)blockers.push(`עלות הספק הכוללת ${money(cash)} מעל תקרת האוטומציה ${money(cap)}`);return blockers}
function pill(label,state){return `<span class="pill ${state}">${esc(label)}</span>`}
function skuRows(p){const snapshot=snapshots.get(String(p.id));const skus=Array.isArray(snapshot?.skus)?snapshot.skus:[];if(!skus.length)return '';const wanted=norm(p.variant_label);return `<div class="skuBox"><h3>אפשרויות SKU שהתקבלו מ-AliExpress</h3>${skus.map(s=>{const match=Boolean(wanted)&&norm(s.label)===wanted;return `<div class="skuRow ${match?'match':''}"><div><b>${esc(s.label||'ללא שם וריאנט')}</b><div class="muted">SKU: ${esc(s.id||'—')} · ${s.inStock===false?'לא במלאי':'מלאי: '+esc(s.stock??'לא ידוע')} · מחיר: ${esc(s.price??'—')} ${esc(s.currency||'')}</div>${match?'<div style="color:#197342;font-weight:900;margin-top:3px">זה הווריאנט שנבחר כרגע</div>':''}</div><button class="btn light" onclick="copySku('${esc(String(s.id||''))}',this)">העתק SKU</button><button class="btn ${match?'':'light'}" onclick='saveSku(${JSON.stringify(String(p.id))},${JSON.stringify(String(s.id||''))},${JSON.stringify(String(s.label||''))})'>בחר ואמת</button></div>`}).join('')}</div>`}
function safetyBox(p){const min=effectiveMinProfit(p);return `<div class="safety"><h3>הגנות להזמנה אוטומטית</h3><div class="safetyGrid"><div class="field"><label>מינימום רווח למוצר (₪) ${min.source?`· אפקטיבי: ${money(min.value)} (${min.source})`:''}</label><input id="min-${esc(p.id)}" inputmode="decimal" placeholder="ריק = ברירת מחדל כללית" value="${p.minimum_profit==null?'':esc(p.minimum_profit)}"></div><div class="field"><label>מקסימום עלות ספק כולל משלוח (₪)</label><input id="cap-${esc(p.id)}" inputmode="decimal" placeholder="ריק = ללא תקרה" value="${p.auto_fulfill_max_cost==null?'':esc(p.auto_fulfill_max_cost)}"></div><button class="btn light" onclick="saveLimits('${esc(p.id)}',this)">שמור הגנות</button></div><div class="muted" style="margin-top:7px">הרווח מחושב מחיר מכירה פחות מחיר המוצר אצל הספק. המשלוח נגבה מהלקוח בנפרד; תקרת העלות כן כוללת גם את משלוח הספק כדי להגביל חשיפה כספית.</div></div>`}
function card(p){const blockers=readiness(p);const margin=productMargin(p);const cash=supplierCashCost(p);const msg=messages.get(String(p.id));const stock=p.supplier_in_stock===true?'במלאי':p.supplier_in_stock===false?'אזל':'לא ידוע';const shipping=p.supplier_shipping_available===true?(Number(p.supplier_shipping||0)<=0?'חינם':money(p.supplier_shipping)):p.supplier_shipping_available===false?'לא זמין':'לא ידוע';const ready=p.fulfillment_ready===true&&blockers.length===0;return `<section class="card"><div class="head"><div><h2>${esc(p.name)}</h2><div class="muted">${esc(p.id)} · Product ID: ${esc(p.supplier_product_id||'חסר')}</div></div><div class="pills">${pill(p.active?'פעיל':'כבוי',p.active?'ok':'bad')}${pill(p.supplier_sku_id?'SKU קיים':'חסר SKU',p.supplier_sku_id?'ok':'warn')}${pill(p.sku_verified_at?'SKU מאומת':'לא מאומת',p.sku_verified_at?'ok':'warn')}${pill(ready?'מוכן לאוטומציה':'חסום לאוטומציה',ready?'ok':'warn')}</div></div><div class="body"><div class="grid"><div class="box"><b>מחיר מכירה</b><span>${money(p.selling_price)}</span></div><div class="box"><b>עלות מוצר אצל הספק</b><span>${money(p.supplier_price_ils)}</span></div><div class="box"><b>משלוח ספק</b><span>${shipping}</span></div><div class="box"><b>רווח מוצר לפני עמלות</b><span>${margin==null?'—':money(margin)}</span></div><div class="box"><b>חשיפה כוללת לספק</b><span>${cash==null?'—':money(cash)}</span></div><div class="box"><b>מלאי</b><span>${esc(stock)}${p.supplier_stock!=null?' · '+esc(p.supplier_stock):''}</span></div><div class="box"><b>SKU נבחר</b><span>${esc(p.supplier_sku_id||'—')}</span></div><div class="box"><b>וריאנט</b><span>${esc(p.variant_label||'—')}</span></div><div class="box"><b>סנכרון מוצר</b><span>${esc(dt(p.last_sync_at))}</span></div><div class="box"><b>בדיקת משלוח</b><span>${esc(dt(p.shipping_last_checked_at))}</span></div><div class="box"><b>אימות SKU</b><span>${esc(dt(p.sku_verified_at))}</span></div><div class="box"><b>סטטוס DB</b><span>${p.fulfillment_ready?'מוכן':'לא מוכן'}</span></div></div><div class="blockers ${blockers.length?'bad':''}">${blockers.length?'<b>חסימות:</b> '+blockers.map(esc).join(' · '):'<b>כל בדיקות הספק תקינות כרגע.</b>'}${p.supplier_sync_error?`<br>מוצר: ${esc(p.supplier_sync_error)}`:''}${p.shipping_sync_error?`<br>משלוח: ${esc(p.shipping_sync_error)}`:''}</div>${safetyBox(p)}<div class="actions"><button class="btn" ${p.supplier_product_id?'':'disabled'} onclick="syncOne('${esc(p.id)}',this)">בדוק עכשיו מול AliExpress</button>${p.supplier_url?`<a class="btn light" href="${esc(p.supplier_url)}" target="_blank" rel="noopener noreferrer">פתח מוצר אצל הספק</a>`:''}</div>${msg?`<div class="syncmsg ${msg.ok?'ok':'bad'}">${esc(msg.text)}</div>`:''}${skuRows(p)}</div></section>`}
function render(){const missingSku=products.filter(p=>!p.supplier_sku_id).length;const verified=products.filter(p=>p.sku_verified_at).length;const stale=products.filter(p=>!fresh(p.last_sync_at)||!fresh(p.shipping_last_checked_at)).length;const errors=products.filter(p=>p.supplier_sync_error||p.shipping_sync_error).length;const ready=products.filter(p=>p.fulfillment_ready&&readiness(p).length===0).length;app.innerHTML=`<section class="panel"><div class="toolbar"><div><h1>בדיקת ספקים ואוטומציה</h1><div class="muted">הזמנה אוטומטית נפתחת רק אחרי SKU מאומת, מלאי ומשלוח חיוביים ובדיקות טריות עד 8 שעות.</div></div><button id="syncAll" class="btn dark" ${syncingAll?'disabled':''}>${syncingAll?'בודק...':'בדוק את כל המוצרים'}</button></div><div class="summary"><div class="stat"><b>${products.length}</b><small>מוצרים</small></div><div class="stat"><b>${missingSku}</b><small>חסרי SKU</small></div><div class="stat"><b>${verified}</b><small>SKU מאומתים</small></div><div class="stat"><b>${stale}</b><small>בדיקות חסרות/ישנות</small></div><div class="stat"><b>${ready}</b><small>מוכנים לאוטומציה</small></div></div>${errors?`<div class="notice">יש ${errors} מוצרים עם שגיאת סנכרון/משלוח. הם נשארים חסומים להזמנה אוטומטית.</div>`:`<div class="notice">ברירת המחדל בטוחה: מידע לא ידוע או ישן חוסם אוטומציה. מינימום רווח כללי: ${settings?.minimum_profit_ils==null?'לא הוגדר':money(settings.minimum_profit_ils)}.</div>`}</section>${products.length?products.map(card).join(''):'<div class="panel empty">אין מוצרים.</div>'}`;document.getElementById('syncAll')?.addEventListener('click',syncAll)}
async function loadProducts(){const d=await adminApi('/api/admin/products');products=d.products||[];settings=d.settings||{};render()}
async function rawSync(id){const r=await fetch('/api/aliexpress/product-v2?storeProductId='+encodeURIComponent(id),{headers:{accept:'application/json'}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');return d}
async function syncOne(id){messages.set(String(id),{ok:true,text:'בודק מול AliExpress...'});render();try{const d=await rawSync(id);if(d.ok){if(d.snapshot)snapshots.set(String(id),d.snapshot);const verified=d.saved?.skuVerified===true;messages.set(String(id),{ok:true,text:verified?'הבדיקה הסתיימה וה-SKU אומת מול הספק.':'הבדיקה הסתיימה. בחר SKU מדויק כדי להשלים אימות.'});await loadProducts();return d}if(d.waitingForAliExpressPermission){messages.set(String(id),{ok:false,text:'AliExpress עדיין לא פתחו את הרשאת ה-Dropshipping API. המוצר נשאר חסום להזמנה אוטומטית.'});render();return d}messages.set(String(id),{ok:false,text:'בדיקת הספק נכשלה: '+String(d.error||'שגיאה לא ידועה')});render();return d}catch(e){if(e.message==='unauthorized'){showLogin();return null}messages.set(String(id),{ok:false,text:'לא הצלחנו לבדוק את הספק כרגע.'});render();return null}}
async function syncAll(){if(syncingAll)return;syncingAll=true;render();for(const p of [...products].filter(x=>x.active&&x.supplier_product_id)){const d=await syncOne(String(p.id));if(d?.waitingForAliExpressPermission)break}syncingAll=false;await loadProducts().catch(()=>render())}
async function saveSku(id,skuId,label){if(!skuId)return;try{messages.set(String(id),{ok:true,text:'שומר SKU ומבצע אימות חוזר...'});render();await adminApi('/api/admin/products',{method:'PATCH',body:JSON.stringify({id,supplier_sku_id:skuId,variant_label:label||null})});await loadProducts();await syncOne(id)}catch(e){if(e.message==='unauthorized'){showLogin();return}messages.set(String(id),{ok:false,text:'לא הצלחנו לשמור או לאמת את ה-SKU.'});render()}}
function parseLimit(value){const text=String(value??'').trim();if(!text)return null;const n=Number(text.replace(',','.'));if(!Number.isFinite(n)||n<0||n>1000000)throw new Error('invalid');return Number(n.toFixed(2))}
async function saveLimits(id){try{const minimum_profit=parseLimit(document.getElementById('min-'+id)?.value);const auto_fulfill_max_cost=parseLimit(document.getElementById('cap-'+id)?.value);await adminApi('/api/admin/products',{method:'PATCH',body:JSON.stringify({id,minimum_profit,auto_fulfill_max_cost})});messages.set(String(id),{ok:true,text:'הגנות האוטומציה נשמרו.'});await loadProducts()}catch(e){if(e.message==='unauthorized'){showLogin();return}messages.set(String(id),{ok:false,text:'לא הצלחנו לשמור את ההגנות. יש להזין סכום תקין או להשאיר ריק.'});render()}}
async function copySku(value,button){try{await navigator.clipboard.writeText(value);const old=button.textContent;button.textContent='הועתק ✓';setTimeout(()=>button.textContent=old,1200)}catch{}}
function showLogin(){app.innerHTML='<section class="panel login"><h2>צריך להתחבר לניהול</h2><div class="muted">העמוד מוגן באותה התחברות של ה-Admin.</div><div style="margin-top:12px"><a class="btn" href="/admin" style="text-decoration:none;color:#171717">כניסה לניהול</a></div></section>'}
loadProducts().catch(e=>e.message==='unauthorized'?showLogin():app.innerHTML='<section class="panel"><b>לא הצלחנו לטעון את מצב הספקים.</b></section>');
</script>
</body>
</html>
