<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הגדרות והתראות | אלוף הכלים</title>
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--warn:#8b6500;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f4;color:#171717}button,input,textarea,select{font:inherit}.top{background:var(--dark);color:#fff;border-bottom:1px solid #263342}.topin{max-width:960px;margin:auto;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:22px;font-weight:950}.brand span{color:var(--yellow)}.top a{color:#fff;text-decoration:none;font-weight:850}.wrap{max-width:960px;margin:24px auto;padding:0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.panel.full{grid-column:1/-1}.panel h2{margin:0 0 6px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:900}.field input,.field textarea,.field select{width:100%;border:1px solid #cfd5dc;border-radius:10px;padding:11px;background:#fff}.field textarea{min-height:85px;resize:vertical}.toggle{display:flex;align-items:center;gap:8px;font-weight:900;margin-top:12px}.btn{border:0;border-radius:10px;background:var(--yellow);padding:11px 15px;font-weight:950;cursor:pointer}.btn.dark{background:#111923;color:#fff}.btn.small{padding:8px 10px;font-size:12px}.msg{margin-right:8px;font-size:13px;font-weight:850;color:var(--ok)}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;background:#eef1f4}.pill.bad{background:#ffe7e8;color:var(--bad)}.pill.warn{background:#fff4cf;color:var(--warn)}.pill.ok{background:#e6f7ed;color:var(--ok)}.alerts{display:flex;flex-direction:column;gap:8px}.alert{border:1px solid var(--line);border-radius:11px;padding:11px 12px}.alert.bad{border-color:#ffc5c9;background:#fff1f2}.alert.warn{border-color:#efdaa1;background:#fff9e8}.alert b{display:block;margin-bottom:3px}.empty{padding:28px;text-align:center;color:var(--ok);font-weight:900}.loginNeeded{text-align:center;padding:55px 20px}.loginNeeded a{display:inline-block;margin-top:12px;background:var(--yellow);padding:12px 18px;border-radius:10px;text-decoration:none;color:#171717;font-weight:950}.sectionTitle{margin-top:20px;padding-top:16px;border-top:1px solid #edf0f2;font-weight:950}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:-6px}.couponGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.couponForm{background:#f8fafb;border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:14px}.couponList{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.couponCard{border:1px solid var(--line);border-radius:12px;padding:12px}.couponHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.couponCode{font-weight:950;direction:ltr;font-size:18px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:760px){.grid{grid-template-columns:1fr}.panel.full{grid-column:auto}.couponGrid,.couponList{grid-template-columns:1fr}.topin{padding:14px}.brand{font-size:19px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span> · כלים והתראות</div><a href="/admin">חזרה לניהול</a></div></div>
<div class="wrap" id="app"><div class="panel"><div class="muted">טוען...</div></div></div>
<script>
const app=document.getElementById('app');let state={products:[],orders:[],settings:{},coupons:[]};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok||!d.ok)throw new Error(d.error||'request_failed');return d}
function buildAlerts(){const out=[];const s=state.settings||{};if(!s.whatsapp_enabled||!s.whatsapp_number)out.push({level:'warn',title:'WhatsApp Business עדיין לא מופעל באתר',text:'אחרי שתזין כאן את המספר ותפעיל אותו, כפתור WhatsApp יופיע באתר אוטומטית.'});if(s.minimum_profit_ils==null)out.push({level:'warn',title:'עדיין לא הוגדר רווח מינימלי להזמנה אוטומטית',text:'אפשר להגדיר סכום מינימום, והמערכת תחסום בעתיד הזמנת ספק אם העלות תשאיר רווח נמוך ממנו.'});for(const p of state.products){if(p.supplier_sync_error)out.push({level:'bad',title:`${p.name}: שגיאת סנכרון`,text:p.supplier_sync_error});if(p.supplier_in_stock===false)out.push({level:'bad',title:`${p.name}: אזל אצל הספק`,text:'המוצר לא אמור להימכר עד שהמלאי חוזר.'});if(p.supplier_shipping_available===false)out.push({level:'bad',title:`${p.name}: אין משלוח לישראל`,text:'המוצר חסום להזמנה כל עוד אין אפשרות משלוח.'});if(p.active&&!p.supplier_product_id)out.push({level:'bad',title:`${p.name}: חסר Product ID`,text:'אי אפשר לחבר אוטומציה לספק בלי Product ID.'});if(p.active&&!p.supplier_sku_id)out.push({level:'warn',title:`${p.name}: חסר SKU מדויק`,text:'נשלים את ה-SKU אחרי ש-AliExpress יפתחו את הרשאת ה-API.'});if(p.active&&!p.fulfillment_ready)out.push({level:'warn',title:`${p.name}: עדיין לא מאומת להזמנה אוטומטית`,text:'לא תישלח הזמנה אוטומטית עד שה-SKU והבדיקות יאושרו.'})}for(const o of state.orders){if(o.last_error)out.push({level:'bad',title:`הזמנה ${o.order_id}: שגיאה`,text:o.last_error});const age=Date.now()-Date.parse(o.updated_at||o.created_at||0);if(o.payment_status==='paid'&&age>30*60*1000&&!['ordered','shipped','delivered'].includes(o.fulfillment_status))out.push({level:'bad',title:`הזמנה ${o.order_id}: שולמה ועדיין לא הוזמנה`,text:'ההזמנה דורשת בדיקה לפני שתתעכב.'});if(o.fulfillment_status==='failed')out.push({level:'bad',title:`הזמנה ${o.order_id}: הזמנת ספק נכשלה`,text:'יש לבדוק את השגיאה לפני ניסיון נוסף.'})}return out}
function couponText(c){return c.discount_type==='percent'?`${Number(c.discount_value)}% הנחה`:`₪${Number(c.discount_value).toFixed(2)} הנחה`}
function dt(v){return v?String(v).slice(0,16):''}
function couponCards(){if(!state.coupons.length)return '<div class="muted">עדיין לא יצרת קופונים.</div>';return `<div class="couponList">${state.coupons.map(c=>`<div class="couponCard"><div class="couponHead"><span class="couponCode">${esc(c.code)}</span><span class="pill ${c.active?'ok':'bad'}">${c.active?'פעיל':'כבוי'}</span></div><div class="muted" style="margin-top:7px">${couponText(c)}${Number(c.min_order||0)>0?` · מינימום ₪${Number(c.min_order).toFixed(2)}`:''}${c.usage_limit!=null?` · ${Number(c.used_count||0)}/${Number(c.usage_limit)} מימושים`:''}</div><div class="row"><button class="btn small dark" onclick="editCoupon('${esc(c.code)}')">ערוך</button><button class="btn small" onclick="toggleCoupon('${esc(c.code)}')">${c.active?'כבה':'הפעל'}</button></div></div>`).join('')}</div>`}
function render(){const s=state.settings||{};const alerts=buildAlerts();const bad=alerts.filter(a=>a.level==='bad').length,warn=alerts.filter(a=>a.level==='warn').length;app.innerHTML=`<div class="grid"><section class="panel"><h2>WhatsApp ופרטי קשר</h2><div class="muted">הכול כאן בחינם. לא מדובר ב-WhatsApp API בתשלום — זה כפתור שמוביל ישירות לצ'אט העסקי.</div><label class="toggle"><input id="waEnabled" type="checkbox" ${s.whatsapp_enabled?'checked':''}> להציג WhatsApp באתר</label><div class="field"><label>מספר WhatsApp Business</label><input id="waNumber" value="${esc(s.whatsapp_number||'')}" placeholder="למשל 05... או 972..."></div><div class="field"><label>הודעה התחלתית</label><textarea id="waMessage">${esc(s.whatsapp_message||'היי, אשמח לעזרה לגבי מוצר או הזמנה באתר אלוף הכלים.')}</textarea></div><div class="field"><label>אימייל שירות (אופציונלי)</label><input id="supportEmail" type="email" value="${esc(s.support_email||'')}"></div><div class="field"><label>שעות מענה (אופציונלי)</label><input id="supportHours" value="${esc(s.support_hours||'')}" placeholder="א׳–ה׳ 09:00–18:00"></div><div class="sectionTitle">הגנת רווח להזמנה אוטומטית</div><div class="field"><label>רווח מינימלי להזמנה (₪)</label><input id="minimumProfit" type="number" min="0" step="0.01" value="${s.minimum_profit_ils??''}" placeholder="לדוגמה 20"></div><div class="hint">אם עלות המוצר + משלוח אצל הספק תשאיר פחות מהרווח שהגדרת, המערכת לא תשלח את ההזמנה אוטומטית ותדרוש בדיקה.</div><div class="sectionTitle">תוקף הצעת משלוח לפני תשלום</div><div class="field"><label>כמה דקות הצעת המשלוח תקפה</label><input id="paymentQuoteTtl" type="number" min="5" max="180" step="1" value="${esc(s.payment_quote_ttl_minutes??30)}"></div><div class="hint">אם עבר הזמן הזה, המערכת תחסום התחלת תשלום עד שתחושב הצעת משלוח חדשה. טווח מותר: 5–180 דקות.</div><button class="btn" id="save">שמור הגדרות</button><span id="msg" class="msg"></span></section><section class="panel"><h2>התראות שדורשות תשומת לב</h2><div class="summary"><span class="pill ${bad?'bad':'ok'}">${bad} קריטיות</span><span class="pill ${warn?'warn':'ok'}">${warn} אזהרות</span><span class="pill">${state.products.length} מוצרים</span><span class="pill">${state.orders.length} הזמנות</span></div><div class="alerts">${alerts.length?alerts.map(a=>`<div class="alert ${a.level}"><b>${esc(a.title)}</b><div class="muted">${esc(a.text)}</div></div>`).join(''):'<div class="empty">✓ אין כרגע בעיות שדורשות טיפול</div>'}</div></section><section class="panel full"><div class="couponHead"><div><h2>קופונים</h2><div class="muted">ההנחה מחושבת בשרת ולא בדפדפן, כך שלקוח לא יכול להמציא לעצמו מחיר.</div></div><button class="btn small" onclick="newCoupon()">+ קופון חדש</button></div><div class="couponForm"><div class="couponGrid"><div class="field"><label>קוד *</label><input id="cpCode" maxlength="40" placeholder="WELCOME10" style="text-transform:uppercase"></div><div class="field"><label>סוג הנחה</label><select id="cpType"><option value="percent">אחוזים</option><option value="fixed">סכום בש״ח</option></select></div><div class="field"><label>גובה ההנחה *</label><input id="cpValue" type="number" min="0.01" step="0.01"></div><div class="field"><label>מינימום הזמנה</label><input id="cpMin" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>מקסימום הנחה</label><input id="cpMax" type="number" min="0" step="0.01" placeholder="ריק = ללא הגבלה"></div><div class="field"><label>מגבלת מימושים</label><input id="cpLimit" type="number" min="1" step="1" placeholder="ריק = ללא הגבלה"></div><div class="field"><label>מתחיל בתאריך</label><input id="cpStart" type="datetime-local"></div><div class="field"><label>מסתיים בתאריך</label><input id="cpEnd" type="datetime-local"></div><div class="field"><label class="toggle"><input id="cpActive" type="checkbox" checked> פעיל</label></div></div><div class="row"><button class="btn" id="saveCoupon">שמור קופון</button><span class="msg" id="couponMsg"></span></div></div><div id="couponList">${couponCards()}</div></section></div>`;document.getElementById('save').addEventListener('click',saveSettings);document.getElementById('saveCoupon').addEventListener('click',saveCoupon)}
async function saveSettings(){const btn=document.getElementById('save'),msg=document.getElementById('msg');btn.disabled=true;msg.textContent='שומר...';try{const minProfit=document.getElementById('minimumProfit').value.trim();const ttl=Number(document.getElementById('paymentQuoteTtl').value||30);const d=await api('/api/admin/products',{method:'POST',body:JSON.stringify({action:'settings',whatsapp_enabled:document.getElementById('waEnabled').checked,whatsapp_number:document.getElementById('waNumber').value.trim(),whatsapp_message:document.getElementById('waMessage').value.trim(),support_email:document.getElementById('supportEmail').value.trim(),support_hours:document.getElementById('supportHours').value.trim(),minimum_profit_ils:minProfit===''?null:Number(minProfit),payment_quote_ttl_minutes:ttl})});state.settings=d.settings||{};render();const m=document.getElementById('msg');if(m)m.textContent='נשמר ✓'}catch(e){msg.textContent=e.message==='whatsapp_number_required'?'צריך להזין מספר כדי להפעיל WhatsApp':e.message==='invalid_whatsapp_number'?'מספר WhatsApp לא תקין':e.message==='invalid_payment_quote_ttl'?'תוקף הצעת המשלוח חייב להיות בין 5 ל-180 דקות':'שגיאה בשמירה'}finally{const b=document.getElementById('save');if(b)b.disabled=false}}
function newCoupon(){['cpCode','cpValue','cpMax','cpLimit','cpStart','cpEnd'].forEach(id=>document.getElementById(id).value='');document.getElementById('cpType').value='percent';document.getElementById('cpMin').value='0';document.getElementById('cpActive').checked=true;document.getElementById('cpCode').disabled=false;document.getElementById('couponMsg').textContent=''}
function editCoupon(code){const c=state.coupons.find(x=>x.code===code);if(!c)return;document.getElementById('cpCode').value=c.code;document.getElementById('cpCode').disabled=true;document.getElementById('cpType').value=c.discount_type;document.getElementById('cpValue').value=c.discount_value;document.getElementById('cpMin').value=c.min_order||0;document.getElementById('cpMax').value=c.max_discount??'';document.getElementById('cpLimit').value=c.usage_limit??'';document.getElementById('cpStart').value=dt(c.starts_at);document.getElementById('cpEnd').value=dt(c.ends_at);document.getElementById('cpActive').checked=!!c.active;document.getElementById('cpCode').scrollIntoView({behavior:'smooth',block:'center'})}
function couponPayload(c=null){return {action:'coupon_save',code:c?.code||document.getElementById('cpCode').value.trim(),discount_type:c?.discount_type||document.getElementById('cpType').value,discount_value:c?.discount_value??Number(document.getElementById('cpValue').value),min_order:c?.min_order??Number(document.getElementById('cpMin').value||0),max_discount:c?c.max_discount:(document.getElementById('cpMax').value===''?null:Number(document.getElementById('cpMax').value)),usage_limit:c?c.usage_limit:(document.getElementById('cpLimit').value===''?null:Number(document.getElementById('cpLimit').value)),starts_at:c?.starts_at||document.getElementById('cpStart').value||null,ends_at:c?.ends_at||document.getElementById('cpEnd').value||null,active:c?c.active:document.getElementById('cpActive').checked}}
async function saveCoupon(){const msg=document.getElementById('couponMsg'),btn=document.getElementById('saveCoupon');btn.disabled=true;msg.textContent='שומר...';try{const d=await api('/api/admin/products',{method:'POST',body:JSON.stringify(couponPayload())});const i=state.coupons.findIndex(c=>c.code===d.coupon.code);if(i>=0)state.coupons[i]=d.coupon;else state.coupons.unshift(d.coupon);render();const m=document.getElementById('couponMsg');if(m)m.textContent='נשמר ✓'}catch(e){msg.textContent=e.message==='invalid_coupon_code'?'קוד לא תקין':e.message==='invalid_discount_value'?'גובה ההנחה לא תקין':e.message==='invalid_coupon_dates'?'טווח התאריכים לא תקין':'שגיאה בשמירה'}finally{const b=document.getElementById('saveCoupon');if(b)b.disabled=false}}
async function toggleCoupon(code){const c=state.coupons.find(x=>x.code===code);if(!c)return;try{const payload={...couponPayload(c),active:!c.active};const d=await api('/api/admin/products',{method:'POST',body:JSON.stringify(payload)});const i=state.coupons.findIndex(x=>x.code===code);if(i>=0)state.coupons[i]=d.coupon;render()}catch{alert('לא הצלחנו לעדכן את הקופון')}}
async function load(){try{const [p,o]=await Promise.all([api('/api/admin/products'),api('/api/admin/orders?limit=100')]);state.products=p.products||[];state.settings=p.settings||{};state.coupons=p.coupons||[];state.orders=o.orders||[];render()}catch(e){if(e.message==='unauthorized')app.innerHTML='<div class="panel loginNeeded"><h2>צריך להתחבר לניהול</h2><div class="muted">העמוד הזה מוגן באותה התחברות של ה-Admin.</div><a href="/admin">כניסה לניהול</a></div>';else app.innerHTML='<div class="panel"><b>לא הצלחנו לטעון את הנתונים.</b></div>'}}
load();
</script>
</body>
</html>
