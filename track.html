<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>מעקב הזמנה | אלוף הכלים</title>
<meta name="description" content="בדיקת סטטוס הזמנה באלוף הכלים.">
<style>
:root{--dark:#0b1118;--yellow:#ffc928;--line:#dfe4e9;--muted:#6f7b87;--ok:#197342;--bad:#a51e28}*{box-sizing:border-box}body{margin:0;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f4;color:#171717}.top{background:var(--dark);color:#fff;border-bottom:3px solid var(--yellow)}.topin{max-width:820px;margin:auto;padding:18px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:950}.brand span{color:var(--yellow)}a{color:inherit}.back{text-decoration:none;color:#dbe3ea;font-weight:800}.wrap{max-width:820px;margin:36px auto;padding:0 14px}.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 40px #0001}.box h1{margin:0 0 8px;font-size:30px}.muted{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:900}.field input{width:100%;border:1px solid #cfd5dc;border-radius:10px;padding:13px;font:inherit}.btn{border:0;border-radius:10px;background:var(--yellow);font:inherit;font-weight:950;padding:13px 18px;cursor:pointer}.btn:disabled{opacity:.55}.full{grid-column:1/-1}.error{display:none;margin-top:14px;background:#fff0f0;border:1px solid #ffc8cb;color:var(--bad);padding:11px;border-radius:10px}.error.show{display:block}.result{margin-top:18px}.orderHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid #edf0f2;padding-bottom:14px}.orderId{font-weight:950;font-size:20px;direction:ltr}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#e7f7ed;color:var(--ok);font-size:12px;font-weight:900}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.step{border:1px solid var(--line);border-radius:12px;padding:12px 7px;text-align:center;color:#8a949e;font-size:12px;font-weight:850}.step.on{background:#fff7ce;border-color:#e9c848;color:#322600}.step.done{background:#e9f8ef;border-color:#b7e3c8;color:#166b3b}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.meta div{background:#f7f9fb;border-radius:10px;padding:11px}.meta b{display:block;font-size:12px;color:#66717c;margin-bottom:4px}.saving{color:var(--ok);font-weight:900}.items{margin-top:14px;border-top:1px solid #edf0f2;padding-top:12px}.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1f3f5}.customerNote{margin-top:14px;background:#fff8d8;border:1px solid #eed676;border-radius:11px;padding:12px 14px;line-height:1.55}.customerNote b{display:block;margin-bottom:4px}.lastUpdate{margin-top:12px;color:#7b858f;font-size:12px}.wa{display:none;margin-top:16px;background:#25D366;color:#073b1a;text-decoration:none;text-align:center;border-radius:10px;padding:13px;font-weight:950}.wa.show{display:block}.support{margin-top:18px;font-size:13px;color:#68717c;line-height:1.6}@media(max-width:620px){.grid,.meta{grid-template-columns:1fr}.full{grid-column:auto}.steps{grid-template-columns:1fr 1fr}.box{padding:18px}.box h1{font-size:26px}.topin{padding:15px 13px}.brand{font-size:21px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">אלוף <span>הכלים</span></div><a class="back" href="/">חזרה לחנות</a></div></div>
<div class="wrap"><div class="box">
<h1>מעקב הזמנה</h1>
<div class="muted">הזן את מספר ההזמנה ואת מספר הטלפון ששימש בהזמנה.</div>
<form id="form" class="grid">
<div class="field"><label>מספר הזמנה</label><input id="orderId" dir="ltr" placeholder="AH-..." autocomplete="off" required></div>
<div class="field"><label>טלפון</label><input id="phone" inputmode="tel" autocomplete="tel" required></div>
<div class="full"><button class="btn" id="submit" type="submit" style="width:100%">בדיקת סטטוס</button></div>
</form>
<div class="error" id="error"></div>
<div id="result" class="result"></div>
<a id="wa" class="wa" target="_blank" rel="noopener noreferrer">💬 שאלה על ההזמנה ב-WhatsApp</a>
<div id="support" class="support"></div>
</div></div>
<script>
const $=s=>document.querySelector(s);let store={};let currentOrderId='';
function money(v){return '₪'+Number(v||0).toFixed(2)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalizeWa(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('0'))d='972'+d.slice(1);return d}
function waUrl(orderId){const n=normalizeWa(store.whatsappNumber);if(!store.whatsappEnabled||!n)return null;const base=store.whatsappMessage||'היי, אשמח לעזרה לגבי מוצר או הזמנה באתר אלוף הכלים.';return `https://wa.me/${n}?text=${encodeURIComponent(base+'\nמספר הזמנה: '+orderId)}`}
function statusLabel(o){if(o.status==='cancelled'||o.fulfillmentStatus==='cancelled')return 'בוטלה';if(o.status==='error'||o.fulfillmentStatus==='failed')return 'דורשת בדיקה';if(o.fulfillmentStatus==='delivered'||o.status==='completed')return 'נמסרה';if(o.fulfillmentStatus==='shipped'||o.status==='shipped')return 'נשלחה';if(['ordered','ordering','ready','processing'].includes(o.fulfillmentStatus)||['ordered','processing'].includes(o.status))return 'בטיפול';if(o.paymentStatus==='paid'||o.status==='paid')return 'התשלום התקבל';return 'התקבלה'}
function progress(o){let p=1;if(o.paymentStatus==='paid'||['paid','processing','ordered','shipped','completed'].includes(o.status))p=2;if(['ready','ordering','ordered','shipped','delivered'].includes(o.fulfillmentStatus)||['processing','ordered','shipped','completed'].includes(o.status))p=3;if(['shipped','delivered'].includes(o.fulfillmentStatus)||['shipped','completed'].includes(o.status))p=4;if(o.fulfillmentStatus==='delivered'||o.status==='completed')p=5;return p}
function fmtDate(v){if(!v)return '';try{return new Date(v).toLocaleString('he-IL')}catch{return String(v)}}
function render(o){currentOrderId=o.orderId;const p=progress(o);const shippingQuoted=o.shippingStatus==='quoted';const shippingCost=shippingQuoted?Number(o.shippingCost||0):null;const finalTotal=Number(o.total||0)+(shippingQuoted?shippingCost:0);const steps=['התקבלה','תשלום התקבל','בטיפול','נשלחה','נמסרה'];const items=(o.items||[]).map(i=>`<div class="item"><span>${esc(i.name)} × ${Number(i.qty||0)}</span><b>${money(Number(i.price||0)*Number(i.qty||0))}</b></div>`).join('');const discount=Number(o.discountAmount||0)>0?`<div><b>קופון ${esc(o.couponCode||'')}</b><span class="saving">-${money(o.discountAmount)}</span></div>`:'';const shippingText=shippingQuoted?(shippingCost<=0?'חינם':money(shippingCost)):'בבדיקה';const note=o.customerNote?`<div class="customerNote"><b>עדכון להזמנה</b>${esc(o.customerNote)}</div>`:'';$('#result').innerHTML=`<div class="orderHead"><div><div class="muted">מספר הזמנה</div><div class="orderId">${esc(o.orderId)}</div></div><span class="pill">${statusLabel(o)}</span></div><div class="steps">${steps.map((s,i)=>`<div class="step ${p>i+1?'done':p===i+1?'on':''}">${s}</div>`).join('')}</div><div class="meta"><div><b>סה״כ${shippingQuoted?'':' לפני משלוח'}</b>${money(finalTotal)}</div><div><b>משלוח</b>${shippingText}</div>${discount}<div><b>מספר מעקב</b>${esc(o.trackingNumber||'עדיין לא קיים')}</div></div><div class="items">${items}</div>${note}<div class="lastUpdate">עודכן לאחרונה: ${esc(fmtDate(o.updatedAt))}</div>`;const url=waUrl(o.orderId);const wa=$('#wa');if(url){wa.href=url;wa.classList.add('show')}else{wa.classList.remove('show')}}
async function loadStore(){try{const r=await fetch('/api/products',{cache:'no-store'});const d=await r.json();store=d.store||{};const parts=[];if(store.supportHours)parts.push('שעות מענה: '+store.supportHours);if(store.supportEmail)parts.push('אימייל: '+store.supportEmail);$('#support').textContent=parts.join(' · ')}catch{}}
$('#form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#submit'),err=$('#error');err.classList.remove('show');btn.disabled=true;btn.textContent='בודק...';$('#result').innerHTML='';$('#wa').classList.remove('show');try{const r=await fetch('/api/order-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:$('#orderId').value.trim(),phone:$('#phone').value.trim()})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'not_found');render(d.order)}catch{err.textContent='לא נמצאה הזמנה עם הפרטים האלה. בדוק את מספר ההזמנה והטלפון.';err.classList.add('show')}finally{btn.disabled=false;btn.textContent='בדיקת סטטוס'}});
loadStore();
</script>
</body>
</html>
